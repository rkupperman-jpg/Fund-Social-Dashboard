e emergency borrowing, through a simple majority vote, if revenue falls short.", "eng": 2, "likes": 0, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-29", "text": "Yesterday, the Chicago Board of Education approved the FY26 budget. After months of debate and testimony from parents, educators, labor leaders, elected officials, and community members, the board voted to pass the budget presented by @MacqulineKing and her team.", "eng": 8, "likes": 0, "comments": 1, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-08-29", "text": "Here are the key takeaways for @ChiPubSchools  in SY2025-26:  ✅ No additional school-level cuts. The school budgets principals and Local School Councils approved in June remain protected.", "eng": 4, "likes": 0, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-29", "text": "Here are the key takeaways for @ChicagoPublicSchools in SY2025-26: ✅ No additional school-level cuts. The school budgets principals and Local School Councils approved in June remain protected.", "eng": 1, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-28", "text": "▪️State absorption of CPS’s normal pension costs for these employees, as it already does for teachers", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-28", "text": "'@ChiPubSchools' $734 million deficit includes a proposed $175 million reimbursement payment to the city of Chicago for the Municipal Employees Annuity and Benefit Fund (MEABF).", "eng": 5, "likes": 0, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-08-28", "text": "This pension system covers CPS employees who are not certified educators. Importantly, CPS is not legally obligated to make this payment, and for nearly 100 years, it did not.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-28", "text": "Between 2020 and 2023, the district reimbursed the city using one-time federal COVID-19 relief funds, but those dollars are no longer available. Covering this cost now would mean either cuts to the CPS budget or additional borrowing.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-28", "text": "Public opinion reflects skepticism as only 25% of voters support CPS taking on this responsibility.  💡How can CPS and the city of Chicago resolve the MEABF payment situation? Well, some potential solutions include:", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-28", "text": "▪️The city of Chicago owning the cost of MEABF without expecting any contribution from CPS (at least until the district fixes its structural budget deficit)", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-28", "text": "▪️ A new, dedicated tax levy authorized by the state", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-28", "text": "Feel free to review our full memo on our website: https://t.co/W64B1PQUaw", "eng": 2, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2025-08-28", "text": "Any path forward will require collaboration between CPS, the city of Chicago, and state leaders. What remains clear: addressing this obligation without new revenue would come at a significant cost to students.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-26", "text": "For more insight ⬇️: ", "eng": 1, "likes": 0, "comments": 0, "shares": 1, "type": "Quote", "contentType": "Link"}, {"date": "2025-08-26", "text": "▪️There are funds available as surplus. As the visual shows, the last city of Chicago annual report indicated TIF balances over $3B and a $485M surplus net of all revenue, expenditure, declared surplus, and planned project https://t.co/uCt2ird468", "eng": 7, "likes": 0, "comments": 1, "shares": 2, "type": "'@Reply", "contentType": "Photo"}, {"date": "2025-08-26", "text": "💰What’s a TIF surplus?  Each year, the city of Chicago must declare unspent dollars from certain TIF districts as “surplus.” By state law, CPS is guaranteed about 52% of any declared surplus.  CPS’s FY26 budget proposal includes $379M in TIF surplus from the city; flat from FY25", "eng": 2, "likes": 0, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-26", "text": "As @ChiPubSchools prepares to pass and implement its FY26 budget, sources of additional revenue have been a major focal point over the past months. The most likely revenue source in this cycle? Surplus funds from the city’s Tax Increment Financing (TIF) districts.", "eng": 16, "likes": 0, "comments": 1, "shares": 2, "type": "Post", "contentType": "Text"}, {"date": "2025-08-26", "text": "📈 What assumptions are we making here?", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-26", "text": "▪️That the city will declare a surplus of ~$700M. In that scenario, CPS would receive its share - ~$379M - and the city would receive ~$190M.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-26", "text": "▪️Most experts anticipate the city will need to declare at least some surplus to close its own projected budget gap - estimated at $1.2B.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-26", "text": "🔎Looking ahead The city is exploring options to become less reliant on TIF surplus in the future, but major shifts are not likely before FY27.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-26", "text": "Whatever approach the city takes, CPS is entitled to the related property tax revenue. Long term, property tax revenue not placed in a TIF district account would go directly to CPS; this may be more predictable than the current approach.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-26", "text": "Existing revenue increases related to property taxes may not be enough. Many stakeholders are already advocating for collaborative conversations among state, city, and CPS leadership as soon as this budget cycle concludes.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-26", "text": "Bottom line: A TIF surplus is likely for FY26 and is vital to helping CPS balance its $734M budget deficit. However, it won’t solve CPS’s long-term structural deficit. Later this week, I will discuss how additional funding from the state can help on that front.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-26", "text": "Feel free to review our full memo and stay tuned for more analysis: https://t.co/W64B1PQUaw", "eng": 4, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2025-08-22", "text": "Here’s to a year of learning, growth, and joy.  No matter the challenges ahead, we will face them like Chicago always does— together.", "eng": 1, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-22", "text": "Everything we do is designed to ensure principals and their teams can focus on what matters most: helping every student thrive.  To all school leaders—thank you for your ongoing commitment and service to over 325,000 young people who walk through your doors every day.", "eng": 2, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-22", "text": "This week, Chicago’s classrooms were buzzing again with energy, curiosity, and hope. Even with uncertainties around district finances, the commitment school leaders have to students, families, and their faculty and staff is unwavering (and was on full display).", "eng": 7, "likes": 0, "comments": 1, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-08-22", "text": "Our team at @TheFundChicago is gearing up, too. We’re ready to continue providing resources, professional learning communities, leadership development, and thought partnership to leaders citywide.", "eng": 6, "likes": 1, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-20", "text": "There were also lengthy discussions around three challenging issues...", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-20", "text": "Yesterday, on the second day of school, the Chicago Board of Education held two public hearings on the FY26 budget.", "eng": 8, "likes": 0, "comments": 1, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-08-20", "text": "The good news? There was some real consensus...", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-20", "text": "'@ChiPubSchools (CPS) team members reviewed the proposed plan, and we heard testimony from labor leaders, elected officials, parents, Local School Council members, educators, and nonprofit leaders (including our own Nelson Gerew).", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-20", "text": "✅Engaging the public matters. Families/educators/stdnts must have a voice, especially when choices are toughest ✅Protecting school budgets — already tight — is a shared value ✅All cuts have costs. Central office and citywide savings come w tradeoffs that families already feel", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-20", "text": "⚖️ TIF: The budget estimated TIF surplus revenue at $379M, level with last year. Some Board Members questioned whether the city would release those funds in the year ahead; some Aldermen testified that a TIF surplus is likely needed to close Chicago's budget gap. I", "eng": 2, "likes": 0, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-20", "text": "In any case, CPS is entitled to 52% of any surplus declared by the city.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-20", "text": "🏛️ MEABF: Legally, this pension payment is a city obligation, though CPS reimbursed the city for a few cycles.  The CPS budget includes at least partial reimbursement to the city if revenues exceed assumptions.", "eng": 2, "likes": 0, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-20", "text": "One other thing everyone seemed to agree on? 🚫 Choosing between bad options to keep schools whole is not sustainable.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-20", "text": "The first step toward stability is passing a responsible budget next week. Only then can conversations about future investments in our students truly begin with the city, the state, and other partners.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-20", "text": "💸 Debt: CPS budget &amp; finance leaders strongly urged against including new borrowing for operations, warning it could jeopardize refinancing savings &amp; cost much more. Some Board members asked for more explicit flexibility in the budget to account for unexpected revenue challenges", "eng": 4, "likes": 1, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-18", "text": "FIRST DAY! Educators, I see you up early, attending to details your students will FEEL. Caregivers, I see you checking those supply lists and snapping those pics. Sending extra hugs to those experiencing first-firsts and last-firsts as educators or parents today. We got this! https://t.co/SZz09WTqvU", "eng": 7, "likes": 5, "comments": 0, "shares": 1, "type": "Post", "contentType": "Video"}, {"date": "2025-08-15", "text": "Review more information on CPS’ FY26 budget here: https://t.co/3lOd384axW", "eng": 14, "likes": 1, "comments": 0, "shares": 2, "type": "'@Reply", "contentType": "Link"}, {"date": "2025-08-15", "text": "Revenue: The budget assumes $379M in tax increment financing (TIF) surplus, equal to FY25. The city likely needs TIF surplus to balance its own budget, and CPS is entitled to 52% of any surplus declared.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-15", "text": "Reductions and cuts: The budget includes $293M in cuts to central office departments and citywide services. $165M was identified in June, including changes in food service and delays to non-essential maintenance. Another $126M was announced on Wednesday.", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-15", "text": "On Wednesday, @ChiPubSchools (CPS) released its FY26 proposed budget. In a world of tough decisions, CPS leadership avoided additional cuts to schools, protecting the budgets principals and Local School Councils approved in June.", "eng": 37, "likes": 4, "comments": 1, "shares": 4, "type": "Post", "contentType": "Text"}, {"date": "2025-08-15", "text": "The budget also includes a level increase in state funding of $76M as CPS’ need status in Illinois increased from Tier 2 to Tier 1. Tier 1 districts statewide receive priority for equity-based funds.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-15", "text": "The budget also indicates CPS would reimburse the city for a portion of non-teacher pension costs if additional revenue, above the TIF and state funding assumed, is received.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-15", "text": "Borrowing: No loan provision is included in the budget, as revenue and expenses are balanced with the assumptions outlined above. In public polling and community conversations earlier this year, taking a loan was an unpopular option.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-15", "text": "For reference, the FY26 budget already includes $1B in debt service for long-term loans, and an additional $23M was for interest from short-term loans to manage cash flow.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-15", "text": "Overall, central office staff will decrease from 1,662 in FY25 to 1,509 in FY26, a 10% decrease. Beyond layoffs, these cuts include a freeze on hiring and a delay in planned IT projects.", "eng": 5, "likes": 0, "comments": 2, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-15", "text": "CPS and the Chicago Board of Education will hear public reactions to the budget on Tuesday, August 19, at 1 p.m. and 4:30 p.m. I’ll be in the afternoon session and will share my thoughts on what we hear next week.", "eng": 9, "likes": 1, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-15", "text": "On Wednesday, @ChiPubSchools released its FY26 proposed budget. In a world of tough decisions, CPS leadership avoided additional cuts to schools, protecting the budgets principals and LSCs approved in June.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-08-12", "text": "Review the EAC’s 2025 policy recommendations here: https://t.co/bUZakPH607", "eng": 2, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2025-08-12", "text": "These conversations will continue throughout the fall and help shape our policy agenda for 2026. However, our goal remains the same: to improve conditions that allow principals to focus on what matters most—the needs of students and families.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-12", "text": "That way, they can adjust accordingly and build investment with educators, parents, and other key stakeholders within their school communities.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-12", "text": "As our policy and advocacy work continues to evolve, we aim to incorporate additional school leader voices. Last week, we brought together groups of principals from across the city for a series of policy conversations.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-12", "text": "They also shared that transparency and communication matter. Even when there’s disagreement, understanding the why behind a decision—and how it impacts their school community—is essential.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-12", "text": "Despite ongoing budget uncertainty and leadership changes at the district level, one thing was clear: principals remain committed to doing whatever it takes to ensure students have the resources and support they need.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-12", "text": "For the past 2 yrs, members of our EAC have crafted recommendations for specific policy changes that we then share broadly with key stakeholders. In March, the group of 30 principals used their shared experiences to generate recommendations to address staff shortages in CPS.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-12", "text": "One way @TheFundChicago  attempts to show appreciation for school leaders is by listening to their perspectives and turning that feedback into action. Their insight shapes how we advocate for and support school leaders through our programming and policy agenda.", "eng": 9, "likes": 1, "comments": 1, "shares": 2, "type": "Post", "contentType": "Text"}, {"date": "2025-08-06", "text": "While these cuts were made centrally to prevent cuts at schools, they do matter. CPS sent a series of communications last week highlighting how these changes might impact daily school operations.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-06", "text": "🍽️ Meal service: Free breakfast and lunch will stay throughout the district. However, menus may be simpler on some days, with more cold meals. After-school meals will switch to packaged snacks instead of hot meals.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-06", "text": "🏫 Building maintenance: School leaders were told to expect updated cleaning schedules and slower responses to non-urgent fixes. Staff will continue to prioritize essential repairs to keep schools clean and safe.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-06", "text": "As part of their 2025-26 budget process, and to address the $734 million deficit, @ChiPubSchools  recently announced cuts to central office departments and services.", "eng": 25, "likes": 4, "comments": 1, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-08-06", "text": "🏥 Student health services: There will be fewer school-based vaccines and physicals, but help is still available. Families can contact Healthy CPS at 773-553-KIDS for more details.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-06", "text": "🕒 New start times: Some schools will have new bell schedules to help buses serve more routes. Families affected by these changes are already aware.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-06", "text": "🛑 Crossing guards &amp; Safe Passage: Both crossing guards and Safe Passage are still in place, but they will operate with fewer staff and adjusted hours. No school is losing support entirely, and further details are still forthcoming.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-04", "text": "You can read the full testimony here: https://t.co/9VyPX9hGTT", "eng": 5, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2025-08-04", "text": "Last week, our chief public affairs officer, Nelson Gerew, was invited to testify at the Illinois House Executive Committee subject-matter hearing on the @ChiPubSchools budget. https://t.co/cbGdrCiVuN", "eng": 11, "likes": 2, "comments": 1, "shares": 0, "type": "Post", "contentType": "Video"}, {"date": "2025-08-04", "text": "During his testimony, Nelson provided a historical overview of the district's finances from 2008-2025. Understanding this history is essential for establishing a solid financial foundation for the district's future.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-25", "text": "🚫 Cutting school budgets or vital student supports: in two-thirds of all conversations, participants stated that they opposed any cuts at the school level.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-25", "text": "📣 At yesterday’s Chicago Board of Education meeting, Interim CEO Dr. King reinforced what CPS heard loud and clear from families, educators, and community members during 5 recent budget conversations. She highlighted the public’s support for:", "eng": 4, "likes": 0, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-07-25", "text": "✅ identifying new revenue sources in partnership with the city of Chicago and the state of Illinois: 77% of small group conversations talked about the need for more revenue, and 71% cited a need to engage with policymakers.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-25", "text": "✅ distributing resources more equitably: inequity in CPS was a topic of conversation in 60% of small groups.  ✅ centering community voices in decision-making: 60% of groups agreed that the district needs to continue engaging the community.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-25", "text": "During the meeting, Chief Budget Officer Mike Sitkowski also gave a detailed report outlining additional feedback learned during the conversations. He emphasized that the community opposes:", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-25", "text": "🚫 Reimbursing the city for MEABF: whenever the topic was brought up, participants stated that CPS should not make this payment.   🚫 Taking on new loans: in 77% of conversations around borrowing, participants opposed loans to meet operating expenses.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-25", "text": "Of course, we know the solutions aren’t simple. And, with the budget release date set for August 13, the timeline is tight. But this feedback offers important pause points as decisions are made.", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-25", "text": "💬 One thing is certain: school communities expect to be part of the process. And their voices are important in guiding the path forward.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-21", "text": "Principals and schools are already being asked to do more with less. Additional reductions would have serious consequences.", "eng": 1, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-21", "text": "⚠️ The bottom line: schools are already feeling the strain. And with CPS currently projecting a $734M deficit, more than three times the original $229M estimate, the risk of deeper cuts remains real.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-21", "text": "▪️ Even schools that gained discretionary dollars saw modest increases, just $32K on average.  Notably, schools purchased 11 fewer Assistant Principal positions with discretionary funds; that’s a 10% decline.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-21", "text": "📈 Historically, about 80% of impacted staff are rehired elsewhere in CPS, as budgets shift and schools adjust staffing to evolving student needs. Still, the scale of these layoffs is significant.  💡 Now that school-level budgets are posted, we know a bit more.", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-21", "text": "Compared to 2024–25, we saw that:  ▪️ 303 schools maintained/gained teachers ▪️ 194 schools lost teachers ▪️ 166 schools maintained/gained discretionary funds ▪️ 331 schools lost discretionary funds, by an average of $65K each", "eng": 3, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-21", "text": "🛑 Included in these budgets are more than 1,450 school-based layoffs:  ▪️ 432 teachers ▪️ 677 Special Education Classroom Assistants (SECAs) ▪️ 349 other staff  That’s roughly 4% of the 32,000+ school-based positions budgeted in 2024–25.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-21", "text": "📊 On July 11, Chicago Public Schools (CPS) released final school budgets for the 2025–26 school year. These budgets reflect planning done by principals back in early June, based on a projected $229M deficit.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-07-16", "text": "There’s still a lot ahead of us. But after last night, I am feeling the extra motivation I needed to finish the project that’s been on my to-do list for the last few weeks and maybe send this follow-up email (after a long day of back-to-back meetings).", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-16", "text": "While our team regularly has the privilege of working alongside Chicago’s school leaders, I’m always especially inspired when we get to pause and connect like this.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-16", "text": "We are more ready than ever to support you as we launch the 2025-26 school year.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-16", "text": "Your plans for the year ahead are bold and student-centered. Your clarity about the challenges—especially in the face of continued budget uncertainty—is sobering, but your leadership is a powerful reminder of why this work matters.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-16", "text": "As leaders from across the city gathered to celebrate summer, a few themes stood out: your continued commitment to young people, your belief in our shared future, and your gratitude for one another.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-16", "text": "Grateful doesn’t begin to capture how I felt leaving last night’s Summer Leadership Institute HH. The energy in the room, the laughter, the ideas, the honest reflection—it’s the kind of spark that sustains me during those long, meeting-packed days when motivation can run low https://t.co/cMOa3lHQhJ", "eng": 38, "likes": 6, "comments": 1, "shares": 2, "type": "Post", "contentType": "Photo"}, {"date": "2025-07-11", "text": "We’re committed to supporting school leaders through every challenge and helping you plan for what’s next.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-11", "text": "✅RSVP for summer opportunities here: https://t.co/ldHfdyBT3g  Check out the upcoming Masterclass on middle school advisory planning!", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2025-07-11", "text": "✅Stop by our SLI table at the vendor fair on Tuesday, July 15, from 10:30 am - 3:00 pm to learn about programs in 2025-26. Our professional development experts, Jen Cervantes and E.J. Dubinsky, will be there with information about how we’ll support leaders this school year.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-11", "text": "✅Join us for a happy hour to connect with fellow leaders later that evening at TNT Rooftop.  RSVP here: https://t.co/EIhuo2VjVq https://t.co/KFW50ECq6L", "eng": 4, "likes": 0, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Photo"}, {"date": "2025-07-11", "text": "Chicago school leaders — let’s connect.  The Fund team will be at the Summer Leadership Institute next week to talk about how we can support you and your teams in the year ahead, especially as you plan for SY25-26:", "eng": 3, "likes": 0, "comments": 1, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-07-08", "text": "The numbers are tough — and the timeline is tight.  In June, @ChiPubSchools principals and Local School Councils finalized budgets based on a projected $229M budget deficit scenario.  Interim CEO King, has emphasized that the actual gap between revenue and expenditures is $734M.", "eng": 18, "likes": 0, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-07-08", "text": "☑️ Chicagoans don’t want more cuts.  An April 2025 poll of 1,100 voters found just 26% support reducing school budgets and only 19% support furlough days.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-08", "text": "That leaves $505M between the first scenario and the current reality.  Dr. King and her team have less than two months to close the gap. CPS must meet an August 29 deadline for passing an FY26 budget. The challenges are clear:", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-08", "text": "⛔ Principals don’t have slack.  In The Chicago Public Education Fund 2025 Principal Engagement Survey, principals named budget cuts, limited resources, and facility challenges among their top concerns.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-08", "text": "What’s Next?  Starting next week, CPS is hosting: ✅ 5 community feedback sessions (share your voice) ✅ 2 expert learning sessions (explore solutions)", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-08", "text": "I’m encouraged by CEO King’s commitment to transparency and collaboration. There are no easy fixes, but an open, inclusive process gives Chicago the best shot at real solutions.  Learn more about the upcoming community feedback sessions:  https://t.co/hdIkMWCQOp", "eng": 3, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2025-07-08", "text": "💳 Borrowing isn’t an easy option.  Only 8% of voters favor it. CPS is already paying $800M+ annually in interest. Without a long-term plan, borrowing now only deepens next year’s crisis.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-03", "text": "Without real investment and long-term planning, CPS cannot meet the needs of its most vulnerable students.⬇️ ", "eng": 3, "likes": 0, "comments": 0, "shares": 0, "type": "Quote", "contentType": "Link"}, {"date": "2025-07-01", "text": "Later this week, I’ll talk a little about CPS’s previous experience with borrowing to pay for operating expenses and about what that might look like this year.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-01", "text": "Long-term debt makes long-term capital improvements possible. But this isn’t about paying for buildings that will be here in 80 years - it’s paying for day-to-day operations.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-01", "text": "And our debt load is already relatively high. CPS’s debt service cost is about 9% of total revenue. In recent years, it’s been as high as 10 to 15%. New York? 5% Los Angeles? 7%", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-01", "text": "🛑Consider this: In FY25, CPS had total revenue of $9.34M. Of that, $800M was unavailable to meet today’s student needs.    Why? It was paying interest on $9B in long-term debt that CPS holds.   Some borrowing is inevitable in a district as large as Chicago.", "eng": 2, "likes": 0, "comments": 2, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-01", "text": "That might be worth it to build or repair a building we will use for decades. It’s harder to make the case when borrowing pays for day-to-day costs like transportation or student supplies.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-01", "text": "Of course, debt has to be repaid. Borrowing today means revenue has to be diverted from teachers, programs, and services for many years in the future.", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-01", "text": "One option to narrow the gap without further negative impact on the stdnt experience?   Borrowing.   CPS issues debt and uses other financial instruments to support capital needs, like constructing and maintaining schools. Borrowing also helps manage cash flow and liquidity needs", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-01", "text": "'-The $229M previously identified as the gap.  -$300M to account for the gap widening if expected revenue doesn’t materialize.  -$175M to reimburse the city for costs related to pension expenses for non-teaching staff. -$30M for costs related to the transition of ACERO schools.", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-07-01", "text": "🔃 Last week, Chicago Public Schools (CPS) Interim CEO Dr. Macquline S King outlined a projected $734M gap between the district’s anticipated obligations and committed revenue.  What’s included in this number?", "eng": 40, "likes": 0, "comments": 1, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-06-20", "text": "At @TheFundChicago listening to school leaders is core to our mission.  Every year, we ask Chicago’s principals and assistant principals what they need to succeed.  📊 If you’re deep into the data, I encourage you to check out the full report here: https://t.co/Qb7wdlskvw.", "eng": 8, "likes": 0, "comments": 1, "shares": 1, "type": "Post", "contentType": "Link"}, {"date": "2025-06-20", "text": "✔️The Need for Support is Up, too: Only 52% of leaders feel they have the tools they need to do their jobs well. That’s an 11-point drop from last year. Leaders consistently point to the need for more help with instructional leadership, school climate, and staff management.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-20", "text": "A few highlights: ➕ Satisfaction is Up: 70% of principals and 80% of assistant principals report feeling satisfied in their roles, a positive sign of strong connection to their schools and communities.", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-20", "text": "🏫 Chronic Absenteeism Remains a Crisis: With 40% of students chronically absent, leaders are searching for practical strategies, and peers to work alongside, to improve student engagement and attendance.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-20", "text": "In the months ahead, we’ll partner with @ChiPubSchools, @ChiPrincipals, and @CpsLeaders  to analyze the data, host focus groups, and refine our support strategy for 2025–26.", "eng": 3, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-20", "text": "The survey is only the first step. We are already launching new programs, publishing case studies, and creating more opportunities for leaders to shape solutions.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-12", "text": "We’ve been glad to support Dr. King in her career as a CPS principal, and look forward to partnering with her as she steps into this new role.", "eng": 4, "likes": 1, "comments": 0, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-12", "text": "➡️Dr. King also participated in The Fund’s PLCs on multiple occasions, including in 2021-22 &amp; 2022-23. We hope those experiences, both in her role as a school leader and in her expanded capacity &amp; citywide focus, have helped guide her leadership and stdnt-focused decision-making.", "eng": 5, "likes": 1, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-12", "text": "For 15 years, from 2007 through 2022, Dr. King served as a CPS principal, first at Dumas Technology Academy, located in Woodlawn, and then at Courtenay Language Arts Center, located in Uptown.", "eng": 3, "likes": 1, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-12", "text": "➡️In 2017-18, Dr. King participated in the Cahn Fellows Program, a leadership development program for strong principals, operated in partnership with Teacher’s College at Columbia. The Fund supported Cahn Fellows for 6 years, from 2016-17 to 2021-22.", "eng": 3, "likes": 1, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-12", "text": "Dr. King has spent the majority of her career in CPS, serving as a teacher for 12 years, and earning National Board Certification before pursuing school leadership through New Leaders in 2006-07.", "eng": 7, "likes": 1, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-12", "text": "Last evening, the Chicago Board of Education selected Dr. Macquline King, current Senior Director of Education Policy for the City of Chicago as interim Superintendent (CEO). She will lead the district while the search for a permanent CEO/Superintendent continues.", "eng": 15, "likes": 1, "comments": 1, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-06-09", "text": "Last week, it was reported that the Chicago Board of Education had identified three finalists for the interim CEO role:  🔹 Dr. Alfonso Carmona  🔹 Dr. Macquline King  🔹 Chief Nicole Milberg", "eng": 36, "likes": 2, "comments": 1, "shares": 2, "type": "Post", "contentType": "Text"}, {"date": "2025-06-09", "text": "According to a recent Fund poll, Chicagoans want a leader who knows our students, understands the system, and can deliver results. We’re encouraged to see a focus on those qualities reflected in the finalists.", "eng": 2, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-09", "text": "Each brings CPS principal experience, a commitment to student outcomes, and experience leading through complex staffing and budget challenges in various contexts and at some scale.  Of course, the job ahead is big.", "eng": 4, "likes": 1, "comments": 2, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-09", "text": "Over the coming months, the interim CEO will need to:  💰 Finalize and pass the district budget  🤝 Partner with principals and central teams to ensure a smooth school opening  📅 Launch the 2025–26 SY with clear expectations and balanced supports for students and families", "eng": 3, "likes": 2, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-09", "text": "Whoever is selected, The Fund is ready to partner in support of Chicago’s students, educators, and school communities. To start, we rolled out program options for 2025–26 to principals and aspiring principals last week.  https://t.co/QJClIGYprv", "eng": 7, "likes": 2, "comments": 0, "shares": 1, "type": "'@Reply", "contentType": "Link"}, {"date": "2025-06-06", "text": "Because the work in schools never stops, today, we are looking ahead to support school leaders and their teams in the 2025-26 school year.  Registration for programs is now open!   ➡️https://t.co/QJClIGYprv", "eng": 7, "likes": 2, "comments": 0, "shares": 1, "type": "'@Reply", "contentType": "Link"}, {"date": "2025-06-06", "text": "✅ Expanded our Educator Advisory Group to learn from school leaders as we shape our program approach and policy agenda  And so much more!", "eng": 3, "likes": 2, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-06", "text": "Together, we: ✅ Concluded the first cohort of the Malott Educator Fellowship, with the goal of retaining strong leaders in the schools that need them the most  ✅ Built out the Local School Council Working Group to strengthen community decision-making", "eng": 3, "likes": 2, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-06", "text": "This year, The Fund supported over 250 educators—principals, assistant principals, and other school leaders, whose work reached more than 140,000 students across Chicago Public Schools.", "eng": 5, "likes": 2, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-06", "text": "Last night, we closed out the 2024–25 school year with more than 100 educators, partners, and civic leaders—a powerful reminder that when we come together on behalf of Chicago’s students, we get results. https://t.co/sxz8sIn4R3", "eng": 84, "likes": 8, "comments": 1, "shares": 1, "type": "Post", "contentType": "Photo"}, {"date": "2025-06-04", "text": "On May 31, students, educators &amp; community members came together to reflect on what’s working—and what needs to change in our schools. A few takeaways 🧵:", "eng": 9, "likes": 1, "comments": 1, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-06-04", "text": "3/ And of course, all eyes are on the next CPS CEO. The ask? A leader who listens, leads with heart, and puts students first.", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-04", "text": "4/ At @thefundchicago, we believe the answers are in the room—with educators, students, &amp; families. We’re committed to ensuring their voices shape what comes next.", "eng": 1, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-04", "text": "2/ What do schools need most? We heard a few big themes: 📚 More books, less screen time 🎨 Expanded arts &amp; trades 🛡️ Safe, reliable transportation 🍎 Continued investment in educators", "eng": 2, "likes": 0, "comments": 2, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-06-04", "text": "1/ Led by CBOE members @VOTE4CHE and @BoyleFor9 and supported @MonicaSRosen and The Alma Group as well as the Academy for Local Leadership, the conversation was rich with real stories—about teachers who inspire, principals who lead with care, and students committed to learning.", "eng": 4, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-23", "text": "What happens to schools if CPS has to cut budgets beyond current levels? Yesterday, I shared how a deficit greater than $229M could lead to reductions in school budgets. Today, I want to show what that could mean for individual schools. 🧵", "eng": 28, "likes": 0, "comments": 1, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-05-23", "text": "🔍 First, a reminder: Current school budgets are flat compared to last year — but they assume CPS will secure $300M in new revenue. If that revenue doesn’t come through, the deficit could swell to $529M or more. That would mean almost all school communities would face real cuts.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-23", "text": "A seemingly modest reduction in the core student-teacher ratio — say, from 26:1 to 27:1 — would mean cutting two core teachers and one holistic teacher. This could have a material and negative impact on student experience and could limit learning opportunities.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-23", "text": "In general, cuts would impact foundational staffing and discretionary spending levels, which will mean less academic, social, and emotional support for students citywide.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-23", "text": "📉 What could that look like? Foundational Staffing: A typical large preK-8 school in Chicago has 1,000 students and 47 teacher positions. That’s one core teacher for every 26 students (39 teachers) and one holistic teacher for every five core teachers (8 teachers).", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-23", "text": "The CPS budget is complex, from MEABF to TIFs to funding formulas, but the impact on kids is clear. We need to make sure principals and LSCs aren’t forced to eliminate essential supports for their students. Let’s be honest about the impact of additional budget cuts.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-23", "text": "Flexible Funding: A typical small preK-8 school has about 300 students and receives around $200K in flexible funds. That’s enough to cover an additional teacher position and additional after-school programming, and allow for teachers to meet and plan outside of regular hours.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-23", "text": "A reduction by one-third — to $134K — is barely enough to cover that teacher position, and it would mean no planning time or after-school supports. A two-thirds reduction? It’s not enough to cover almost any staff position.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-23", "text": "📊 This would play out in every school, adding up to: $529M deficit = 1,500+ potential teacher layoffs $700M deficit = 2,500+ potential teacher layoffs", "eng": 4, "likes": 0, "comments": 1, "shares": 2, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-22", "text": "🧮 Here’s what we know: Last week, principals and LSCs received school budgets based on a $229M deficit, the best-case scenario. CPS can close a $229M deficit with cuts to centrally-provided services and keep overall school budgets flat — at about $5B across all schools.", "eng": 2, "likes": 0, "comments": 2, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-22", "text": "1. Alter the foundational position formulas: In FY25, over 13,000 teacher positions were allocated via these formulas. Reducing this total by 500 teacher positions — one per school on average — would save just ~$60M, while reducing student supports everywhere.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-22", "text": "❗But overall flat funding doesn’t mean unchanged budgets. CPS school funding formulas reflect both enrollment and student need, and these change from year to year. Most schools will still face trade-offs. That’s why we’re working with partners to support principals and LSCs now.", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-22", "text": "❓But what if the deficit is larger? $529M? $734M? More? District-wide school-level budget cuts are likely, and CPS could:", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-22", "text": "What could Chicago schools face if the CPS deficit grows? There are multiple scenarios for CPS’ FY26 budget deficit, ranging from $229M to $1B+. That's driven by uncertain revenues and big-picture cost drivers. Where Chicago lands has real implications for schools. 🧵", "eng": 23, "likes": 1, "comments": 2, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-05-22", "text": "2. Cut flexible funding: School communities use these resources for additional positions, supplies, programming, and meeting other student needs. Reducing this by a third — an average of $132K/school — would save only around $80M and would mean fewer services for students.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-22", "text": "School leaders are already working hard to meet student needs under the current conditions. If revenue assumptions don’t hold, they may be asked to do much more with even less. I’ll share more on what those difficult choices could look like tomorrow.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-22", "text": "💡 Taking these tough steps would only yield ~$140M in savings on top of the central cuts of $239M. The cuts required to close a $529M deficit would likely be double what is described above in most schools. And, the larger the deficit, the more drastic the cuts will need to be.", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-19", "text": "CPS schools face the most complex budget season since 2017. 60% of principals haven't dealt with flat or deficit budget scenarios. They need clarity on trade-offs, time to plan, and communication support. @TheFundChicago is providing tools to help them before the June 5 deadline. https://t.co/r9VE5v", "eng": 49, "likes": 3, "comments": 1, "shares": 1, "type": "Post", "contentType": "Photo"}, {"date": "2025-05-16", "text": "Still feeling energized from Wednesday night’s Tapestry: Weaving Equity for Arts Education event with Nicole Upton and the @IngenuityChgo. 👏 Congratulations to our fellow honorees. We're all united by a shared belief: School leadership and the arts are essentials, not extras. https://t.co/2z1295EFeA", "eng": 10, "likes": 1, "comments": 0, "shares": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-05-14", "text": "Mariel spoke today to emphasize the need for a transparent and flexible budget process and to highlight the support we will provide to principals, Local School Councils, and their teams. ", "eng": 19, "likes": 5, "comments": 0, "shares": 0, "type": "Quote", "contentType": "Link"}, {"date": "2025-05-09", "text": "The Fund is committed to working closely with other key stakeholders to ensure school leaders and LSCs have the support they need, now and in the months ahead.  Let’s keep listening. Let’s stay flexible. Our leaders—and the students they serve—are counting on it.", "eng": 2, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-09", "text": "🔹 Information and time make better decisions possible.  Principals want timely, transparent data on the district’s budget process, and enough time to engage their teams and communities in thoughtful planning.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-09", "text": "🔹 Flexibility at the school level is essential.  As deficits grow, so must local decision-making authority. Leaders and Local School Councils (LSCs) need the room to make the right trade-offs for their students.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-09", "text": "For over 60% of CPS principals, this will be their first time managing through such a deficit, and they’re doing so amid major leadership transitions at the district level. This week, I spent time with more than two dozen principals and program partners. Here’s what I heard:", "eng": 7, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-09", "text": "🔹 The deficit is real, and leaders are already planning.  They’re thinking hard about protecting the student experience in the face of financial constraints and political uncertainty.", "eng": 3, "likes": 0, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-05-09", "text": "Chicago’s school leaders are facing real challenges — and showing real resolve. As I’ve shared, Chicago Public Schools (CPS) is confronting its first significant budget deficit since 2017.", "eng": 21, "likes": 1, "comments": 2, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-04-23", "text": "Chicago Public Schools is facing a projected $539M budget gap in 2026.  There’s no single fix—but we do need to talk about Tax Increment Financing (TIF). 🧵", "eng": 19, "likes": 1, "comments": 1, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-04-23", "text": "🙋‍♀️ What’s a TIF?  It’s a tool cities use to boost development in specific neighborhoods.  The city “freezes” how much tax money schools &amp; others get, and uses the anticipated and new tax revenue to fund projects like roads &amp; parks in that same area.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-04-23", "text": "💰 Chicago has been using TIFs since 1983.  There are ~136 TIF districts.  They last 23 years, but the city can request that the state extend them for an additional 12 years.  In Dec 2024, 8 TIFs got extended. Another 10 could follow by 2027.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-04-23", "text": "🏫 But here’s the catch:  While a TIF is active, CPS and other agencies do not receive the new tax revenue.  In 2025 alone, $1.2B went into TIF funds.   CPS says it’s missing out on ~$600M/year that could support students and staff.", "eng": 4, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-04-23", "text": "🛠️ So what could help?  ✅ Declare more surpluses ✅ Shrink some TIFs ✅ End others entirely  Each step would mean more funding (and would require real discussion!).", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-04-23", "text": "💸 What’s a TIF surplus?  If a TIF has money left over, the city must return it to public agencies, including CPS.  Since CPS receives approximately 50% of property taxes, it also receives approximately 50% of the surplus.  In FY25, CPS received $298M, up from $159M in FY24.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-04-23", "text": "TIFs are complicated and a powerful tool.  If we’re serious about fully funding our public schools, we must talk more about them.", "eng": 1, "likes": 1, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-04-21", "text": "Stay tuned for more potential solutions later this week.", "eng": 2, "likes": 0, "comments": 0, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-04-21", "text": "Closing the gap = raising revenue, cutting costs, or both.  Options are limited.  The City of Chicago could increase TIF funding again (as they did in FY25).", "eng": 2, "likes": 0, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-04-21", "text": "🚨 Chicago Public Schools is projecting a $529M deficit for FY26.   Biggest driver: $355M in one-time COVID $ disappears  $484M in expense growth  Only ~$310M in new revenue expected  Math = major shortfall. https://t.co/lpLHRDQhI4", "eng": 19, "likes": 0, "comments": 1, "shares": 2, "type": "Post", "contentType": "Photo"}, {"date": "2025-04-21", "text": "Even if CPS cut EVERYTHING but schools + pensions, they'd only save ~$300M. Cuts will still hit schools.  And the gap could grow:  +$175M city pension bill  Cuts to Title I, Medicaid, school meals? TBD.", "eng": 6, "likes": 0, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-04-11", "text": "I started #APWeek25 outside my comfort zone with a video thanking assistant principals. I ended it in my favorite place - schools! In between, our team hosted a happy hour where we celebrated with our partners at the @CpsLeaders and @ChiPrincipals. https://t.co/etINMQ4xPQ", "eng": 8, "likes": 2, "comments": 0, "shares": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-04-08", "text": "It's #APWeek25, which means I got over a deep dislike of myself on video to share an even deeper appreciation for the work of Chicago's assistant principals.   👏 Be sure to thank an AP in your world this week. The work is hard, and a little bit of gratitude goes a long way. 👏 https://t.co/DndOYNSOSH", "eng": 2, "likes": 0, "comments": 0, "shares": 0, "type": "Post", "contentType": "Video"}, {"date": "2025-04-08", "text": "It's hashtag#APWeek25, which means I got over a deep dislike of myself on video to share an even deeper appreciation for the work of Chicago's assistant principals.   Be sure to thank an AP in your world this week. The work is hard, and a little bit of gratitude goes a long way. https://t.co/AY8z8IB", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "Post", "contentType": "Video"}, {"date": "2025-03-21", "text": "Educator friends: YOU GOT THIS. Spring Break is almost here! https://t.co/R5gGgOW5X2", "eng": 1, "likes": 1, "comments": 0, "shares": 0, "type": "Post", "contentType": "Video"}, {"date": "2025-03-04", "text": "If we truly believe in competition, innovation, and American excellence, we can’t afford to overlook that.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-03-04", "text": "A few weeks ago, I wrote about Title I, one of the federal education programs reduced to sound bites in the media right now. Let’s take a step back. In 1965, our country made a national commitment: A child’s zip code should not determine their destiny.", "eng": 17, "likes": 2, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-03-04", "text": "Title I was created to ensure that talent and potential—no matter where they exist—are met with opportunity. Here’s the reality: Even in strong schools, students from communities with less inherited wealth face additional hurdles.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-03-04", "text": "Look at George Westinghouse College Prep in Chicago’s East Garfield Park. It’s a high-performing, selective-enrollment high school with 80% of students taking advanced coursework—compared to about 25% statewide.", "eng": 3, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-03-04", "text": "Without this funding, experiences that fuel innovation and upward mobility—like advanced coursework and hands-on technology—would be out of reach.  That’s not just unfair; it’s shortsighted.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-03-04", "text": "That stat alone is impressive. But here’s what might surprise you: 73% of Westinghouse students come from low-income backgrounds, according to the state’s report card. That percentage qualifies the school for about $3,000 per student in federal funds.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-03-04", "text": "With that investment, the school can provide: 📌 Technology &amp; instructional resources—ensuring students work with the digital tools required to compete in today’s economy.  📌 Daily access to iPads, Chromebooks, and charging carts— a necessity for interactive learning.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-03-04", "text": "📌 STEM &amp; career partnerships—connecting students to fields like healthcare, architecture, and engineering, preparing them for high-value careers.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-02-27", "text": "At a time when so much is happening in and around education, learning from and honoring this history feels more important than ever. I hope you’ll take a moment to read, reflect, and celebrate the legacy of leaders like Mayor Washington—this month and always.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-02-27", "text": "His commitment to community-led schools laid the foundation for stronger public education in Chicago, which ultimately helped increase high school graduation rates from under 50% in the 1990s to 86.4% in 2024.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-02-27", "text": "I’ve linked a powerful piece by Dr. Albert Bennett that explores how the education summit at the start of Mayor Washington’s second term led to the creation of Local School Councils—structures that remain vital to our schools today.  https://t.co/lhButGcQIQ", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2025-02-27", "text": "Black History is Chicago history—every day of the year. BHM gives us the opportunity to amplify the stories and leadership that continue to shape our city. This year, my team has been engaged in supporting LSCs, which has led us to reflect on the vision of Mayor Harold Washington https://t.co/6Okt91", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-02-18", "text": "This is a powerful reminder of the opportunity ahead for the Board of Education and an important caution about what’s at stake for Chicago’s learners.", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-02-18", "text": "\\\"If the new board rises to the occasion, CPS could become the national model for large urban districts — improving stdnt outcomes despite financial turmoil and leadership change. If it fails, the hardest hit will be those stdnts who can least afford to see their schools unravel.\\\"", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-02-18", "text": "https://t.co/mfNyUAKH75", "eng": 3, "likes": 0, "comments": 1, "shares": 0, "type": "Post", "contentType": "Link"}, {"date": "2025-02-18", "text": "I appreciate the perspective shared in this piece and remain committed to working alongside CPS leaders, our principals, and the Board of Education to ensure we rise to the challenge—because Chicago’s young people deserve nothing less.", "eng": 2, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-02-13", "text": "2️⃣Even with fed. support, the bulk of school funding comes from state and local sources. In a district like CPS, where 72% of students are economically disadvantaged, federal funds make up approximately 16% (or $1.3B) of the district’s $8.4B operating budget.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-02-13", "text": "There’s a lot of talk about fed. funding in public schools—how it’s used, its effectiveness, and if it's necessary. But beyond the headlines, I don’t see nearly enough discussion rooted in facts. Three things you should know before weighing in on the future of fed. edu funding:", "eng": 4, "likes": 1, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-02-13", "text": "1️⃣Federal funds were introduced to supplement state and local investments. Title I, for example, was launched in 1965 when Pres. Johnson declared “a national goal of Full Educational Opportunity,” charging the federal government with more actively supporting strong schools", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-02-13", "text": "3️⃣Chicago’s principals have more flexibility than most in using these funds to meet student needs.", "eng": 3, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-02-13", "text": "Over the next few weeks, I will highlight how different principals use federal funds to drive real student outcomes. I hope these examples will ground the debate in facts—because the future of our schools and the students they serve deserve nothing less.", "eng": 1, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-02-07", "text": "Our team remains committed to encouraging appropriate data use and the advantage of local autonomy — key drivers of Chicago’s progress in the past and in the future.", "eng": 3, "likes": 1, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-02-07", "text": "Chicago’s students continued to improve where others stalled or declined. Notably, eighth-grade reading edged closer to its 2017 peak, driven by gains among Black and Latino/a/x students. This progress is no accident.", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-02-07", "text": "When school ldrs have clarity on what their students need, they take action. For years, we’ve featured the positive impact of local decision-making on learning. Principals in schools like Avalon Park and Jose de Diego regularly use data to grow student reading and math skills", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-02-07", "text": "Support from @UChiConsortium and other orgs, CPS maintains a clear focus on evidence of stdnt learning, w/ data disaggregated by school and stdnt pop., empowers principals and their teams to respond to the real needs of the stdnts they actually serve — not to the myth of an avg.", "eng": 2, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-02-07", "text": "I know the lingering effects of the pandemic and the current political situation make it easy for some to be pessimistic about public education in Chicago. And the work of principals is harder than ever. The NAEP scores from last week offered some bright spots, especially in Chi. https://t.co/qiN8VC", "eng": 3, "likes": 1, "comments": 1, "shares": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-02-04", "text": "Thrilled to see one of Chicago's most committed school and community leaders honored in this way. Congratulations @canderson311! It is always a great day to be an Eagle! @MClarkEagles ", "eng": 15, "likes": 4, "comments": 0, "shares": 0, "type": "Quote", "contentType": "Link"}, {"date": "2025-01-26", "text": "As families and leaders seek information about the city's response to recent executive orders, this is a helpful site: https://t.co/lWv4xhfjPI. Please share with your networks.", "eng": 10, "likes": 3, "comments": 0, "shares": 1, "type": "Post", "contentType": "Link"}, {"date": "2025-01-26", "text": "As school leaders and families seek information about the city's response to recent federal executive orders, CPS has created a vital resource here: https://t.co/FlF8szFErA. Please share with your networks.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "Post", "contentType": "Link"}, {"date": "2025-01-14", "text": "It was a joy to be with our Malott Fellows, our @thisisUIC partners, and the Wise Leadership team this morning. https://t.co/PP63Y2AnFR", "eng": 5, "likes": 1, "comments": 0, "shares": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-01-07", "text": "Over the next 6 months, the board will navigate crucial decisions—selecting CPS leadership, negotiating a new teachers' contract, and finalizing the budget. All this will unfold amid broader political, policy, and funding shifts, creating new challenges for educators/students.", "eng": 2, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-01-07", "text": "One resolution I know I’m keeping in 2025? Staying informed about the work of the Chi Board of Edu.  After all, next week marks a historic moment for @ChiPubSchools — the largest governance shift since 1995. 21 members, including ten elected last Nov, will be sworn in.", "eng": 65, "likes": 14, "comments": 2, "shares": 4, "type": "Post", "contentType": "Text"}, {"date": "2025-01-07", "text": "With change comes opportunity. I was inspired by the dedication of the candidates. Many joined forums we co-hosted with @MikvaChallenge/ @ChiPrincipals + engaged directly with leaders in their districts. Their commitment to service set a strong foundation for the work ahead.", "eng": 2, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-01-07", "text": "As they make these choices, I hope board members stay focused on why they chose to serve the 325,000 young people in CPS classrooms. While the headlines often miss the daily triumphs in our schools, those stories of hope and hard work are very real.", "eng": 1, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-12-18", "text": "https://t.co/VkfdHsn46p", "eng": 4, "likes": 0, "comments": 0, "shares": 0, "type": "Post", "contentType": "Link"}, {"date": "2024-12-13", "text": "Grateful to be leading and learning with this crew every day. #LoveMyTeam https://t.co/lZXfUG7Tos", "eng": 27, "likes": 9, "comments": 0, "shares": 1, "type": "Post", "contentType": "Photo"}, {"date": "2024-12-10", "text": "Schools are so much more than classrooms. Good principals lead by listening to the diverse needs of teachers, the community, and students. They bring those needs together to ensure the sum is GREATER than its parts. They MUST retain that right to lead. https://t.co/ghKwRWPoKr", "eng": 76, "likes": 6, "comments": 0, "shares": 1, "type": "Post", "contentType": "Video"}, {"date": "2024-12-06", "text": "Like many principals, her work extends well beyond the confines of her office. Each morning, she arrives at the school and personally collects attendance sheets from every classroom, making sure she stays connected to her school community. (2/2)", "eng": 2, "likes": 1, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-12-06", "text": "Yesterday, I had the privilege of walking through the halls of McNair Elementary in the Austin neighborhood. Principal Benetrice Whitfield has been leading McNair since July 2017, previously serving as the Assistant Principal. (1/2) https://t.co/lj52Me0wF1", "eng": 10, "likes": 5, "comments": 1, "shares": 1, "type": "Post", "contentType": "Photo"}, {"date": "2024-11-07", "text": "To my educator friends who worked through election feelings with your communities yesterday (and who will do it again today): I see you. Thank you for your empathy and leadership ALWAYS, but especially in moments like these.", "eng": 4, "likes": 2, "comments": 0, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2024-11-04", "text": "Sydney's leadership of this work on our team is helping us live into our mission and providing needed support to leaders and schools. Extra shout-out for hitting that two-minute time limit precisely!  https://t.co/hBSkzH7bE0", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2024-11-04", "text": "Their tireless work to center their students and their community's needs, especially in times of turmoil or change, is critical to our schools. Their partnership with principals makes schools places of belonging and learning for young people.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-11-04", "text": "As we all prepare for a week of election talk and the potential implications on our communities, country, and world, I want to pause and thank Sydney Finley for giving voice to the importance of the many already-elected LSC members serving in Chicago's public schools.", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2024-10-28", "text": "Kershaw is home to three cluster classrooms with students with specialized needs, and the school has seen an influx of newcomers. In some places, people perceive these factors as a \\\"burden\\\" or \\\"something to manage.\\\"", "eng": 2, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-10-28", "text": "“Tell me something GOOD about Chicago Public Schools.” I love this question! I often hear it on soccer sidelines, at networking events, and at funder meetings. While some people often pose it as a challenge, it is a joyful question for me, and I always have an answer.", "eng": 26, "likes": 5, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2024-10-28", "text": "This week, my answer features the incredible work of Principal Clayton and her team at @KershawMagnetIB  in Englewood. They serve 225 PreK-8 students in an IB school, where kids learn Mandarin and Spanish, solve problems in their local communities, and connect globally. https://t.co/CKhmpUdgV4", "eng": 8, "likes": 2, "comments": 2, "shares": 1, "type": "'@Reply", "contentType": "Photo"}, {"date": "2024-10-28", "text": "Kershaw recognizes every young person as the gift they are. Students recite their morning pledge: “I am the greatest child in the world simply because I am.” The adults in the building embody this belief through supportive interactions, making a real difference.", "eng": 3, "likes": 2, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-10-28", "text": "The best part about this answer to the 'what's good' question in Chicago is that @KershawMagnetIB isn't an individual outlier. At dozens of Chicago schools, adults consistently prioritize the needs of kids and families, making tough work look effortless.", "eng": 4, "likes": 2, "comments": 0, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-10-23", "text": "You know #PrincipalPrideChi is a thing when the @ChicagoBears are getting in on it! It's hard to fill a principal's shoes, but @canderson311 always makes room to celebrate and engage when it serves his @MClarkEagles. ", "eng": 11, "likes": 2, "comments": 0, "shares": 2, "type": "Quote", "contentType": "Link"}, {"date": "2024-10-18", "text": "Last night, The Fund team honored Principal Maureen Delgado of @cpsclinton and Assistant Principal Brittany Tidwell-Bailey of Wendell Smith Elementary School and heard stories from Shannae Jackson, Iliana Rzodkiewicz, Marian Strok, and Bill Yeh.", "eng": 3, "likes": 2, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-10-18", "text": "A huge thanks to @chevyluvscience and the team at @msichicago, to our partners at @WilliamBlair, @chicagobulls, @IngenuityChgo, @BMO, @ChiPubSchools, @chicago, and to Patricia Mota and our @TheFundChicago.", "eng": 10, "likes": 3, "comments": 0, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-10-18", "text": "#PrincipalPrideChi is truly my favorite time of year. In Chicago, the average district principal leads a 73-person team, manages a $8.9m budget, and is responsible for 519 students learning and thriving every day. They provide strong leadership, even amid political distractions. https://t.co/rvjiMfJ", "eng": 50, "likes": 11, "comments": 1, "shares": 4, "type": "Post", "contentType": "Photo"}, {"date": "2024-10-07", "text": "Let me break through the political noise around Chicago's public schools to remind you that 634 principals are diligently working to welcome students and staff, demonstrating their leadership and commitment, which is ALWAYS worth celebrating, especially now. #PrincipalPrideChi https://t.co/Zo9Wr5HqC", "eng": 114, "likes": 22, "comments": 0, "shares": 5, "type": "Post", "contentType": "Photo"}, {"date": "2024-10-04", "text": "#PrincipalPrideChi is my favorite time of year! Chicago’s principals are truly unmatched. This month, we celebrate your unwavering dedication, compassion, and profound impact on our schools and communities. Happy Principal Appreciation Month! Be sure to #ThankAPrincipal https://t.co/dfY6gnRU6c", "eng": 25, "likes": 8, "comments": 0, "shares": 1, "type": "Post", "contentType": "Video"}, {"date": "2024-10-01", "text": "October 1 marks the launch of Principal Appreciation Month at @TheFundChicago. I'm sporting my favorite purple dress and new specs in support of leaders who manage budgets, juggle schedules, and center kids and families every day. #PrincipalPrideChi #MyJobisTheBestJob https://t.co/EtRATs8u6V", "eng": 27, "likes": 12, "comments": 1, "shares": 1, "type": "Post", "contentType": "Photo"}, {"date": "2024-09-25", "text": "🚨 Big news! I'm hiring a permanent Chief Operating Officer! 🎉  🔍 What we’re looking for: - Passion for finance, HR, and development - Team player who sees vendors as partners - Strong collaborator - Enjoys a lively lunch atmosphere - MIssion-focused  https://t.co/eNLd9haX8j", "eng": 48, "likes": 7, "comments": 0, "shares": 3, "type": "Post", "contentType": "Link"}, {"date": "2024-09-23", "text": "Dolen Perkins-Valdez’s book is historical fiction, but it made me want to know more about the true stories of \\\"Medical Apartheid,\\\" especially in a world where quality, representative, and inclusive health care remains a profound social justice issue.  https://t.co/jmhC9oa5VJ", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2024-09-23", "text": "I adore Isabelle Allende’s books, and this book by Ingrid Rojas Contreras offers similar insight into the recent past. https://t.co/k

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Heather Y. Anichini | Influencer Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ─── Reset ──────────────────────────────────────────────────────── */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root {
      /* Exact Fund palette from screenshot */
      --crimson:   #6B1E2E;   /* header bg */
      --crimson-dk:#571828;   /* header hover */
      --page-bg:   #F0EDE7;   /* warm off-white body */
      --card-bg:   #FFFFFF;
      --border:    #E0DDD6;
      --text:      #1A1A1A;
      --muted:     #6B6B6B;
      --muted-lt:  #9A9A9A;
      /* Year accent colors matching screenshot */
      --c2026:     #7C3480;   /* purple */
      --c2025:     #6B1E2E;   /* crimson */
      --c2024:     #1B4FA8;   /* blue */
      --c2023:     #1A7A4A;   /* green */
      /* platform */
      --li-blue:   #0A66C2;
      --x-dark:    #14171A;
      --combined:  #5B3FA6;
      /* accent */
      --accent:    #6B1E2E;
      --radius:    10px;
      --font: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    body{font-family:var(--font);background:var(--page-bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}
    a{color:var(--crimson);text-decoration:none}
    a:hover{text-decoration:underline}

    /* ─── Header ─────────────────────────────────────────────────────── */
    .site-header{
      background:var(--crimson);
      padding:14px 32px;
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:100;
    }
    .header-left{display:flex;align-items:center;gap:20px}
    .back-link{
      font-size:12px;color:rgba(255,255,255,0.75);
      display:inline-flex;align-items:center;gap:5px;
      transition:color 0.15s;white-space:nowrap;
    }
    .back-link:hover{color:#fff;text-decoration:none}
    .header-titles h1{font-size:18px;font-weight:700;color:#fff}
    .header-titles p{font-size:12px;color:rgba(255,255,255,0.65);margin-top:1px}
    .header-platform-badge{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);
      color:#fff;font-size:12px;font-weight:600;
      padding:5px 12px;border-radius:6px;
      transition:all 0.2s;cursor:default;
    }

    /* ─── Page wrap ──────────────────────────────────────────────────── */
    .page-wrap{max-width:1200px;margin:0 auto;padding:28px 24px 60px}

    /* ─── Profile card ───────────────────────────────────────────────── */
    .profile-card{
      background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);
      padding:24px 28px;display:flex;align-items:center;gap:18px;margin-bottom:24px;
      box-shadow:0 1px 4px rgba(0,0,0,0.06);
    }
    .avatar{
      width:56px;height:56px;border-radius:50%;
      background:var(--crimson);color:#fff;
      font-size:18px;font-weight:700;letter-spacing:-0.5px;
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .profile-info h2{font-size:20px;font-weight:700;color:var(--text)}
    .profile-info p{font-size:13px;color:var(--muted);margin-top:2px}
    .profile-meta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
    .meta-pill{
      display:inline-flex;align-items:center;gap:5px;
      border:1px solid var(--border);border-radius:20px;
      padding:3px 10px;font-size:12px;color:var(--muted);
    }
    .meta-dot{width:7px;height:7px;border-radius:50%;display:inline-block}

    /* ─── Platform tabs ──────────────────────────────────────────────── */
    .platform-tabs{
      display:flex;gap:0;
      background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);
      padding:5px;margin-bottom:24px;
      box-shadow:0 1px 4px rgba(0,0,0,0.05);
    }
    .ptab{
      flex:1;padding:9px 16px;border-radius:7px;border:none;
      background:transparent;color:var(--muted);
      font-family:var(--font);font-size:13px;font-weight:600;
      cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
      transition:all 0.15s;
    }
    .ptab:hover:not(.ptab-active){background:#f5f2ed;color:var(--text)}
    .ptab-active-li{background:#e8f0fb;color:var(--li-blue)}
    .ptab-active-x {background:#f0f0f0;color:var(--x-dark)}
    .ptab-active-combined{background:#ede8f7;color:var(--combined)}

    /* ─── KPI section ────────────────────────────────────────────────── */
    .kpi-section{margin-bottom:20px}
    .kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .kpi-card{
      background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);
      padding:18px 20px;min-width:170px;flex:1;
      box-shadow:0 1px 4px rgba(0,0,0,0.05);
      border-top:3px solid transparent;
    }
    .kpi-year{font-size:11px;font-weight:700;letter-spacing:0.06em;margin-bottom:8px}
    .kpi-val{font-size:28px;font-weight:700;color:var(--text);line-height:1}
    .kpi-label{font-size:12px;color:var(--muted);margin-top:4px}
    .kpi-delta{font-size:11px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:3px}
    .delta-down{color:#C0392B}
    .delta-up{color:#1A7A4A}
    .kpi-2026{border-top-color:var(--c2026);}.kpi-year-2026{color:var(--c2026)}
    .kpi-2025{border-top-color:var(--c2025);}.kpi-year-2025{color:var(--c2025)}
    .kpi-2024{border-top-color:var(--c2024);}.kpi-year-2024{color:var(--c2024)}
    .kpi-2023{border-top-color:var(--c2023);}.kpi-year-2023{color:var(--c2023)}
    .kpi-green{border-top-color:#1A7A4A;}.kpi-year-green{color:#1A7A4A}

    /* ─── Info banner ────────────────────────────────────────────────── */
    .info-banner{
      background:#FBF8EE;border:1px solid #E8DFC0;border-radius:var(--radius);
      padding:12px 16px;font-size:12px;color:#6B5B2E;
      margin-bottom:20px;display:flex;gap:8px;align-items:flex-start;
    }

    /* ─── Chart card ─────────────────────────────────────────────────── */
    .chart-card{
      background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);
      padding:22px 24px;margin-bottom:20px;
      box-shadow:0 1px 4px rgba(0,0,0,0.05);
    }
    .chart-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;gap:10px}
    .chart-title{font-size:15px;font-weight:700;color:var(--text)}
    .chart-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .chart-toggles{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden}
    .ctoggle{
      padding:6px 14px;border:none;background:transparent;
      color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;
      font-family:var(--font);transition:all 0.15s;border-right:1px solid var(--border);
    }
    .ctoggle:last-child{border-right:none}
    .ctoggle:hover:not(.ctoggle-active){background:#f5f2ed}
    .ctoggle-active{background:var(--crimson);color:#fff}
    .chart-wrap{position:relative;height:260px}

    /* ─── Two-col ─────────────────────────────────────────────────────── */
    .two-col{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-bottom:20px}
    .breakdown-stack{display:flex;flex-direction:column;gap:12px}
    .breakdown-card{
      background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);
      padding:16px 18px;flex:1;box-shadow:0 1px 4px rgba(0,0,0,0.04);
    }
    .breakdown-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px}
    .bar-item{margin-bottom:9px}
    .bar-item:last-child{margin-bottom:0}
    .bar-label-row{display:flex;justify-content:space-between;margin-bottom:3px}
    .bar-label{font-size:12px;color:var(--text)}
    .bar-count{font-size:12px;color:var(--muted)}
    .bar-track{height:5px;background:#EDE9E2;border-radius:3px;overflow:hidden}
    .bar-fill{height:100%;border-radius:3px;transition:width 0.6s ease}

    /* ─── Compare grid ────────────────────────────────────────────────── */
    .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
    .compare-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
    .compare-header{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
    .stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0ede7}
    .stat-row:last-child{border-bottom:none}
    .stat-name{font-size:12px;color:var(--muted)}
    .stat-val{font-size:13px;font-weight:600;color:var(--text)}

    /* ─── Feed section ────────────────────────────────────────────────── */
    .feed-section{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
    .feed-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:10px}
    .feed-title{font-size:15px;font-weight:700;color:var(--text)}
    .feed-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
    .feed-controls{display:flex;gap:8px;flex-wrap:wrap}
    .feed-select{
      background:#fff;border:1px solid var(--border);color:var(--text);
      border-radius:6px;padding:5px 10px;font-size:12px;font-family:var(--font);
      cursor:pointer;outline:none;
    }
    .feed-select:focus{border-color:var(--crimson)}
    .post-item{border-top:1px solid var(--border);padding:14px 0;cursor:pointer}
    .post-item:first-child{border-top:none;padding-top:0}
    .post-item:hover .post-text{color:var(--crimson)}
    .post-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:5px}
    .post-meta-left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .post-date{font-size:11px;color:var(--muted-lt)}
    .post-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:#f0ede7;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em}
    .post-text{font-size:13px;color:var(--text);line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;transition:color 0.15s}
    .post-text.expanded{display:block;-webkit-line-clamp:unset}
    .post-stats{display:flex;gap:14px;margin-top:7px;flex-wrap:wrap}
    .post-stat{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
    .post-stat strong{color:var(--text)}
    .eng-badge{font-size:13px;font-weight:700;color:var(--crimson);white-space:nowrap;flex-shrink:0}
    .feed-more{text-align:center;padding:14px;font-size:12px;color:var(--muted-lt);border-top:1px solid var(--border)}

    /* ─── Footer ─────────────────────────────────────────────────────── */
    .page-footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted-lt);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}

    /* ─── Responsive ─────────────────────────────────────────────────── */
    @media(max-width:750px){
      .two-col{grid-template-columns:1fr}
      .compare-grid{grid-template-columns:1fr}
      .kpi-row{flex-direction:column}
      .kpi-card{min-width:0}
      .site-header{padding:12px 16px}
      .page-wrap{padding:20px 14px 48px}
    }
  </style>
</head>

const LI_FEED    = [{"date": "2026-06-04", "text": "Yesterday, I had the privilege of attending the #StartEarlyLuncheon, where Diana Rauner passed the baton to Celena Sarillo in a powerful way.  The program was grounded in facts, centered on children and their families, and full of hope.  → One fact that stuck with me: One in three children enters ki", "eng": 57, "reactions": 51, "comments": 6, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-06-03", "text": "Today's budget update: The Opportunity Index (OI)  Over the past few weeks, I have walked through several major drivers shaping CPS school budgets in FY27: enrollment shifts, revised staffing ratios, and lower payouts for liquidated positions.  One piece remains: the Opportunity Index.  → What is th", "eng": 38, "reactions": 32, "comments": 6, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2026-05-28", "text": "Our team, our partners, and our principals were thankful to Dr. Macquline King for her words and wisdom yesterday. We were also grateful to Julie Burnett, who helped make sure it happened! In the middle of a very busy season, the time and community were a real gift.  #TheBestAreWithCPS #PrincipalPri", "eng": 26, "reactions": 26, "comments": 0, "shares": 0, "impressions": 782, "type": "Post", "contentType": "Text"}, {"date": "2026-05-26", "text": "Today's budget update: Liquidation as a tool   CPS allocates positions to each school using a formula. It includes teachers, assistant principals, restorative justice coordinators, and other roles.  Those positions may not match what the school needs or who the principal has on staff. When a mismatc", "eng": 45, "reactions": 38, "comments": 6, "shares": 1, "impressions": 0, "type": "Post", "contentType": "Document"}, {"date": "2026-05-22", "text": "Today's budget update: AP positions in small schools  Schools with enrollments of 250 or fewer are less likely to lose teacher positions in FY27. But they are losing something else: an assistant principal.  → How did we get here?   Starting in FY25, CPS allocated a foundational AP position to every ", "eng": 26, "reactions": 23, "comments": 2, "shares": 1, "impressions": 0, "type": "Post", "contentType": "Document"}, {"date": "2026-05-20", "text": "Budget topic of the day: Teacher allocations  CPS allocates core teaching positions to schools based on two factors: enrollment and a student-to-teacher ratio. For schools with more than 250 students, this can lead to compounding losses in FY27.  Enrollment declined by about 9,000 in FY26. That loss", "eng": 18, "reactions": 16, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Document"}, {"date": "2026-05-18", "text": "Last week, CPS announced a $732M deficit for FY27, up from the $520M projected in the FY26 Budget Book.  School-level budgets absorb nearly $100M of that gap. How CPS closes the rest is still an open question.  → The most concrete revenue lever right now is TIF surplus.  CPS is assuming $100M, about", "eng": 20, "reactions": 17, "comments": 2, "shares": 1, "impressions": 0, "type": "Post", "contentType": "Document"}, {"date": "2026-05-18", "text": "School budgets are out.  For school leaders across Chicago, this moment isn't the starting line. Principal Lisa Epstein of Lee Elementary started her budget process months before a single number was released. She knew what her school needed. Now she has to reconcile that with what she actually has. ", "eng": 9, "reactions": 9, "comments": 0, "shares": 0, "impressions": 294, "type": "Post", "contentType": "Text"}, {"date": "2026-05-12", "text": "FY27 Cost Explainer #1: Staffing costs  Salaries and benefits for 45,578 employees account for about $6.1B (~68%) of all CPS operating costs. On average, staffing costs grew 11% each year between FY19 and FY26 — while average revenue only increased by 6%.  When costs outpace new revenue, it forces t", "eng": 45, "reactions": 38, "comments": 6, "shares": 1, "impressions": 0, "type": "Post", "contentType": "Document"}, {"date": "2026-05-12", "text": "FY27 Cost Explainer #1: Staffing costs Salaries and benefits for 45,550 people account for about $6.1B (~68%) of all CPS operating costs. On average, staffing costs grew 11% each year between FY19 and FY26 — while average revenue only increased by 6%.  When costs outpace new revenue, it forces tough", "eng": 0, "reactions": 0, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Document"}, {"date": "2026-05-08", "text": "FY27 Revenue Explainer #6: Recap  Over the past two weeks, I’ve reviewed CPS’s major revenue sources and their impact on the district’s financial outlook.   To recap, CPS is likely to receive around $9B in operating revenue for FY27 from three sources:  🇺🇸 Federal: $900M (10%) in stable funding for ", "eng": 16, "reactions": 15, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Document"}, {"date": "2026-05-07", "text": "Ingenuity - Chicago has spent 15 years making the case that every child deserves access to the arts in public schools.   Last night, Nicole Losurdo Upton and her team marked Ingenuity’s 15th anniversary at Tapestry 2026, raising significant resources to close that gap and celebrating partners who ha", "eng": 6, "reactions": 6, "comments": 0, "shares": 0, "impressions": 352, "type": "Post", "contentType": "Text"}, {"date": "2026-05-07", "text": "FY27 Revenue Explainer 5: TIF Surplus Assumptions - Part 2 ⤵️   Yesterday, I explained how TIF surpluses factored into the CPS budget in FY26 and why they aren’t as predictable as CPS’s other revenue sources. Today, we’ll consider how much CPS is likely to receive in FY27.  💡 To start, it’s importan", "eng": 8, "reactions": 8, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Document"}, {"date": "2026-05-07", "text": "Such well-deserved recognition of one of Chicago’s very best.   In addition to all that Mariel Laureano said, Nicole’s Masterclass on Leadership has reshaped the way I approach my day.   Nicole is a remarkable educator, leading an inspiring school, who generously shares her wisdom with so many of us", "eng": 17, "reactions": 17, "comments": 0, "shares": 0, "impressions": 316, "type": "Post", "contentType": "Text"}, {"date": "2026-05-06", "text": "This morning’s American Red Cross 24th Annual Heroes Breakfast was a powerful reminder of Chicago at its best.  The room was filled with people who show up for others every day: health care workers, first responders, advocates, neighbors, and community leaders whose impact often goes unnoticed.   Th", "eng": 39, "reactions": 37, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-05-05", "text": "FY27 Revenue Explainer #4: Tax Increment Financing Districts (TIF)  In FY26, CPS received $552M from TIF surpluses. That is about 5% of the $10.25B total budget, and 6% of the district’s $8.7B operating budget, a small but meaningful share.  ⁉️ How do those dollars come to CPS?  Tax Increment Financ", "eng": 13, "reactions": 13, "comments": 0, "shares": 0, "impressions": 831, "type": "Post", "contentType": "Document"}, {"date": "2026-05-04", "text": "FY27 Revenue Explainer #3: Local Property Taxes CPS receives roughly $4B in property tax revenue annually.  In FY26, property tax revenue accounted for about 40% of the $10.25B total budget and 48% of the district's $9B operating budget. In Illinois, a school board’s power to increase a property tax", "eng": 16, "reactions": 15, "comments": 0, "shares": 1, "impressions": 982, "type": "Post", "contentType": "Document"}, {"date": "2026-05-01", "text": "I just wrapped my time at Pahara Institute at Lone Rock, and I'm leaving with three lessons worth holding onto:  1️⃣ Belief in the potential of every young person in our lives is a powerful why. Staying close to that, especially as leadership pulls us further from classrooms, is key.  2️⃣ People - o", "eng": 80, "reactions": 76, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-04-28", "text": "Last week, our partners at Northern Trust hosted The Chicago Public Education Fund team for a day of connection, reflection, and work.   We anchored in the one thing we know we can count on: CHANGE.   We discussed how our individual and collective responses to those ever-present shifts create weathe", "eng": 18, "reactions": 16, "comments": 1, "shares": 1, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-04-27", "text": "CPS receives roughly $4B in property tax revenue annually.   That’s about 40% of the $10.25B total budget, and nearly half of the district's $8.6B operating budget. In Illinois, a school board’s power to increase a property tax levy is capped at 5% or the rate of inflation, whichever is less.  In De", "eng": 8, "reactions": 8, "comments": 0, "shares": 0, "impressions": 706, "type": "Post", "contentType": "Document"}, {"date": "2026-04-24", "text": "Every day, principals make decisions that shape the student experience. From how time is used, to how teams are supported, to how resources reach students.  And in a challenging budget environment, those decisions matter even more.   Last year, 91% of principals surveyed told us that the ability to ", "eng": 23, "reactions": 21, "comments": 2, "shares": 0, "impressions": 966, "type": "Post", "contentType": "Photo"}, {"date": "2026-04-23", "text": "A highlight of my week. Grateful for John Fitzpatrick and Mariel Laureano. Their expertise as long-time leaders and visionaries always inspires me; their championing of Chicago's young people always leaves me ready to do more and to be better. There is nothing accidental about the magic we saw at Lo", "eng": 17, "reactions": 16, "comments": 1, "shares": 0, "impressions": 860, "type": "Post", "contentType": "Text"}, {"date": "2026-04-23", "text": "A highlight of my week. Grateful for John Fitzpatrick and Mariel Laureano. Their expertise as long-time leaders and visionaries always inspires me; their championship of Chicago's young people always leaves me ready to do more and to be better. There is nothing accidental about the magic we saw at L", "eng": 4, "reactions": 4, "comments": 0, "shares": 0, "impressions": 81, "type": "Post", "contentType": "Text"}, {"date": "2026-04-23", "text": "FY27 Revenue Explainer #2: State Funding  State funding is increasing each year, but most districts statewide still do not receive the funding necessary to meet the needs of the students they serve.   Illinois’ Evidence-Based Funding formula, passed in 2017, was designed to close the gap between wha", "eng": 6, "reactions": 6, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Document"}, {"date": "2026-04-22", "text": "FY27 Revenue Explainer #1: Federal Funding  It's budget season in CPS, and this space will be full of fiscal news you can use.  Starting this week: the revenue side of the equation. Most school systems draw from three sources: federal, state, and local. We'll take them one at a time.   Up first: fed", "eng": 30, "reactions": 28, "comments": 1, "shares": 1, "impressions": 0, "type": "Post", "contentType": "Document"}, {"date": "2026-04-20", "text": "As a graduate student in education, I spent years studying how people learn. I studied different modalities, different paces, and different paths to the same destination.   I spent hours in my mom’s classroom. She was a high school teacher who often opted to co-teach to support student learning in t", "eng": 47, "reactions": 41, "comments": 6, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2026-04-17", "text": "Winding down this week back in Chicago, I'm reflecting on another insightful trip to ASU+GSV Summit. My head is full of new ideas gathered in sessions, over coffee, and on walks along the ocean. My heart is full from provocative conversations with old friends, so many of whom share my passion for sc", "eng": 66, "reactions": 62, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-04-16", "text": "14 years in this role today. That's hard to believe. Three things I am taking with me into the year ahead:  1️⃣ Leadership matters.  I've learned that in schools and in organizations, leadership shapes everything. I've had the privilege of working alongside incredible educators across Chicago, and o", "eng": 196, "reactions": 165, "comments": 31, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-04-15", "text": "I’ll be taking the stage in an hour at the ASU+GSV Summit to talk about how school systems are approaching AI – and what it will take to get this right.  In recent conversations with school and system leaders, one tension keeps surfacing: how to balance protecting student data and maintaining trust,", "eng": 175, "reactions": 172, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-04-13", "text": "The Chicago Public Schools (CPS) budget is complex. Last year, I wrote extensively about the work of the Chicago Board of Education (CBOE) and Dr. Macquline King in reaching a balanced budget recommendation amid a structural deficit.   This year, the challenge is equally daunting. By law, the CBOE m", "eng": 23, "reactions": 23, "comments": 0, "shares": 0, "impressions": 699, "type": "Post", "contentType": "Photo"}, {"date": "2026-04-08", "text": "As we continue to celebrate #APWeek, I am reflecting on a leadership gap we don't talk about enough:  ▶️ Most aspiring principals don't practice the full scope of the role until they're already in it.◀️  That means the learning curve kicks in after they take on responsibility for students, staff, an", "eng": 70, "reactions": 63, "comments": 7, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-04-07", "text": "Every day, Assistant Principals step into the gaps others don't see. They coach teachers, solve problems before anyone knows they exist, support students through crisis and celebration, and keep schools running. Their work is steady, essential, and rarely gets the spotlight it deserves.  This week i", "eng": 62, "reactions": 62, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Video"}, {"date": "2026-04-03", "text": "Finishing up my San Diego itinerary for #ASUGSVSummit, and the question on my mind isn't whether AI can help educators.   ❓I am wondering: how do we make sure it actually does? ❓  The conversation too often stops at policy guardrails or student-facing tools. But principals are losing hours every day", "eng": 87, "reactions": 79, "comments": 8, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-04-02", "text": "A Better Chicago’s event on chronic absenteeism earlier this week was exactly the kind of dialogue Chicago needs right now: data-driven, solutions-oriented, and student-centered.  The Fund team and I were proud to be there in support of Elizabeth Swanson and her team. The conversation was expertly m", "eng": 71, "reactions": 63, "comments": 7, "shares": 1, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-03-30", "text": "Congratulations to Dr. Macquline S King, EdD on her three-year contract as Superintendent/CEO of Chicago Public Schools, approved at today's Board of Education meeting.  Dr. King stepped into the interim role at one of the most consequential moments in the district's recent history. She steadied a d", "eng": 70, "reactions": 69, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2026-03-27", "text": "Our team was in Springfield yesterday alongside CPS students, parents, and educators who traveled to the State Capitol to deliver a clear message to legislators: FUND THE FORMULA.  The Evidence-Based Funding (EBF) formula is designed to get every Illinois school to adequacy. But without adequate ann", "eng": 43, "reactions": 41, "comments": 0, "shares": 2, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-03-26", "text": "Over the past few weeks, my team and I have had the joy of visiting schools across Chicago to personally deliver framed copies of The Fund’s mid-year program summary to the leaders we featured.  There’s something special about being able to say thank you in person. It means a lot to step into these ", "eng": 61, "reactions": 60, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-03-24", "text": "As we head into the final week of Women's History Month, I've been reflecting on the women who have shaped public education in Chicago. There are dozens of public schools in the city named after women, in many neighborhoods. Three that stand out for me:  💙Maria Saucedo was a respected educator and p", "eng": 28, "reactions": 27, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2026-03-20", "text": "Wishing all Chicago Public Schools leaders a restful and energizing spring break. 🌷  You’ve poured so much into your students, staff, and school communities this year. We hope this break gives you the space to truly decompress, whether that means spending time with family, enjoying quiet moments, tr", "eng": 137, "reactions": 135, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-03-19", "text": "As we move into the FY27 budget cycle, I’ve been reflecting on what we learned during last year’s process. Throughout FY26, the Chicago Board of Education and CPS leadership worked hard to keep students at the center of difficult decisions.   Three conditions proved especially important in protectin", "eng": 23, "reactions": 22, "comments": 1, "shares": 0, "impressions": 992, "type": "Post", "contentType": "Text"}, {"date": "2026-03-17", "text": "Did you vote today? Good. ✅  But wait. You’re not done yet.   Tomorrow — Wednesday, March 18 — Chicago Public Schools will hold Local School Council (LSC) elections.  🗳️If you’re connected to a CPS school, I hope you’ll take a moment to vote in these critical elections.  Local School Councils are on", "eng": 13, "reactions": 13, "comments": 0, "shares": 0, "impressions": 650, "type": "Post", "contentType": "Link"}, {"date": "2026-03-13", "text": "This week, Principal Barton Dassinger of César E. Chávez Elementary School in Back of the Yards testified before the Illinois State Board of Education, and the most important part of his message wasn't about attendance itself. It was a direct ask: use the state's accountability system to flag studen", "eng": 103, "reactions": 95, "comments": 7, "shares": 1, "impressions": 0, "type": "Post", "contentType": "Video"}, {"date": "2026-03-09", "text": "In many cities, school governance starts and ends pretty far from classrooms. In Chicago, it is rooted where learning happens: in our individual schools.  Our Local School Councils (LSCs) include parents, teachers, and community members who serve alongside principals to guide the direction of their ", "eng": 21, "reactions": 18, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2026-03-06", "text": "This week, The Chicago Public Education Fund team and I were honored to welcome Chicago Board of Education members Jessica Biggs, Michilla Johnson Blaise, Therese Boyle, and Dr. Che Rhymefest Smith to our annual Leadership Council Lunch.  Our very own Brooke Rayford facilitated a thoughtful conversa", "eng": 63, "reactions": 61, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-03-02", "text": "If, like me, you’re starting this week carrying some of the weight of the world, I want to share a few moments that stayed with me from last Friday.  To close out Black History Month, I had the opportunity to visit Haines Elementary School in the heart of Chinatown, led by Principal C. Amy Moy-Davis", "eng": 36, "reactions": 35, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-02-27", "text": "Chicago has 77 neighborhoods, but it runs on six degrees of separation. And while leaning on others for support and advancement isn't always our first instinct, those networks are both available and invaluable.  Those networks didn't emerge by accident. In 1989, Illinois passed legislation that esta", "eng": 21, "reactions": 20, "comments": 1, "shares": 0, "impressions": 820, "type": "Post", "contentType": "Photo"}, {"date": "2026-02-20", "text": "I’m excited to share our Mid-Year Report, which highlights what happens when a city invests in school leadership.  In 2025-26, The Chicago Public Education Fund is supporting principals in 250+ public schools across Chicago. Our report features school leaders Nicholas Guerrero, Hamed Flores, Rashad ", "eng": 42, "reactions": 41, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-02-13", "text": "This week, I joined leaders from across the country at the PIE Network Executive Directors Conference. I’m leaving energized and clear about what this moment requires of us. A few common themes stood out:  1. Students are the center. Across states and cities, we’re facing real headwinds, including e", "eng": 39, "reactions": 38, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2026-02-09", "text": "Last week, I visited Hughes Elementary with colleagues from @The Chicago Public Education Fund, Cheyane Bligen, MPPA, and Brooke Rayford—and left energized by what happens when strong leadership meets a relentless focus on improvement.  Principal Dr. Larue M. Fitch and AP Hadiya I. Turner, M.Ed. arr", "eng": 67, "reactions": 66, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-02-06", "text": "The Fund is proud to celebrate Principal Regina Latimer-Lake of Earle STEM Elementary, named Illinois’ 2026 Elementary Principal of the Year!  Selected from 20 regional winners across the state, this honor reflects the real, measurable impact Regina has on students every day. The Illinois Principals", "eng": 126, "reactions": 117, "comments": 8, "shares": 1, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-02-02", "text": "Research shows that when students miss more than 10% of the days in a school year, they are less likely to learn the content for their grade, and they feel more disconnected from school. Over time, they graduate and move on to post-secondary careers or schooling less often.  Attendance really matter", "eng": 44, "reactions": 39, "comments": 4, "shares": 1, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2026-01-29", "text": "The Chicago Public Education Fund has officially joined the PIE Network!  The PIE Network brings together 180+ nationwide education advocates who work to ensure every student has access to a future without limits.  Through shared learning and national best practices in policy and advocacy, we’ll dee", "eng": 49, "reactions": 46, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2026-01-26", "text": "Last week, we met with The Chicago Public Education Fund's Educator Advisory Committee (EAC) at Minnie Minoso Academy, hosted by Principal Carrie Ann Cole,EdD. We dug into a challenge principals everywhere know all too well: the growing burden of compliance work.   Our conversation surfaced three co", "eng": 40, "reactions": 38, "comments": 1, "shares": 1, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-01-23", "text": "I’m delighted to share that Julie Morita has joined the Board of Directors at The Chicago Public Education Fund!   As someone who is deeply invested in this work, Julie is a respected leader whose career reflects an unwavering commitment to public service, equity, and the well-being of Chicago’s com", "eng": 47, "reactions": 46, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2026-01-21", "text": "Last week, the Illinois State Board of Education (ISBE) released proposed updates to the system that keeps the public informed about all Illinois public schools.*  What Illinois is proposing:  ISBE wants to create a “profile of performance” for each school using two sets of indicators:  Core indicat", "eng": 24, "reactions": 19, "comments": 5, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2026-01-16", "text": "During the Chicago Board of Education's January Agenda Review Meeting on Wednesday, we were proud to highlight a powerful truth: strong school leadership means students learn more.  Thank you to CPS principals Takeshi James (Avalon Park Fine and Performing Arts Elementary School) and Paul Karafiol (", "eng": 43, "reactions": 41, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2026-01-14", "text": "Mariel Laureano has been a partner and leader in The Fund's work for a very long time. As a proud principal, she championed and modeled our belief in strong leadership. As a new Director here at The Fund at the launch of Chicago Leads, she brought valuable perspective from the field, a willingness t", "eng": 73, "reactions": 64, "comments": 9, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2026-01-08", "text": "At the end of December, two important decisions were made, both of which impact Chicago Public Schools and its FY26 budget.  First, the City of Chicago adopted its 2026 budget, which includes a record $1.01 billion Tax Increment Financing (TIF) surplus that must be distributed to local taxing bodies", "eng": 39, "reactions": 37, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2026-01-02", "text": "If your New Year’s resolution includes connecting meaningfully with your community, this post is for you!  Local School Councils (LSCs) are one of Chicago’s most powerful and unique levers for strengthening our public schools. By centering community voice and shared decision-making, parent, educator", "eng": 26, "reactions": 24, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-12-31", "text": "As we wrap up 2025, I’m filled with gratitude for our partners, donors, and, especially, Chicago’s school leaders. Their steady commitment carried us through a year that was both disruptive and defining for public education, here in Chicago and beyond.  Uncertainty showed up everywhere. Leadership t", "eng": 35, "reactions": 34, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Video"}, {"date": "2025-12-29", "text": "Today the Chicago Board of Education will hold a special meeting to consider whether to pursue additional revenue related to property taxes.  A few basics, in plain terms:  Why is $41M “available” now? Earlier this year, CPS set its property tax levy below the maximum allowed under state law.   The ", "eng": 32, "reactions": 31, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2025-12-23", "text": "Principal Barton Dassinger's recent Chicago Tribune op-ed (linked in the comments) tells a powerful story about what’s possible when school leaders have the flexibility and data to innovate with care for students and families.  At Cesar E. Chávez Elementary, Barton and his team increased attendance ", "eng": 138, "reactions": 128, "comments": 10, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-12-19", "text": "📣Early morning PSA: In many places, today is the last day of school for the calendar year. It’s a big day for students, educators, and the adults who support them.  Be gentle with co-workers who have kids finishing finals. Be patient with educator friends scrambling to grade late assignments. And be", "eng": 45, "reactions": 44, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-12-18", "text": "Yesterday, Barry Tyler Jr., our Director of Policy and Public Affairs, testified before the Illinois State Board of Education on the proposed new accountability system.  As Barry emphasized, “Leaders do not improve schools through labels alone. They improve schools through accurate, timely, readily ", "eng": 90, "reactions": 87, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Video"}, {"date": "2025-12-12", "text": "In my work with the Illinois Literacy Foundation, I’ve learned that more than half of Illinois adults read and write English below a sixth-grade proficiency level. In practical terms, this makes work, family life, and civic participation more challenging for millions of people.  That reality shapes ", "eng": 51, "reactions": 46, "comments": 5, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-12-11", "text": "There’s been understandable confusion about how the City’s budget negotiations might affect CPS. Here are the key facts.  💡 Let’s start with the CPS context.  - CPS built $379M in TIF surplus into its FY26 budget, approved in August. Schools used this number for their own planning. - The initial pro", "eng": 25, "reactions": 25, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-12-05", "text": "It’s exciting to see the Chicago Board of Education launch applications for the Black Student Achievement Committee (BSAC). This is a powerful opportunity for Chicagoans to help shape policies that put Black students at the center of our city’s future.  At The Fund, we know that real change in publi", "eng": 26, "reactions": 22, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-12-04", "text": "Love to see data being used to drive professional development opportunities for school leaders and learning opportunities for students! Thank you Mira Weber for your strong leadership and vision!", "eng": 12, "reactions": 11, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-12-02", "text": "⁉️Can you help us close out this Giving Tuesday out strong?!   An anonymous donor is matching all new and increased gifts and we are closing in on our $10,000 goal.   We appreciate your support, today and always. 🙏", "eng": 2, "reactions": 2, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-12-02", "text": "Please consider joining us today! Your investment in The Chicago Public Education Fund supports strong programming for student-centered principals, transparent data and analysis of education policy issues, and an incredible, mission-aligned team.", "eng": 7, "reactions": 7, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-11-29", "text": "Posting today with deep gratitude for Chicago’s principals and aspiring principals, and for the partners and supporters who stand with them every day.   Chicago continues to offer real bright spots: ☀️   ☑️ I’ve written recently about Rodolfo Rojas (Everett) and Nicholas Guerrero (Ravenswood) — lead", "eng": 92, "reactions": 92, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-11-25", "text": "📣 We're trying something new this season of gratitude. An anonymous donor will DOUBLE every gift through our Giving Tuesday campaign (which starts today!). Every dollar will support programs for Chicago's talented principals. Please consider joining us. #EveryGiftCounts #GivingTuesday #PrincipalPrid", "eng": 10, "reactions": 10, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-11-25", "text": "High School Assessment Results: What the 2024–25 Data Tells Us  ISBE and CPS released new performance data this fall, and one trend is clear: college-readiness is slipping—locally and nationally. No single test tells the whole story, but the pattern is unmistakable.  Chicago, once a national outlier", "eng": 8, "reactions": 8, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-11-24", "text": "Last week, our team had the privilege of visiting Ravenswood Elementary School, and I left deeply encouraged by what strong, student-centered leadership makes possible in Chicago’s public schools. From the moment we walked in, it was clear that Ravenswood is a community rooted in trust, consistency,", "eng": 50, "reactions": 46, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-11-21", "text": "Excited to see the continued appreciation for Penny Sebring and Charles Ashby Lewis, who received the AFP award earlier this month. Their commitment to young people and public schools in Evanston, Chicago, and beyond is inspiring!", "eng": 41, "reactions": 38, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-11-20", "text": "Graduation Rates in Chicago: What the Data Show (And What They Don’t)  Over the past few weeks, I highlighted data that shows how young people in Chicago are doing in school. I discussed how elementary assessments suggest progress with significant room to grow, and how stubbornly high absenteeism im", "eng": 24, "reactions": 24, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-11-14", "text": "Elementary School Attendance in Chicago and Illinois: What the Data Tell Us (and What They Don’t)  Last week, we reviewed the recent IAR (elementary assessment) data. This week, let’s turn to something just as fundamental: attendance. We’ll examine the data to reveal how often both students and teac", "eng": 14, "reactions": 14, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-11-13", "text": "Thanks for all the feedback on last week's IAR post (see link in comments)! Several of you asked that we post comparisons across various student groups. You can see that data in the graphics below. Unfortunately, the lack of raw data makes it impossible to assess whether the obvious gaps are widenin", "eng": 18, "reactions": 16, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-11-10", "text": "My first education job outside the classroom was with Chicago Public Schools, managing the School Improvement Plan effort—then known as SIPAAA.  That role introduced me to hundreds of Chicago principals and assistant principals. It’s where I learned that change is always possible and always hard wor", "eng": 78, "reactions": 76, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-11-07", "text": "In the last three cycles at The Chicago Public Education Fund, I have raised almost $100 million.   That said, I have never really considered myself a fundraiser. Why? Because development, for me, has always been about relationships and connections.  ✅ Relationships with our principals; connections ", "eng": 120, "reactions": 110, "comments": 10, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-11-06", "text": "Chicago Public Schools 2024–25 IAR Results: What the Data Show (and Don’t Show)  Last week, Chicago Public Schools (CPS) and the Illinois State Board of Education (ISBE) released the 2024–25 Illinois Assessment of Readiness (IAR) results — the statewide measure of student proficiency in reading and ", "eng": 18, "reactions": 18, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-11-05", "text": "Thrilled to see the great work of Elizabeth Swanson and ABC featured all over my feed. This discussion about our shared future really matters!", "eng": 15, "reactions": 15, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-10-31", "text": "Celebrating 25 years of impact!  Two weeks ago, we celebrated The Chicago Public Education Fund's 25th Anniversary Reception, gathering principals, Board members, and Leadership Council members ahead of our Principal Storytelling event — a truly magical evening honoring the educators who make Chicag", "eng": 77, "reactions": 69, "comments": 8, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-30", "text": "Last week, I had the privilege of spending five days hiking, reading, reflecting, and engaging at Pahara Institute, alongside 20+ extraordinary leaders in education.  It was an important pause to wrestle with the challenges of this moment — from federal action to cell phones — and to explore the opp", "eng": 73, "reactions": 70, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-30", "text": "On Tuesday our team visited Everett Elementary School and left deeply inspired by what strong, steady leadership can make possible.   For 14 years, Principal Rodolfo Rojas has led Everett with both heart and strategy — transforming a small McKinley Park school into a model of student engagement, aca", "eng": 11, "reactions": 11, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-10-28", "text": "✨ What an inspiring evening at the Golden Apple Foundation’s Impact Award celebration last night!  I was so grateful for the opportunity to join the Golden Apple Foundation in honoring 40 years of recruiting, preparing, and mentoring aspiring (and current!) educators through the Golden Apple Scholar", "eng": 74, "reactions": 70, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-27", "text": "💙 Celebrating Principal Erin Roche and Prescott Elementary! 💙  As we continue to celebrate Principal Appreciation Month, I’m especially proud to congratulate Dr. Erin Roche and the entire Prescott Elementary community on being named a 2025 Governor’s Blue Ribbon School. Prescott is just one of just ", "eng": 53, "reactions": 50, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-24", "text": "📣 Big news for Chicago schools and the FY26 budget — and what it really means.  In August, CPS approved a balanced FY26 budget of $10.25 billion, which assumed $379 million in revenue from Tax Increment Financing (TIF) surplus. As I’ve noted before, understanding how TIF surpluses flow into K–12 bud", "eng": 22, "reactions": 22, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-10-17", "text": "✨ What an evening! ✨  Last night, we came together for The Fund’s 10th Annual Principal Storytelling event, during our 25th anniversary year. This tradition is one of my favorites because it brings to life what we know to be true: great principals transform schools, and great schools transform lives", "eng": 84, "reactions": 78, "comments": 6, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-16", "text": "✨ Today is the day! ✨  This evening, The Chicago Public Education Fund will host our annual Principal Storytelling event—a night dedicated to uplifting the incredible leadership of Chicago’s public school principals.  I am deeply grateful to our talented team, generous sponsors, inspiring speakers, ", "eng": 89, "reactions": 85, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-16", "text": "💜 Thrilled to share our final Growth Leader Award Finalist, Principal Jennifer Sutton of Von Steuben High School! 💜  As a proud CPS alum and longtime leader at Von Steuben, Principal Sutton has spent nearly eight years championing inclusive decision-making and breaking down barriers for staff, stude", "eng": 176, "reactions": 157, "comments": 19, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-15", "text": "💜 Our next Growth Leader Award Finalist is Principal Donnell Rader of Beasley Elementary School! 💜  For the past seven years, Principal Rader has led Beasley with two bold, data-driven priorities: strengthening teacher leadership and advancing literacy instruction across every grade level. His goal ", "eng": 122, "reactions": 99, "comments": 23, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-15", "text": "💜 Our next Growth Leader Award Finalist is Principal Barton Dassinger of Chávez Elementary School! 💜  For more than a decade, Principal Dassinger has led Chávez with a steady vision: a school where strong attendance, academic growth, and student engagement open doors for every child. In recent years", "eng": 155, "reactions": 141, "comments": 14, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-15", "text": "💜 Our next Growth Leader Award Finalist is Principal Paul J. Karafiol of Lake View High School! 💜  Since officially stepping into the role in 2017, Principal Karafiol has led Lake View through a period of deep reflection and transformation. Early on, he and his team recognized critical challenges:  ", "eng": 74, "reactions": 72, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-14", "text": "💜 Our next Growth Leader Award Finalist is Principal Brian Kelly Ed.D of King College Prep!   When Principal Kelly took the helm at King College Prep in 2019, he set out to strengthen graduation outcomes, improve attendance, raise GPAs, and support teacher retention. His leadership has been characte", "eng": 72, "reactions": 66, "comments": 6, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-14", "text": "💜 Our next Growth Leader Award Finalist is Principal Meghan Duffy of Audubon Elementary School! 💜  For nine years, Principal Duffy has championed equity and inclusion at Audubon Elementary School. Early on, she identified an opportunity to better support students with disabilities and establish stru", "eng": 45, "reactions": 41, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-13", "text": "💜 Our next Growth Leader Award Finalist is Principal Yalil Nieves of Mary Gage Peterson Elementary School! 💜  For more than eight years, Principal Yalil Nieves has led with empathy, integrity, and an unwavering commitment to professional growth. She balances thoughtfulness with decisive action, ensu", "eng": 62, "reactions": 58, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-12", "text": "We are proud to announce the 2025 Growth Leader Award, honoring Chicago’s most visionary school leaders. Today, I’m highlighting one of our outstanding finalists: Principal William Hook Ag School of Chicago Agriculture High School.  Principal Hook leads with vision, compassion, and innovation. He en", "eng": 90, "reactions": 78, "comments": 12, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-11", "text": "🌟 Celebrating the 2025 Growth Leader Award  In honor of 💜 Principal Appreciation Month 💜, The Chicago Public Education Fund is proud to announce the 2025 Growth Leader Award, which recognizes Chicago’s most visionary school leaders.   These principals transformed climate, accelerated student learnin", "eng": 49, "reactions": 44, "comments": 5, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-10-03", "text": "This week, Advance Illinois released the 2025 edition of The State We’re In at the City Club of Chicago.  The report provides a holistic view of Illinois’ education system, spanning from birth through postsecondary education, tracking years of funding, staffing, and student performance data to highl", "eng": 31, "reactions": 31, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-01", "text": "If you know me, you know that #PrincipalPrideChi is my favorite time of year. 💜 Every October, our team at The Chicago Public Education Fund doubles down on celebrating Chicago’s incredible school leaders. Their energy, intentionality, and relentless investment in students are the secret ingredient ", "eng": 52, "reactions": 39, "comments": 13, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-09-29", "text": "✨ Chicago’s students are proving what’s possible in public education. The question is: can adults keep up?  From Farragut grads heading to Cornell, to Chávez seventh graders completing Algebra I, our young people are delivering results at scale. They deserve leaders who match their resolve with tran", "eng": 24, "reactions": 23, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2025-09-26", "text": "Amid a week packed with too many meetings and long hours, it was refreshing to pause and return to the why.  It was so fun to join Barry Tyler Jr. at Alexander Graham Elementary’s Fall Fest—a joyful reminder of what matters most: students, families, and the dedicated leaders who show up for them eve", "eng": 39, "reactions": 39, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-09-23", "text": "📊 September and October always bring a flood of insight into how our public schools are doing. From graduation rates to enrollment numbers, this is the season when the data tells a story. We are committed to unpacking it with you.  Last week’s data release by the U.S. Department of Education is a go", "eng": 31, "reactions": 30, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-09-20", "text": "❓ Did you know in the U.S., about 54% of adults read at a 6th grade level or lower ⁉️   This week, I joined Mo Khan, Eilish McDonagh-Hermer, and Cabell King, as the City of Des Plaines Mayor Andrew Goczkowski and the City Council recognized #NationalLiteracyMonth, highlighting the importance of lite", "eng": 27, "reactions": 25, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-09-18", "text": "We started our morning at Finkl Elementary with Principal Nancy Quintana, whose commitment to an equitable, excellent, and joyful learning experience shines through in every corner of her school (and outside the school too!).  From classrooms full of laughter and focus to a community eager to suppor", "eng": 49, "reactions": 45, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-09-17", "text": "🌟 26 aspiring leaders. 1 year of growth. A lifetime of impact. 🌟  Last night, I joined The Chicago Public Education Fund’s very own E.J. Dubinsky to welcome the 2025–26 Leadership Bridge cohort. The cohort includes 26 educators from schools across the city; each of them is preparing to take on a pri", "eng": 36, "reactions": 36, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-09-16", "text": "At The Chicago Public Education Fund, we believe excellent leadership transforms schools — and we know it transforms organizations, too.  Working here isn’t easy. The hours are long, the challenges are complex, and the answers are rarely obvious. But we know that real learning happens in the hard wo", "eng": 111, "reactions": 104, "comments": 7, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-09-11", "text": "I was excited to start my day yesterday by listening to Barry Tyler Jr. testify to the Chicago Board of Education about the work of The Chicago Public Education Fund. Learning happens in schools because leaders help create the conditions that foster student success every day. Our team believes in th", "eng": 128, "reactions": 126, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Video"}, {"date": "2025-09-09", "text": "Started my morning with Mellody Hobson at UChicago, listening to her reflect on a principal who shaped her life. That school leader set high expectations and invested time in her growth — leaving a lasting imprint on her view of excellence.  At The Chicago Public Education Fund, we see that same inf", "eng": 55, "reactions": 54, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-09-06", "text": "Thursday marked a powerful beginning here at The Chicago Public Education Fund.   We welcomed the newest cohort of the Malott Educator Fellowship, a program launched in 2024 to support principal growth, leadership, and retention through a personalized, cohort-based model.  Together, these leaders wi", "eng": 84, "reactions": 79, "comments": 5, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-09-03", "text": "Last Friday, the Chicago Board of Education (CBOE) approved the FY2026 budget—totaling $10.25B.  As required by state law, the budget’s assumed revenues match its projected costs. Including: $1.1B in debt service $556M in capital spending $8.6B in operating expenditures  The $8.6B operating budget i", "eng": 28, "reactions": 26, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-08-29", "text": "Yesterday, the Chicago Board of Education approved the FY26 budget. After months of debate and testimony from parents, educators, labor leaders, elected officials, and community members, the board voted to pass the budget presented by Macquline S King, EdD and her team.   Here are the key takeaways ", "eng": 42, "reactions": 42, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-08-28", "text": "📉 Chicago Public Schools’ (CPS) $734 million deficit includes a proposed $175 million reimbursement payment to the City of Chicago for the Municipal Employees Annuity and Benefit Fund (MEABF).  This pension system covers CPS employees who are not certified educators. Importantly, CPS is not legally ", "eng": 5, "reactions": 5, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2025-08-27", "text": "As Nelson Gerew highlighted in his recent testimony before the Illinois House Executive Committee, Chicago Public Schools (CPS) has made real progress since the passage of the Evidence-Based Funding (EBF) formula in 2017. State revenue has grown, local revenue has increased, and COVID relief dollars", "eng": 9, "reactions": 9, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-08-26", "text": "As Chicago Public Schools (CPS) prepares to pass and implement its FY26 budget, sources of additional revenue have been a major focal point over the past months. The most likely revenue source in this cycle? Surplus funds from the city’s Tax Increment Financing (TIF) districts.  💰 What’s a TIF surpl", "eng": 25, "reactions": 23, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-08-22", "text": "This week, Chicago’s classrooms were buzzing again with energy, curiosity, and hope. Even with uncertainties around district finances, the commitment school leaders have to students, families, and their faculty and staff is unwavering (and was on full display).  Our team at The Chicago Public Educat", "eng": 28, "reactions": 27, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-08-20", "text": "Yesterday, on the second day of school, the Chicago Board of Education held two public hearings on the FY26 budget.  Chicago Public Schools (CPS) team members reviewed the proposed plan, and we heard testimony from labor leaders, elected officials, parents, Local School Council members, educators, a", "eng": 13, "reactions": 13, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-08-15", "text": "On Wednesday, Chicago Public Schools (CPS) released its FY26 proposed budget. In a world of tough decisions, CPS leadership avoided additional cuts to schools, protecting the budgets principals and LSCs approved in June.  💲 Revenue: The budget assumes $379M in Tax Increment Financing (TIF) surplus, ", "eng": 24, "reactions": 21, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-08-12", "text": "One way The Chicago Public Education Fund attempts to show appreciation for school leaders is by listening to their perspectives and turning that feedback into action. Their insight shapes how we advocate for and support school leaders through our programming and policy agenda. For the past two year", "eng": 19, "reactions": 19, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2025-08-08", "text": "📢 Our team released a memo examining key considerations in the Chicago Public Schools (CPS) 2026 budget. The district faces a $734 million shortfall and an August 30 deadline to pass a balanced budget.  The TLDR? There are no easy solutions, but some clear options. CPS could:  1️⃣ Make further cuts:", "eng": 24, "reactions": 20, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-08-06", "text": "As part of their 2025-26 budget process, and to address the $734 million deficit, Chicago Public Schools (CPS) recently announced cuts to central office departments and services. While these cuts were made centrally to prevent cuts at schools, they do matter. CPS sent a series of communications last", "eng": 43, "reactions": 34, "comments": 9, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-08-04", "text": "Last week, our chief public affairs officer, Nelson Gerew, was invited to testify at the Illinois House Executive Committee subject-matter hearing on the Chicago Public Schools (CPS) budget. During his testimony, Nelson provided a historical overview of the district's finances from 2008 to 2025. Und", "eng": 44, "reactions": 43, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Video"}, {"date": "2025-07-31", "text": "📣 The Chicago Public Education Fund is looking for a seasoned strategic communication professional to join our team as the Senior Manager of Communications. This person will manage a small team that owns the communications strategy, brand, messaging, overall narrative, and channels for The Fund and ", "eng": 40, "reactions": 40, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2025-07-29", "text": "Love that my team has such deep connections to schools and all the ways we show up to support where we can. (Also, I appreciate the reminder on those 3rd-grade school supplies...)", "eng": 12, "reactions": 12, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-07-25", "text": "📣 At yesterday’s Chicago Board of Education meeting, Interim CEO Dr. Macquline S King, EdD reinforced what Chicago Public Schools (CPS) heard loud and clear from families, educators, and community members during 5 recent budget conversations. She highlighted the public’s support for:  ✅ identifying ", "eng": 62, "reactions": 62, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-07-21", "text": " 📊 On July 11, Chicago Public Schools (CPS) released final school budgets for the 2025–26 school year. These budgets reflect planning done by principals back in early June, based on a projected $229M deficit.  🛑 Included in these budgets are more than 1,450 school-based layoffs: ▪️ 432 teachers ▪️ 6", "eng": 40, "reactions": 40, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-07-18", "text": "This week, Chicago Public Schools (CPS) hosted a learning session, and three community feedback sessions focused on the 2025-26 budget. The goal? To provide information and context about the current budget, and to hear directly from the public on possible solutions.   I attended two of the community", "eng": 25, "reactions": 25, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-07-16", "text": "Grateful doesn’t begin to capture how I felt leaving last night’s Summer Leadership Institute Happy Hour.  The energy in the room, the laughter, the ideas, the honest reflection—it’s the kind of spark that sustains me during those long, meeting-packed days when motivation can run low. While our team", "eng": 121, "reactions": 116, "comments": 5, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-07-11", "text": "Chicago school leaders — let’s connect.  The Fund team will be at the Summer Leadership Institute next week to talk about how we can support you and your teams in the year ahead, especially as you plan for SY25-26:  ✅Stop by our SLI table at the vendor fair on Tuesday, July 15 from 10:30 am - 3:00 p", "eng": 21, "reactions": 19, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-07-08", "text": "The numbers are tough — and the timeline is tight.  In June, Chicago Public Schools (CPS) principals and Local School Councils finalized budgets based on a projected $229M budget deficit scenario.   Interim CEO Dr. Macquline S King, EdD has emphasized that the actual gap between revenue and expendit", "eng": 47, "reactions": 47, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2025-07-03", "text": "Earlier this week, I shared that Chicago Public Schools (CPS) now spends $800M annually on debt—funds that could otherwise support classrooms, teachers, and student services.  🏫Not all debt is bad. Borrowing for long-term capital projects, like modernizing aging school buildings, is standard in larg", "eng": 27, "reactions": 25, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-07-01", "text": "🔃 Last week, Chicago Public Schools (CPS) Interim CEO Dr. Macquline S King, EdD outlined a projected $734M gap between the district’s anticipated obligations and committed revenue.  What’s included in this number? ➖The $229M previously identified as the gap.  ➖$300M to account for the gap widening i", "eng": 47, "reactions": 42, "comments": 5, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-06-26", "text": "Yesterday, I wrote about the potential impact of additional Chicago Public Schools budget cuts on elementary schools by highlighting what that might look like for Disney. Today, let’s look at what could happen in a large, neighborhood high school.  🏫 Kenwood Academy is CPS’ fourth-largest school: \t▪", "eng": 37, "reactions": 31, "comments": 6, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-06-25", "text": "On June 5, CPS principals submitted their final school budgets — based on a projected $229M deficit. While the overall budgets were technically \\\"flat,\\\" most schools experienced reductions that required tough decisions.  📍Take Walt Disney Magnet School in Uptown as an example: Disney serves 1,394 stu", "eng": 21, "reactions": 18, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-06-21", "text": "Calling all visionary leaders in education!  The Chicago Education Alliance (CEA) is launching as a new field catalyst and is searching for its founding Executive Director.  This is a unique opportunity to lead a bold new force for education equity in Chicago. You'll build stronger relationships and", "eng": 130, "reactions": 128, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-06-20", "text": "At The Chicago Public Education Fund, listening to school leaders is core to our mission.  Every year, we ask Chicago’s principals and assistant principals what they need to succeed.   📊 If you’re deep into the data, I encourage you to check out the full report here: https://bit.ly/45rYmjg.   A few ", "eng": 7, "reactions": 7, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2025-06-18", "text": "In 13 years at The Chicago Public Education Fund, I have helped support nine CPS CEOs, and have learned something from each one.   📰 The headline: not everything that matters in the moment matters in the long run, and sometimes split-second choices have a very long tail.   I imagine CEO Pedro Martin", "eng": 81, "reactions": 79, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-06-12", "text": "Last evening, the Chicago Board of Education selected Dr. Macquline S King, EdD, current Senior Director of Education Policy for the City of Chicago as interim Superintendent (CEO). She will lead the district while the search for a permanent CEO/Superintendent continues.  Dr. King has spent the majo", "eng": 108, "reactions": 96, "comments": 12, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-06-09", "text": "Last week, it was reported that the Chicago Board of Education had identified three finalists for the interim CEO role:   🔹 Dr. Alfonso Carmona, Ed.D   🔹 Dr. Macquline S King, EdD   🔹 Chief Nicole Milberg According to a recent Fund poll, Chicagoans want a leader who knows our students, understands t", "eng": 54, "reactions": 54, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2025-06-06", "text": "Last night, we closed out the 2024–25 school year with more than 100 educators, partners, and civic leaders—a powerful reminder that when we come together on behalf of Chicago’s students, we get results.  This year, The Fund supported over 250 educators—principals, assistant principals, and other sc", "eng": 127, "reactions": 120, "comments": 7, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-06-04", "text": "On May 31, school leaders, students, and community members gathered to reflect on where our schools are thriving and where there is room for growth.  👏 What stood out most was the JOY people can experience in schools — teachers who inspire, principals who shape culture, students who are deeply engag", "eng": 37, "reactions": 37, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-05-30", "text": "As I previously shared, Chicago Public Schools (CPS) is currently conducting community conversations focused on the Superintendent (CEO) search in collaboration with Alma Advisory Group and Academy for Local Leadership. Our team has been involved in this process, both by attending these public conve", "eng": 36, "reactions": 36, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-05-28", "text": "With just 11 days left in the 2024–25 school year, Chicago students, families, and educators are celebrating a year of growth. They are also preparing for major transitions, from grade promotions to graduations.   CPS is preparing too, with a search underway for the next leader of the nation’s fourt", "eng": 20, "reactions": 20, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-05-25", "text": "This past week, I had the opportunity to spend time with committed and talented leaders from across the country through the Pahara Institute.  Our setting—Lone Rock Retreat—offered space for deep reflection, honest dialogue, and inspiration.   Here are three takeaways I’m carrying into the week ahea", "eng": 146, "reactions": 130, "comments": 16, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-05-23", "text": "What happens to schools if CPS has to cut their budgets beyond current levels?  Yesterday, I shared how a deficit greater than $229M could lead to reductions in school budgets. Today, I want to show what that could mean for individual schools.  In general, cuts would impact foundational staffing and", "eng": 65, "reactions": 53, "comments": 12, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-05-22", "text": "What could Chicago schools face if the CPS deficit grows?  Over the past few weeks, I’ve shared that there are multiple scenarios for CPS’ FY26 budget, with a deficit that could range from $229M to over $1B. That range is driven by uncertain revenues and big-picture cost drivers. Where Chicago lands", "eng": 19, "reactions": 15, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-05-19", "text": "Principals and Local School Councils (LSCs) are in the middle of one of the most complex budget seasons since 2017.  For 60% of current Chicago Public Schools (CPS) principals, this is their first experience managing through a “flat” or “deficit” budget scenario. As Mariel Laureano highlighted last ", "eng": 30, "reactions": 30, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-05-17", "text": "A beautiful (and very full!) day for learning and leadership in Chicago.  From the Cahn Fellowship alumni conference, to affinity work led by the Latino Leadership Pipeline, to budget office hours with Femi Skanes, Ed.D., to community conversations… today was remarkable and inspiring to witness.  (T", "eng": 31, "reactions": 30, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-05-16", "text": "Still feeling energized from Wednesday night’s Tapestry: Weaving Equity for Arts Education event with Nicole Losurdo Upton and the Ingenuity - Chicago.  👏 Congratulations to our fellow honorees, including Pedro Martinez and Bogdana Chkoumbova, Paul Schissler from Lara Academy, and the team at Guitar", "eng": 83, "reactions": 77, "comments": 6, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-05-14", "text": "Mariel Laureano spoke today to emphasize the need for a transparent and flexible budget process and to highlight the support we will provide to principals, Local School Councils, and their teams. ⬇️  ", "eng": 33, "reactions": 32, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-05-09", "text": "Chicago’s school leaders are facing real challenges — and showing real resolve.  As I’ve shared, Chicago Public Schools (CPS) is confronting its first significant budget deficit since 2017.   For over 60% of CPS principals, this will be their first time managing through such a deficit, and they’re d", "eng": 54, "reactions": 50, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-05-07", "text": "Two things I get to do regularly in my work at The Chicago Public Education Fund:  1️⃣ Connect with others who believe in public school leaders as powerful accelerators for young people and the pursuit of their dreams

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Heather Y. Anichini | Influencer Dashboard</title>
  <script src="influencer_data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root {
      --crimson:#6B1E2E; --page-bg:#F0EDE7; --card-bg:#FFFFFF;
      --border:#E0DDD6; --text:#1A1A1A; --muted:#6B6B6B; --muted-lt:#9A9A9A;
      --c2026:#7C3480; --c2025:#6B1E2E; --c2024:#1B4FA8; --c2023:#1A7A4A;
      --li-blue:#0A66C2; --x-dark:#14171A; --combined:#5B3FA6;
      --radius:10px; --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    body{font-family:var(--font);background:var(--page-bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}
    a{color:var(--crimson);text-decoration:none} a:hover{text-decoration:underline}
    .site-header{background:var(--crimson);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .header-left{display:flex;align-items:center;gap:20px}
    .back-link{font-size:12px;color:rgba(255,255,255,0.75);display:inline-flex;align-items:center;gap:5px;transition:color 0.15s;white-space:nowrap}
    .back-link:hover{color:#fff;text-decoration:none}
    .header-titles h1{font-size:18px;font-weight:700;color:#fff}
    .header-titles p{font-size:12px;color:rgba(255,255,255,0.65);margin-top:1px}
    .header-platform-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px}
    .page-wrap{max-width:1200px;margin:0 auto;padding:28px 24px 60px}
    .profile-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;display:flex;align-items:center;gap:18px;margin-bottom:24px;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
    .avatar{width:56px;height:56px;border-radius:50%;background:var(--crimson);color:#fff;font-size:18px;font-weight:700;letter-spacing:-0.5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .profile-info h2{font-size:20px;font-weight:700;color:var(--text)}
    .profile-info p{font-size:13px;color:var(--muted);margin-top:2px}
    .profile-meta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
    .meta-pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--muted)}
    .meta-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
    .data-source-tag{margin-left:auto;font-size:11px;color:var(--muted-lt);font-style:italic;white-space:nowrap}
    .platform-tabs{display:flex;gap:0;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:5px;margin-bottom:24px;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
    .ptab{flex:1;padding:9px 16px;border-radius:7px;border:none;background:transparent;color:var(--muted);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all 0.15s}
    .ptab:hover:not(.ptab-active){background:#f5f2ed;color:var(--text)}
    .ptab-active-li{background:#e8f0fb;color:var(--li-blue)}
    .ptab-active-x{background:#f0f0f0;color:var(--x-dark)}
    .ptab-active-combined{background:#ede8f7;color:var(--combined)}
    .kpi-section{margin-bottom:20px}
    .kpi-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .kpi-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;min-width:170px;flex:1;box-shadow:0 1px 4px rgba(0,0,0,0.05);border-top:3px solid transparent}
    .kpi-year{font-size:11px;font-weight:700;letter-spacing:0.06em;margin-bottom:8px}
    .kpi-val{font-size:28px;font-weight:700;color:var(--text);line-height:1}
    .kpi-label{font-size:12px;color:var(--muted);margin-top:4px}
    .kpi-delta{font-size:11px;font-weight:600;margin-top:6px;display:flex;align-items:center;gap:3px}
    .delta-down{color:#C0392B} .delta-up{color:#1A7A4A}
    .kpi-2026{border-top-color:var(--c2026)} .kpi-year-2026{color:var(--c2026)}
    .kpi-2025{border-top-color:var(--c2025)} .kpi-year-2025{color:var(--c2025)}
    .kpi-2024{border-top-color:var(--c2024)} .kpi-year-2024{color:var(--c2024)}
    .kpi-2023{border-top-color:var(--c2023)} .kpi-year-2023{color:var(--c2023)}
    .kpi-green{border-top-color:#1A7A4A} .kpi-year-green{color:#1A7A4A}
    .info-banner{background:#FBF8EE;border:1px solid #E8DFC0;border-radius:var(--radius);padding:12px 16px;font-size:12px;color:#6B5B2E;margin-bottom:20px;display:flex;gap:8px;align-items:flex-start}
    .chart-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
    .chart-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;gap:10px}
    .chart-title{font-size:15px;font-weight:700;color:var(--text)}
    .chart-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .chart-toggles{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden}
    .ctoggle{padding:6px 14px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all 0.15s;border-right:1px solid var(--border)}
    .ctoggle:last-child{border-right:none}
    .ctoggle:hover:not(.ctoggle-active){background:#f5f2ed}
    .ctoggle-active{background:var(--crimson);color:#fff}
    .chart-wrap{position:relative;height:260px}
    .two-col{display:grid;grid-template-columns:1fr 300px;gap:16px;margin-bottom:20px}
    .breakdown-stack{display:flex;flex-direction:column;gap:12px}
    .breakdown-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;flex:1;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
    .breakdown-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px}
    .bar-item{margin-bottom:9px} .bar-item:last-child{margin-bottom:0}
    .bar-label-row{display:flex;justify-content:space-between;margin-bottom:3px}
    .bar-label{font-size:12px;color:var(--text)} .bar-count{font-size:12px;color:var(--muted)}
    .bar-track{height:5px;background:#EDE9E2;border-radius:3px;overflow:hidden}
    .bar-fill{height:100%;border-radius:3px;transition:width 0.6s ease}
    .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
    .compare-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
    .compare-header{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
    .stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0ede7}
    .stat-row:last-child{border-bottom:none}
    .stat-name{font-size:12px;color:var(--muted)} .stat-val{font-size:13px;font-weight:600;color:var(--text)}
    .feed-section{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;box-shadow:0 1px 4px rgba(0,0,0,0.04)}
    .feed-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:10px}
    .feed-title{font-size:15px;font-weight:700;color:var(--text)}
    .feed-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
    .feed-controls{display:flex;gap:8px;flex-wrap:wrap}
    .feed-select{background:#fff;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;font-size:12px;font-family:var(--font);cursor:pointer;outline:none}
    .feed-select:focus{border-color:var(--crimson)}
    .post-item{border-top:1px solid var(--border);padding:14px 0;cursor:pointer}
    .post-item:first-child{border-top:none;padding-top:0}
    .post-item:hover .post-text{color:var(--crimson)}
    .post-top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:5px}
    .post-meta-left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .post-date{font-size:11px;color:var(--muted-lt)}
    .post-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:#f0ede7;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em}
    .post-text{font-size:13px;color:var(--text);line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;transition:color 0.15s}
    .post-text.expanded{display:block;-webkit-line-clamp:unset}
    .post-stats{display:flex;gap:14px;margin-top:7px;flex-wrap:wrap}
    .post-stat{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
    .post-stat strong{color:var(--text)}
    .eng-badge{font-size:13px;font-weight:700;color:var(--crimson);white-space:nowrap;flex-shrink:0}
    .feed-more{text-align:center;padding:14px;font-size:12px;color:var(--muted-lt);border-top:1px solid var(--border)}
    .page-footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted-lt);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
    @media(max-width:750px){.two-col{grid-template-columns:1fr}.compare-grid{grid-template-columns:1fr}.kpi-row{flex-direction:column}.kpi-card{min-width:0}.site-header{padding:12px 16px}.page-wrap{padding:20px 14px 48px}}
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-left">
    <a href="index.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M9.78 12.78a.75.75 0 0 1-1.06 0L4.47 8.53a.75.75 0 0 1 0-1.06l4.25-4.25a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042L6.06 8l3.72 3.72a.75.75 0 0 1 0 1.06z"/></svg>
      Back to Org Dashboard
    </a>
    <div class="header-titles">
      <h1>Influencer Analytics</h1>
      <p>The Chicago Public Education Fund — Leadership Voices</p>
    </div>
  </div>
  <div id="header-badge" class="header-platform-badge">LinkedIn</div>
</header>

<div class="page-wrap">
  <div class="profile-card">
    <div class="avatar">HA</div>
    <div class="profile-info">
      <h2>Heather Y. Anichini</h2>
      <p>CEO, The Chicago Public Education Fund</p>
      <div class="profile-meta" id="profile-meta"></div>
    </div>
    <div class="data-source-tag" id="data-source-tag"></div>
  </div>

  <div class="platform-tabs">
    <button class="ptab" id="tab-li" onclick="setTab('li')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
      LinkedIn
    </button>
    <button class="ptab" id="tab-x" onclick="setTab('x')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      X (Twitter)
    </button>
    <button class="ptab" id="tab-combined" onclick="setTab('combined')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="12" r="7"/><circle cx="15" cy="12" r="7"/></svg>
      Combined
    </button>
  </div>

  <div id="content-area"></div>

  <div class="page-footer">
    <span>Data sourced from Sprout Social — The Chicago Public Education Fund</span>
    <span id="footer-note"></span>
  </div>
</div>

<script>
// ─── Pull data from window.INFLUENCER_DATA (built by build.js) ───────────────
const raw = window.INFLUENCER_DATA || null;

// Split posts by network
const LI_FEED = raw ? raw.posts.filter(p => p.network === 'LinkedIn')
                          .sort((a,b) => b.date.localeCompare(a.date)) : [];
const X_FEED  = raw ? raw.posts.filter(p => p.network === 'X')
                          .sort((a,b) => b.date.localeCompare(a.date)) : [];

// Build monthly arrays per platform
function monthlyForPlatform(feed) {
  const map = {};
  feed.forEach(p => {
    const key = p.date.slice(0,7);
    if (!map[key]) map[key] = {month:key, posts:0, engagements:0, reactions:0, comments:0, shares:0, likes:0, impressions:0};
    map[key].posts++;
    map[key].engagements += p.eng       || 0;
    map[key].reactions   += p.reactions || 0;
    map[key].comments    += p.comments  || 0;
    map[key].shares      += p.shares    || 0;
    map[key].likes       += p.reactions || 0; // X uses reactions col as likes
    map[key].impressions += p.imp       || 0;
  });
  return Object.values(map)
    .sort((a,b) => a.month.localeCompare(b.month))
    .map(m => ({...m, avgEng: m.posts ? Math.round(m.engagements/m.posts*10)/10 : 0}));
}

function yearsForPlatform(feed) {
  const map = {};
  feed.forEach(p => {
    const yr = p.date.slice(0,4);
    if (!map[yr]) map[yr] = {year:parseInt(yr), posts:0, totalEng:0, impressions:0};
    map[yr].posts++;
    map[yr].totalEng    += p.eng || 0;
    map[yr].impressions += p.imp || 0;
  });
  const years = Object.values(map).sort((a,b) => b.year - a.year);
  years.forEach((y,i) => {
    y.avgEng = y.posts ? Math.round(y.totalEng/y.posts*10)/10 : 0;
    const prev = years[i+1];
    if (prev && prev.avgEng > 0) {
      const pct = ((y.avgEng - prev.avgEng)/prev.avgEng*100).toFixed(1);
      y.deltaLabel = Math.abs(pct) + '% vs ' + prev.year;
      y.deltaDir   = pct >= 0 ? 'up' : 'down';
    } else { y.deltaLabel = ''; y.deltaDir = ''; }
  });
  return years;
}

const LI_MONTHLY = monthlyForPlatform(LI_FEED);
const X_MONTHLY  = monthlyForPlatform(X_FEED);
const LI_YEARS   = yearsForPlatform(LI_FEED);
const X_YEARS    = yearsForPlatform(X_FEED);

// ─── State ────────────────────────────────────────────────────────────────────
let currentTab = 'li';
let liChartMode = 'perPost', xChartMode = 'perPost';
let activeChart = null, combinedChart = null;

// ─── Boot: populate data source tag ──────────────────────────────────────────
(function() {
  const tag = document.getElementById('data-source-tag');
  if (raw && raw.meta) {
    tag.textContent = raw.meta.firstDate + ' – ' + raw.meta.lastDate
      + ' · ' + raw.meta.totalPosts + ' posts';
  } else {
    tag.textContent = 'No data loaded';
  }
  setTab('li');
})();

// ─── Tab control ──────────────────────────────────────────────────────────────
function setTab(tab) {
  currentTab = tab;
  if (activeChart)   { activeChart.destroy();   activeChart   = null; }
  if (combinedChart) { combinedChart.destroy(); combinedChart = null; }
  ['li','x','combined'].forEach(t => {
    document.getElementById('tab-'+t).className = 'ptab'+(t===tab?' ptab-active-'+t:'');
  });
  updateHeaderBadge(); updateProfileMeta(); updateFooter();
  renderContent();
  setTimeout(() => {
    if (tab==='li')     { drawChart('li', liChartMode); renderFeed('li'); }
    else if (tab==='x') { drawChart('x',  xChartMode);  renderFeed('x');  }
    else                  drawCombinedChart();
  }, 0);
}

function updateHeaderBadge() {
  const b = document.getElementById('header-badge');
  if (currentTab==='li')     b.textContent = 'LinkedIn';
  else if (currentTab==='x') b.textContent = 'X / Twitter';
  else                       b.textContent = 'LinkedIn + X';
}

function updateProfileMeta() {
  const m = document.getElementById('profile-meta');
  const liDates = LI_FEED.length ? LI_FEED[LI_FEED.length-1].date+' – '+LI_FEED[0].date : '—';
  const xDates  = X_FEED.length  ? X_FEED[X_FEED.length-1].date+' – '+X_FEED[0].date   : '—';
  if (currentTab==='li')
    m.innerHTML = metaPill('#0A66C2','LinkedIn Personal Profile')+metaPillText(liDates)+metaPillText(LI_FEED.length+' posts tracked');
  else if (currentTab==='x')
    m.innerHTML = metaPill('#14171A','X / Twitter @MsAnichini')+metaPillText(xDates)+metaPillText(X_FEED.length+' posts tracked');
  else
    m.innerHTML = metaPill('#5B3FA6','LinkedIn + X')+metaPillText((LI_FEED.length+X_FEED.length)+' total posts');
}

function metaPill(color,text){ return `<span class="meta-pill"><span class="meta-dot" style="background:${color}"></span>${text}</span>`; }
function metaPillText(text){ return `<span class="meta-pill">${text}</span>`; }

function updateFooter() {
  const n = document.getElementById('footer-note');
  if (currentTab==='li')     n.textContent = 'LinkedIn · Personal account · Impressions available from January 2026 onward';
  else if (currentTab==='x') n.textContent = '@MsAnichini · X data from Sprout Social export';
  else                       n.textContent = 'LinkedIn + X · Combined Sprout Social export';
}

// ─── Render ───────────────────────────────────────────────────────────────────
function renderContent() {
  const area = document.getElementById('content-area');
  if (currentTab==='li')     area.innerHTML = renderLinkedIn();
  else if (currentTab==='x') area.innerHTML = renderX();
  else                       area.innerHTML = renderCombined();
}

// ─── LinkedIn ──────────────────────────────────────────────────────────────────
function renderLinkedIn() {
  const totalImp = LI_MONTHLY.reduce((a,m)=>a+(m.impressions||0),0);
  const kpiCards = LI_YEARS.map(y => {
    const cls = String(y.year);
    const delta = y.deltaLabel ? `<div class="kpi-delta ${y.deltaDir==='down'?'delta-down':'delta-up'}">${y.deltaDir==='down'?'↓':'↑'} ${y.deltaLabel}</div>` : '';
    return `
    <div class="kpi-card kpi-${cls}">
      <div class="kpi-year kpi-year-${cls}">${y.year}</div>
      <div class="kpi-val">${y.avgEng}</div>
      <div class="kpi-label">Avg engagements / post</div>${delta}
    </div>
    <div class="kpi-card kpi-${cls}">
      <div class="kpi-year kpi-year-${cls}">${y.year}</div>
      <div class="kpi-val">${fmt(y.totalEng)}</div>
      <div class="kpi-label">Total engagements (${y.posts} posts)</div>
    </div>`;
  }).join('');
  const impCard = totalImp > 0 ? `<div class="kpi-row"><div class="kpi-card kpi-green" style="max-width:220px">
    <div class="kpi-year kpi-year-green">2026 YTD</div>
    <div class="kpi-val">${fmt(totalImp)}</div>
    <div class="kpi-label">Total impressions (Jan 2026+)</div>
  </div></div>` : '';
  const liYears = [...new Set(LI_FEED.map(p=>p.date.slice(0,4)))].sort().reverse();
  return `
  <div class="kpi-section"><div class="kpi-row">${kpiCards}</div>${impCard}</div>
  <div class="info-banner">
    <span style="font-size:14px;flex-shrink:0">ⓘ</span>
    <span>LinkedIn only began sharing impression data for personal accounts in early 2026. Engagement metrics (reactions, comments) are available for all posts since January 2024 and are the primary performance indicator for this profile.</span>
  </div>
  <div class="chart-card">
    <div class="chart-header">
      <div><div class="chart-title">Engagements per post over time</div></div>
      <div class="chart-toggles">
        <button class="ctoggle ctoggle-active" id="li-tog-pp" onclick="switchChart('li','perPost')">Per Post</button>
        <button class="ctoggle" id="li-tog-mt" onclick="switchChart('li','monthly')">Monthly Total</button>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
  </div>
  <div class="feed-section">
    <div class="feed-header">
      <div><div class="feed-title">Post Feed</div><div class="feed-sub">All posts sorted newest first. Click any post to expand the full text.</div></div>
      <div class="feed-controls">
        <select class="feed-select" id="li-year-filter" onchange="renderFeed('li')">
          <option value="all">All years</option>
          ${liYears.map(y=>`<option value="${y}">${y}</option>`).join('')}
        </select>
        <select class="feed-select" id="li-sort" onchange="renderFeed('li')">
          <option value="newest">Newest first</option><option value="oldest">Oldest first</option>
          <option value="eng">Most engaged</option><option value="reactions">Most reactions</option>
        </select>
      </div>
    </div>
    <div id="li-feed-list"></div>
  </div>`;
}

// ─── X ────────────────────────────────────────────────────────────────────────
function renderX() {
  const total = X_FEED.length;
  const typeCounts={}, contentCounts={};
  X_FEED.forEach(p=>{
    const t=p.contentType||'Unknown';
    const pt=(p.network==='X'&&p.contentType)?p.contentType:'Post';
    contentCounts[t]=(contentCounts[t]||0)+1;
  });
  const contentItems=Object.entries(contentCounts).sort((a,b)=>b[1]-a[1]);
  const contentColors=['#14171A','#657786','#AAB8C2','#D0D5DA'];
  const kpiCards = X_YEARS.map(y=>{
    const cls=String(y.year);
    const delta=y.deltaLabel?`<div class="kpi-delta ${y.deltaDir==='down'?'delta-down':'delta-up'}">${y.deltaDir==='down'?'↓':'↑'} ${y.deltaLabel}</div>`:'';
    return `
    <div class="kpi-card kpi-${cls}">
      <div class="kpi-year kpi-year-${cls}">${y.year}</div>
      <div class="kpi-val">${y.avgEng}</div>
      <div class="kpi-label">Avg engagements / post</div>${delta}
    </div>
    <div class="kpi-card kpi-${cls}">
      <div class="kpi-year kpi-year-${cls}">${y.year}</div>
      <div class="kpi-val">${fmt(y.totalEng)}</div>
      <div class="kpi-label">Total engagements (${y.posts} posts)</div>
    </div>`;
  }).join('');
  const xYears=[...new Set(X_FEED.map(p=>p.date.slice(0,4)))].sort().reverse();
  return `
  <div class="kpi-section"><div class="kpi-row">${kpiCards}</div></div>
  <div class="two-col">
    <div class="chart-card" style="margin-bottom:0">
      <div class="chart-header">
        <div><div class="chart-title">Engagements per post over time</div></div>
        <div class="chart-toggles">
          <button class="ctoggle ctoggle-active" id="x-tog-pp" onclick="switchChart('x','perPost')">Per Post</button>
          <button class="ctoggle" id="x-tog-mt" onclick="switchChart('x','monthly')">Monthly Total</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
    </div>
    <div class="breakdown-stack">
      <div class="breakdown-card">
        <div class="breakdown-title">Content Format</div>
        ${contentItems.map(([l,v],i)=>makeBar(l,v,total,contentColors[i]||'#999')).join('')}
      </div>
    </div>
  </div>
  <div class="feed-section" style="margin-top:0">
    <div class="feed-header">
      <div><div class="feed-title">Post Feed</div><div class="feed-sub">All posts sorted newest first. Click any post to expand.</div></div>
      <div class="feed-controls">
        <select class="feed-select" id="x-year-filter" onchange="renderFeed('x')">
          <option value="all">All years</option>
          ${xYears.map(y=>`<option value="${y}">${y}</option>`).join('')}
        </select>
        <select class="feed-select" id="x-sort" onchange="renderFeed('x')">
          <option value="newest">Newest first</option><option value="oldest">Oldest first</option>
          <option value="eng">Most engaged</option>
        </select>
      </div>
    </div>
    <div id="x-feed-list"></div>
  </div>`;
}

// ─── Combined ─────────────────────────────────────────────────────────────────
function renderCombined() {
  const liTot=LI_YEARS.reduce((a,y)=>({posts:a.posts+y.posts,eng:a.eng+y.totalEng}),{posts:0,eng:0});
  const xTot =X_YEARS.reduce((a,y)=>({posts:a.posts+y.posts,eng:a.eng+y.totalEng}),{posts:0,eng:0});
  const combinedEng=liTot.eng+xTot.eng, combinedPosts=liTot.posts+xTot.posts;
  const liAvg=liTot.posts?(liTot.eng/liTot.posts).toFixed(1):0;
  const xAvg =xTot.posts ?(xTot.eng/xTot.posts).toFixed(1) :0;
  const combinedAvg=combinedPosts?(combinedEng/combinedPosts).toFixed(1):0;
  const liPct=combinedEng?Math.round(liTot.eng/combinedEng*100):0;
  const multiplier=xAvg>0?Math.round(parseFloat(liAvg)/parseFloat(xAvg)):'—';
  return `
  <div class="info-banner" style="border-color:#D0C4E8;background:#F5F0FC;color:#3D2A6B">
    <span style="font-size:14px;flex-shrink:0">⚡</span>
    <span>Combined view covers all available data for both platforms. LinkedIn drives significantly higher engagement per post — it is Heather's stronger reach platform by a wide margin.</span>
  </div>
  <div class="kpi-section"><div class="kpi-row">
    <div class="kpi-card" style="border-top-color:var(--combined)">
      <div class="kpi-year" style="color:var(--combined)">ALL TIME</div>
      <div class="kpi-val">${combinedPosts}</div>
      <div class="kpi-label">Total posts across both platforms</div>
    </div>
    <div class="kpi-card" style="border-top-color:var(--combined)">
      <div class="kpi-year" style="color:var(--combined)">ALL TIME</div>
      <div class="kpi-val">${fmt(combinedEng)}</div>
      <div class="kpi-label">Combined total engagements</div>
    </div>
    <div class="kpi-card" style="border-top-color:var(--combined)">
      <div class="kpi-year" style="color:var(--combined)">ALL TIME</div>
      <div class="kpi-val">${combinedAvg}</div>
      <div class="kpi-label">Overall avg eng / post</div>
    </div>
    <div class="kpi-card" style="border-top-color:var(--li-blue)">
      <div class="kpi-year" style="color:var(--li-blue)">INSIGHT</div>
      <div class="kpi-val" style="font-size:20px;color:var(--li-blue)">LinkedIn</div>
      <div class="kpi-label">${liPct}% of all engagements · ${multiplier}× avg eng/post vs X</div>
    </div>
  </div></div>
  <div class="compare-grid">
    <div class="compare-card">
      <div class="compare-header" style="color:var(--li-blue)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
        LinkedIn
      </div>
      <div class="stat-row"><span class="stat-name">Total posts</span><span class="stat-val">${liTot.posts}</span></div>
      <div class="stat-row"><span class="stat-name">Total engagements</span><span class="stat-val">${liTot.eng.toLocaleString()}</span></div>
      <div class="stat-row"><span class="stat-name">Avg eng / post</span><span class="stat-val">${liAvg}</span></div>
      <div class="stat-row"><span class="stat-name">Share of total eng</span><span class="stat-val">${liPct}%</span></div>
    </div>
    <div class="compare-card">
      <div class="compare-header" style="color:var(--x-dark)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        X (Twitter)
      </div>
      <div class="stat-row"><span class="stat-name">Total posts</span><span class="stat-val">${xTot.posts}</span></div>
      <div class="stat-row"><span class="stat-name">Total engagements</span><span class="stat-val">${xTot.eng.toLocaleString()}</span></div>
      <div class="stat-row"><span class="stat-name">Avg eng / post</span><span class="stat-val">${xAvg}</span></div>
      <div class="stat-row"><span class="stat-name">Share of total eng</span><span class="stat-val">${100-liPct}%</span></div>
    </div>
  </div>
  <div class="chart-card">
    <div class="chart-header">
      <div><div class="chart-title">Monthly engagements — LinkedIn vs. X</div><div class="chart-sub">Overlapping date window</div></div>
    </div>
    <div class="chart-wrap" style="height:240px"><canvas id="combinedChartCanvas"></canvas></div>
  </div>`;
}

// ─── Charts ───────────────────────────────────────────────────────────────────
function switchChart(platform, mode) {
  if (platform==='li') {
    liChartMode=mode;
    document.getElementById('li-tog-pp').className='ctoggle'+(mode==='perPost'?' ctoggle-active':'');
    document.getElementById('li-tog-mt').className='ctoggle'+(mode==='monthly'?' ctoggle-active':'');
  } else {
    xChartMode=mode;
    document.getElementById('x-tog-pp').className='ctoggle'+(mode==='perPost'?' ctoggle-active':'');
    document.getElementById('x-tog-mt').className='ctoggle'+(mode==='monthly'?' ctoggle-active':'');
  }
  if (activeChart) { activeChart.destroy(); activeChart=null; }
  drawChart(platform, mode);
}

function drawChart(platform, mode) {
  const canvas=document.getElementById('mainChart');
  if (!canvas) return;
  const monthly=platform==='li'?LI_MONTHLY:X_MONTHLY;
  if (!monthly.length) return;
  if (mode==='perPost') {
    const yearColors={'2024':'#1B4FA8','2025':'#6B1E2E','2026':'#7C3480','2023':'#1A7A4A'};
    const datasets={};
    monthly.forEach(m=>{
      const yr=m.month.slice(0,4);
      if (!datasets[yr]) datasets[yr]={label:yr,data:[],backgroundColor:yearColors[yr]||'#999',pointRadius:7,pointHoverRadius:9};
      datasets[yr].data.push({x:fmtMonth(m.month),y:m.avgEng});
    });
    activeChart=new Chart(canvas,{type:'scatter',data:{datasets:Object.values(datasets)},options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,labels:{color:'#6B6B6B',font:{size:11,family:'Inter,sans-serif'},boxWidth:10,padding:14}},tooltip:tooltipStyle()},
      scales:{x:{type:'category',labels:monthly.map(m=>fmtMonth(m.month)),...axisStyle()},y:{...axisStyle()}}
    }});
  } else {
    activeChart=new Chart(canvas,{type:'bar',data:{
      labels:monthly.map(m=>fmtMonth(m.month)),
      datasets:[{label:'Total Engagements',data:monthly.map(m=>m.engagements),
        backgroundColor:platform==='li'?'rgba(107,30,46,0.6)':'rgba(20,23,26,0.5)',
        borderColor:platform==='li'?'#6B1E2E':'#14171A',borderWidth:1,borderRadius:4}]
    },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tooltipStyle()},scales:{x:axisStyle(),y:axisStyle()}}});
  }
}

function drawCombinedChart() {
  const canvas=document.getElementById('combinedChartCanvas');
  if (!canvas) return;
  const allMonths=[...new Set([...LI_MONTHLY.map(m=>m.month),...X_MONTHLY.map(m=>m.month)])].sort();
  const liMap=Object.fromEntries(LI_MONTHLY.map(m=>[m.month,m.engagements]));
  const xMap =Object.fromEntries(X_MONTHLY.map(m=>[m.month,m.engagements]));
  combinedChart=new Chart(canvas,{type:'bar',data:{
    labels:allMonths.map(fmtMonth),
    datasets:[
      {label:'LinkedIn',data:allMonths.map(m=>liMap[m]||0),backgroundColor:'rgba(107,30,46,0.65)',borderColor:'#6B1E2E',borderWidth:1,borderRadius:3},
      {label:'X (Twitter)',data:allMonths.map(m=>xMap[m]||0),backgroundColor:'rgba(20,23,26,0.35)',borderColor:'#14171A',borderWidth:1,borderRadius:3}
    ]
  },options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:true,labels:{color:'#6B6B6B',font:{size:11,family:'Inter,sans-serif'},boxWidth:12,padding:16}},tooltip:tooltipStyle()},
    scales:{x:axisStyle(),y:axisStyle()}}});
}

function tooltipStyle(){return{backgroundColor:'#fff',borderColor:'#E0DDD6',borderWidth:1,titleColor:'#1A1A1A',bodyColor:'#6B6B6B',padding:10,titleFont:{size:12,family:'Inter,sans-serif'},bodyFont:{size:12,family:'Inter,sans-serif'}};}
function axisStyle(){return{grid:{color:'rgba(0,0,0,0.05)'},ticks:{color:'#9A9A9A',font:{size:10,family:'Inter,sans-serif'},maxTicksLimit:14,maxRotation:45},border:{color:'#E0DDD6'}};}

// ─── Feed ──────────────────────────────────────────────────────────────────────
function renderFeed(platform) {
  const listId=platform==='li'?'li-feed-list':'x-feed-list';
  const yearId=platform==='li'?'li-year-filter':'x-year-filter';
  const sortId=platform==='li'?'li-sort':'x-sort';
  const allPosts=platform==='li'?LI_FEED:X_FEED;
  const list=document.getElementById(listId);
  if (!list) return;
  const year=document.getElementById(yearId)?.value||'all';
  const sort=document.getElementById(sortId)?.value||'newest';
  let posts=[...allPosts];
  if (year!=='all') posts=posts.filter(p=>p.date.startsWith(year));
  if (sort==='newest')        posts.sort((a,b)=>b.date.localeCompare(a.date));
  else if (sort==='oldest')   posts.sort((a,b)=>a.date.localeCompare(b.date));
  else if (sort==='eng')      posts.sort((a,b)=>b.eng-a.eng);
  else if (sort==='reactions') posts.sort((a,b)=>(b.reactions||0)-(a.reactions||0));
  list.innerHTML=posts.slice(0,50).map(p=>{
    const stats=platform==='li'
      ?`<span class="post-stat">♥ <strong>${p.reactions||0}</strong></span>
        <span class="post-stat">💬 <strong>${p.comments||0}</strong></span>
        <span class="post-stat">↺ <strong>${p.shares||0}</strong></span>
        ${p.imp?`<span class="post-stat">👁 <strong>${p.imp.toLocaleString()}</strong></span>`:''}`
      :`<span class="post-stat">♥ <strong>${p.reactions||0}</strong></span>
        <span class="post-stat">💬 <strong>${p.comments||0}</strong></span>
        <span class="post-stat">↺ <strong>${p.shares||0}</strong></span>`;
    return `<div class="post-item" onclick="togglePost(this)">
      <div class="post-top-row">
        <div class="post-meta-left">
          <span class="post-date">${p.date}</span>
          <span class="post-badge">${escHtml(p.contentType||'')}</span>
        </div>
        <span class="eng-badge">${p.eng||0} eng</span>
      </div>
      <div class="post-text">${escHtml(p.post||'')}</div>
      <div class="post-stats">${stats}</div>
    </div>`;
  }).join('')+(posts.length>50?`<div class="feed-more">${posts.length-50} more posts — use filters to narrow results</div>`:'');
}

function togglePost(el){el.querySelector('.post-text').classList.toggle('expanded');}
function fmt(n){if(n>=1000)return(n/1000).toFixed(1).replace(/\.0$/,'')+'K';return String(n);}
function fmtMonth(str){const[y,m]=str.split('-');const names=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return names[parseInt(m)]+" '"+y.slice(2);}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function makeBar(label,val,total,color){const pct=Math.round(val/total*100);return`<div class="bar-item"><div class="bar-label-row"><span class="bar-label">${label}</span><span class="bar-count">${val} (${pct}%)</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div></div>`;}
</script>
</body>

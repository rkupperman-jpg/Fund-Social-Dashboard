.  2️⃣ Learn from and with the brilliant humans on my team and in the schools we su", "eng": 51, "reactions": 51, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-05-01", "text": "After nearly 24 years with Chicago Public Schools — including the last three as Chief Education Officer — Bogdana Chkoumbova is closing an extraordinary chapter of service.  I’ve had the privilege of supporting her work for more than a decade, from her time as a principal to her leadership as a Netw", "eng": 221, "reactions": 201, "comments": 20, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-05-01", "text": "Recently, I shared one potential way to close the Chicago Public Schools' $529M budget gap: TIF.   Last June, the city outlined a path that could help; it includes allowing TIF districts to expire and could eventually mean up to $300 million annually for CPS. That would narrow the structural gap ove", "eng": 16, "reactions": 13, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-04-23", "text": "Earlier this week, I shared updates about the $529 million budget gap facing Chicago Public Schools in 2026.   There’s no easy fix—but one potential source of revenue worth discussing is Tax Increment Financing (TIF). Let’s explore what that means.  🙋 What is a TIF? It’s a tool a city can use when i", "eng": 29, "reactions": 28, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-04-21", "text": "💬 Chicago Public Schools is projecting a $529M deficit for the 2026 fiscal year (FY26), and there are no easy solutions.  Let’s break down the numbers — and why this matters for our schools, students, and city...  🔹 What’s Driving the Gap? ➕ Revenue growth (mostly property taxes and state funding): ", "eng": 35, "reactions": 32, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Document"}, {"date": "2025-04-15", "text": "Quick recap: Launched in the 1960s as a part of the nation’s shared commitment to strong public schools for all, Title I aims to help “level the playing field” in a system where local and state funding is often dependent on generational property wealth. Title I recognizes that potential is everywher", "eng": 25, "reactions": 25, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-04-11", "text": "I started #APWeek25 outside my comfort zone with a video thanking assistant principals. I ended it in my favorite place - schools! In between, our team hosted a happy hour where we celebrated with our partners at the Department of Principal Quality (DPQ) and CPAA. Grateful for the opportunity to cel", "eng": 50, "reactions": 49, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-04-10", "text": "📣 Know someone who is curious, committed, and passionate about public education in Chicago?  We’re looking for Summer Fellows to join The Chicago Public Education Fund — and we’d love your help finding them.  ✅ Do they ask great questions? ✅ Are they great with words or data (or both)? ✅ Do they hav", "eng": 47, "reactions": 44, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2025-04-08", "text": "It's #APWeek25, which means I got over a deep dislike of myself on video to share an even deeper appreciation for the work of Chicago's assistant principals.   👏 Be sure to thank an AP in your world this week. The work is hard, and a little bit of gratitude goes a long way. 👏 ", "eng": 86, "reactions": 86, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Video"}, {"date": "2025-04-04", "text": "Assistant principals wear many hats. Please nominate your favorite AP for recognition during #APWeek25. Stay tuned as we highlight these leaders' remarkable stories.   https://bit.ly/3FOuYJc ", "eng": 6, "reactions": 6, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-03-25", "text": "Any collaboration between The Learning Accelerator and Leading Educators is bound to be useful in classrooms and schools; this set of resources is no exception. No matter where you are in your school’s AI journey, check them out. Shout out to Jin-Soo Huh and Chong-Hao Fu who continue to inspire with", "eng": 16, "reactions": 15, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-03-21", "text": "📅 As we head into Spring Break, here's a quick save-the-date for the assistant principals in my network.   🎉 🎉 We'll celebrate Chicago's #APWeek25 with a Happy Hour for YOU on Thursday, April 10. I hope to see you there! 🎉 🎉  Best wishes for a RESTFUL Spring Break, all! You earned every nap! 😴 ", "eng": 11, "reactions": 11, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-03-20", "text": "Wonderful to see the incredible work of Principal Virag Nanavati and his team at Farragut honored during the Chicago Public Schools Board meeting today.   Lots of appreciation for the work of partners like Enlace Chicago and Hope Chicago in the postsecondary progress made by young people at the scho", "eng": 55, "reactions": 48, "comments": 7, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-03-19", "text": "I have been reading a lot (and writing a little) about the budget decisions facing the Chicago Board of Education and the CPS leadership team. Their choices will impact students, teachers, principals, and communities today and in the future. This piece is an essential read for those trying to unders", "eng": 33, "reactions": 32, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-03-14", "text": "Did you know that 30% of people living in Cook County struggle with reading and comprehension? That means there’s likely at least one adult on your block or in your apartment building who may need support.  In recognition of National Literacy Month, the Illinois Literacy Foundation is seeking volunt", "eng": 13, "reactions": 13, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-03-12", "text": "Lately, there’s been a lot of discussion around whether the Chicago Board of Education should approve a $175 million payment to reimburse the City for a pension payment to the Municipal Employees’ Annuity and Benefit Fund (MEABF). This will be the topic of two public hearings on the budget this week", "eng": 83, "reactions": 77, "comments": 6, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-03-10", "text": "Last week, I had the pleasure of working with Myetie Hamilton, Daniel Cervantes, and the team Leadership Greater Chicago to moderate a fireside chat with CPS CEO Pedro Martinez.  Two things I took away from the discussion:  1️⃣ Courageous leadership starts with knowing your values and is facilitated", "eng": 67, "reactions": 60, "comments": 7, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-03-08", "text": "Managing time is a balancing act for all leaders. For principals and assistant principals, the choices they make about the hours in and outside of school shape the future of education.  This morning, we welcomed dozens (!) of Chicago’s principals and assistant principals into our space at The Chicag", "eng": 59, "reactions": 57, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-03-04", "text": "A few weeks ago, I wrote about Title I, one of the federal education programs reduced to sound bites in the media right now.   Let’s take a step back.  In 1965, our country made a national commitment: A child’s zip code should not determine their destiny. Title I was created to ensure that talent an", "eng": 64, "reactions": 63, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-02-28", "text": "Big news! 🎉  Yesterday, a long-time #CareerGoal became a reality—I’m officially part of the newest Pahara Institute cohort!   I deeply admire the vision and approach of Kriste Dragon and her team, and every alum I know has been changed by the experience.  This wouldn't have been possible without my ", "eng": 253, "reactions": 202, "comments": 51, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-02-27", "text": "Black History is Chicago history—every day of the year. Black History Month gives us the opportunity to amplify the stories and leadership that continue to shape our city.  This year, my team has been deeply engaged in supporting Local School Councils, which has led us to reflect on the vision of Ma", "eng": 19, "reactions": 18, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-02-22", "text": "In supporting principals, we try to center the voices and experiences of Black and Latino/a/e leaders who face unique and often intensified challenges. Our role is not to speak over or for them but to listen, learn, and advocate for systemic changes that honor their strengths and respond to their ne", "eng": 7, "reactions": 7, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-02-18", "text": "\\\"If the new board rises to the occasion, CPS could become the national model for large urban districts — improving student outcomes despite financial turmoil and leadership change. If it fails, the hardest hit will be those students who can least afford to see their schools unravel.\\\"  This is a powe", "eng": 13, "reactions": 13, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2025-02-13", "text": "There’s a lot of talk about federal funding in public schools—how it’s used, whether it’s effective, and if it’s necessary. But beyond the headlines and sound bites, I don’t see nearly enough discussion rooted in facts.  Here are three things you should know before weighing in on the future of feder", "eng": 150, "reactions": 142, "comments": 8, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-02-07", "text": "I know the lingering effects of the pandemic and the current political situation make it easy for some to be pessimistic about public education in Chicago. And the work of principals is harder than ever.  However, the NAEP scores from last week offered some bright spots, especially in Chicago.  Chic", "eng": 41, "reactions": 39, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-02-06", "text": "Yesterday, I caught up with Dr. Kendra Washington-Bass. Her leadership has inspired me for nearly two decades, so it was a joy to hear about her new book, Unwrapped, and her entrepreneurial work with The Lucy Leadership Project.   The book is a deeply personal and radically researched love letter to", "eng": 31, "reactions": 26, "comments": 5, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-02-03", "text": "Hyper-local media outlets make a big difference in the community and in good governance. Grateful this morning for the coverage from Block Club Chicago on how to support individuals, businesses, and communities in our city right now. All of the resources in the article are helpful; check out the com", "eng": 28, "reactions": 25, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2025-01-26", "text": "‼️ Attention school leaders and families seeking more information on Chicago's response to recent federal executive orders ‼️ CPS launched a one-stop site here: https://lnkd.in/g2CAepCU. More on upcoming workshops in the comments. Please share with your networks.", "eng": 70, "reactions": 66, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2025-01-23", "text": "During this fiercely cold week, where many school communities are concerned about what comes next, we are choosing to focus on stories of promise and progress.   Our team reached out to five educators participating in our programming this year with a simple question: “Tell us something good that’s h", "eng": 40, "reactions": 40, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-01-19", "text": "Whenever people ask me why I am excited about Chicago's schools, it always comes down to the remarkable leaders in them. Melissa Zaikos and the team at Intrinsic Schools are an important piece of that story. They are hiring a new principal for their downtown campus. Check out the job description bel", "eng": 39, "reactions": 39, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-01-14", "text": "It was a joy to be with our Malott Fellows, our University of Illinois Chicago partners, and the Wise Leadership Consulting team this morning.", "eng": 30, "reactions": 30, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-01-09", "text": "The work of Ingenuity - Chicago and their fearless leader, Nicole Losurdo Upton never fails to inspire me. Read past the headlines, and you'll see that incredible things are happening in Chicago's public schools; the Creative Schools Fund is an important part of that magic in 130 school communities.", "eng": 19, "reactions": 18, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-01-09", "text": "Tune it tonight for an important conversation on the state of public education!", "eng": 0, "reactions": 0, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-01-07", "text": "One resolution I know I’m keeping in 2025? Staying informed about the work of the Chicago Board of Education.  After all, next week marks a historic moment for Chicago’s public schools—the largest governance shift since 1995. Twenty-one members, including ten elected last November, will be sworn in ", "eng": 90, "reactions": 88, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2024-12-19", "text": "As educators across the city wind down the semester, I am grateful.   At The Fund, I spend regular time in schools and witness first-hand the incredible work of our principals and their teacher teams. They show up when tired, invest in school-wide culture and individual relationships, and celebrate ", "eng": 52, "reactions": 50, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2024-12-18", "text": "Love seeing this piece on Joshua Long!", "eng": 15, "reactions": 15, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2024-12-12", "text": "This is such exciting and vital work, led by the Latino Policy Forum and talented educators like Dr. Olimpia Bahena. If you haven't read the report, you should check it out: https://lnkd.in/gZYcPUsx. ", "eng": 13, "reactions": 13, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2024-12-10", "text": "Schools are so much more than individual classrooms. Good principals lead by listening first. They work to understand the diverse needs of their teachers, support staff, community, and — most importantly — students.   They bring those needs together to ensure the sum is GREATER than its parts.   Tha", "eng": 106, "reactions": 101, "comments": 5, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Video"}, {"date": "2024-12-06", "text": "Yesterday, I had the privilege of walking through the halls of McNair Elementary in the Austin neighborhood. Principal Benetrice Whitfield has been leading McNair since July 2017, previously serving as the Assistant Principal. Like many principals, her work extends well beyond the confines of her of", "eng": 43, "reactions": 40, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-11-22", "text": "A few years ago, we launched The Chicago Public Education Fund Alumni Update, a quarterly email designed to keep former team members connected to our mission. In every edition, we share highlights of our work, opportunities to champion school leadership, and stories of the incredible contributions o", "eng": 68, "reactions": 62, "comments": 6, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-11-15", "text": "As a teacher and parent, I’ve found that focusing young people on Stephen Covey’s “circle of control” helps them cope with uncertainty or chaos.   Honestly, I found those circles helpful this week.  For all of us working in education, the purpose remains clear: to ensure that every child in our char", "eng": 51, "reactions": 50, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-11-04", "text": "As we all prepare for a week of election talk and the potential implications on our communities, country, and world, I want to pause and thank Sydney Finley for giving voice to the importance of the many already-elected Local School Council members serving in Chicago's public schools. Their tireless", "eng": 20, "reactions": 18, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2024-10-31", "text": "Nelson Gerew, our longest-serving Fund team member, is among our most respected and admired teammates. 👏   ☑️ He is always the smartest in the room but never makes you feel silly for asking a question.  ☑️ He is often the busiest member of the team but never hesitates to listen and help.  ☑️ He neve", "eng": 194, "reactions": 160, "comments": 34, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-10-28", "text": "“Tell me something GOOD about Chicago Public Schools.” I often hear this on soccer sidelines, at networking events, and in funder meetings. While some people pose it as a challenge, it is a joyful question for me, and I always have an answer.  This week, my answer features the incredible work of Jen", "eng": 74, "reactions": 71, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-10-18", "text": "#PrincipalPrideChi is truly my favorite time of year. In Chicago, the average district principal leads a 73-person team, manages a $8.9m budget, and is responsible for 519 students learning and thriving every day.   They are a FORCE and provide sturdy leadership even (especially) when political nois", "eng": 91, "reactions": 85, "comments": 6, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-10-16", "text": "Working in Chicago has many gifts; not least is the opportunity to live and learn among legends.  👏 From Anna Valencia's Women at the Forefront to Sylvia Puente's Latinos on the Move to Andrea Zopp's Chicago Newsroom 2.0, the last week has been a masterclass in the leadership our city, country, and ", "eng": 53, "reactions": 50, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-10-10", "text": "October 10th is World Mental Health Day, and this year’s theme is Mental Health at Work.   In the modern world, work is more of a state of being than a place. It can happen in an office, at your dining room table, on a phone, or in transit. In that context, a sizable majority of our waking hours are", "eng": 58, "reactions": 50, "comments": 8, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2024-10-07", "text": "Let me break through the political noise around Chicago's public schools to remind you that 634 principals are in their schools right now, welcoming over 323,000 students and 44,000 teachers and staff into another week. Their strong leadership and dedication to establishing a positive learning envir", "eng": 155, "reactions": 151, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-10-04", "text": "#PrincipalPrideChi is my favorite time of year! Chicago’s principals are truly unmatched. This month, we celebrate your unwavering dedication, compassion, and profound impact on our schools and communities. Happy Principal Appreciation Month! Be sure to #ThankAPrincipal ", "eng": 78, "reactions": 78, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Video"}, {"date": "2024-10-02", "text": "Once again, Elizabeth Alvarez, Ph.D. hits it on the head. \\\"Effective principals have a profound, positive impact on the schools they lead.\\\" Yes! Be sure to #ThankaPrincipal this month, and always.", "eng": 9, "reactions": 8, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2024-10-01", "text": "Part of my sabbatical work was adjusting to progressive lenses, and I've noticed people don't recognize me when I wear them. Today marks the start of Principal Appreciation Month, which means I will be out and about to celebrate great leaders citywide (and sporting lots of purple with my new specs!)", "eng": 89, "reactions": 86, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-09-28", "text": "It was a joy to be in the room when Andrea Sáenz accepted the Spirit Award from Instituto del Progreso Latino last night. Andrea’s leadership is authentic, effective, and impactful at the individual, community, and systems levels. She leads with purpose and heart. She gets things done. I have learne", "eng": 53, "reactions": 53, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-09-25", "text": "Big news: The Fund is hiring for a permanent Chief Operating Officer. The job is live now.  Some context: When I was gifted a 10-week sabbatical, we hired K. Sujata as an interim COO to ensure continuity in our operations and support for our team and culture.   It's been a game-changer for us (and f", "eng": 194, "reactions": 176, "comments": 18, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2024-09-23", "text": "Recently, I had the opportunity to visit Dr. Nicholas Kotis at Gray Elementary School with The Fund team.   Dr. Kotis is a remarkable leader. His work is personally energizing and intellectually stimulating. Our team enjoyed talking with him about the history (and the stories) that have inspired his", "eng": 16, "reactions": 14, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-09-19", "text": "This week, our Team and Board had the opportunity to visit with Dr. Christopher Graves, Ed. D., CSBO, Jami Tillis, M.Ed, MA and the team at Jordan Elementary School.  Jordan is a vibrant school on the far north side of the city. The team serves 477 students and their families. 👏It was incredible to ", "eng": 49, "reactions": 47, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-09-11", "text": "Three of my all-time favorite women are collaborating on an event I am sad to miss later tonight.  Sylvia Puente, the CEO of The Latino Policy Forum, and Elizabeth Alvarez, Ph.D., the superintendent of District 91, are meeting in Myetie Hamilton's space at Leadership Greater Chicago to discuss Dr. A", "eng": 42, "reactions": 35, "comments": 7, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-08-30", "text": "#ReturntoWork is a little anxiety-inducing. Do people still need me? Does anyone even remember me? How do I know? Am I going to be too tired by Thursday to think?  A few years ago, we introduced two tools at The Fund to help ease those feelings and to help the team embrace a returning colleague.   T", "eng": 98, "reactions": 84, "comments": 14, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-08-28", "text": "I am returning from my sabbatical just in time for the first week of school! Today, I had the pleasure of visiting Northwest Middle and Gray Elementary, engaging with their principals, and learning about their aspirations for the upcoming year. #BacktoSchool #BacktoWork", "eng": 83, "reactions": 81, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-08-26", "text": "Wishing all my principal, teacher, staff, and caregiver friends a happy first day of school! May it be a safe day, full of learning and laughter, and the start to your best school year yet. You got this!", "eng": 51, "reactions": 51, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2024-08-12", "text": "“Losing isn’t very fun.” – My kid  My kids are not the kind who get excited about participation trophies. They like to win. And they have reached the point in their sports experiences where that isn’t always a given.  The “unfun” feeling of loss is one reason I’ve always struggled with trying to mak", "eng": 50, "reactions": 47, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-06-07", "text": "I started this first sabbatical week at the place where my career was born: Marquette University. Marquette honed my writing skills, deepened my faith, and extended my vision beyond the neighborhoods of my family and youth. It was also where I faced real challenges and learned what it means to grow ", "eng": 101, "reactions": 88, "comments": 13, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-05-31", "text": "As we close out #MentalHealthAwareness Month, I'm excited to embrace a much-needed sabbatical. After 12 years of dedicated work at The Chicago Public Education Fund, I am taking the next 12 weeks to focus on connection, rest, and fun.   More on that in a minute, but first #Gratitude.  My time away i", "eng": 101, "reactions": 90, "comments": 11, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-05-30", "text": "One of The Fund’s values is solutions-orientation. Nothing inspires that more than the leaders we serve. At the end of the school year and after a long day, this group gathered to close out our year in community. They surfaced AND offered solutions for staffing challenges, with their own needs and t", "eng": 34, "reactions": 34, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-05-24", "text": "Congratulations to Deputy Chief of Schools —Network 13 José Torres of Chicago Public Schools and the second cohort of the MCEL (Men of Color in Educational Leadership) National Leadership Institute fellowship. I am excited to watch your leadership development!", "eng": 30, "reactions": 28, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-05-23", "text": "Speaking of innovation and creativity in school leadership, our team The Chicago Public Education Fund sponsored a Design Challenge earlier this month. Participating teams started with the needs of their students and communities. They surfaced a clearer perspective around what might work in conversa", "eng": 11, "reactions": 11, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2024-05-21", "text": "Experienced leaders can sometimes get complacent — they stick with what works. Not so in schools — students and communities demand and deserve our best, which takes innovation. Today, I spent time with some of Chicago’s most seasoned and successful #principals. I listened and learned from how they w", "eng": 74, "reactions": 69, "comments": 5, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-05-17", "text": "Thank you, Anajah Philogene (Roberts) and Teach For America Greater Chicago-Northwest Indiana, for a wonderful evening celebrating with friends and colleagues. Congratulations to longtime Fund partner Barton Dassinger, who received the Zell Family Alumni of the Year Award for outstanding school lead", "eng": 68, "reactions": 63, "comments": 5, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-05-10", "text": "I continue to be excited and impressed with the work Academy for Local Leadership and Bridget Lee are doing to lead and learn about the role of an elected school board. Chicago is undergoing a big shift, and preparation will be critical for the change process. Also great to see The Chicago Public Ed", "eng": 26, "reactions": 26, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2024-04-30", "text": "This month, I celebrated 12 years of leading and learning at The Chicago Public Education Fund. I spent time reflecting on the milestones, highlights, and challenges I’ve experienced during my tenure. Among them…  1️⃣2️⃣ Programs launched. From the Summer Design Program, which started with 13 princi", "eng": 302, "reactions": 253, "comments": 49, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-04-25", "text": "Our team had the pleasure of hosting 26 eager learners from Lee Elementary School this morning. Fund team members led a panel during the visit to discuss their professional experiences. Principal Lisa Epstein, a current Masterclass leader at The Chicago Public Education Fund, wants to bring workforc", "eng": 47, "reactions": 45, "comments": 2, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-04-25", "text": "Very excited to see the Design Challenge leaders and their teams in action. They listened and heard their students and communities. They used their learning to co-design projects that meet needs, inspire joy, and create possibility. You can learn more about The Chicago Public Education Fund and our ", "eng": 8, "reactions": 7, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2024-04-16", "text": "At the 2024 ASU+GSV Summit, learning from innovative and courageous women at every turn. What a gift to be still, listen, and grow. As I celebrate 12 years into this role, I am grateful for those gifts and the educators I learn alongside (and from) daily. #ASUGSVSummit #ContinuousLearning", "eng": 79, "reactions": 72, "comments": 7, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-04-09", "text": "From April 1-5, we celebrated Assistant Principal (AP) Appreciation Week at The Chicago Public Education Fund. Throughout the week, I reflected on the importance of principals supporting their APs. That part of #leadership - coaching and mentoring - must be discussed more.   It takes work to do well", "eng": 34, "reactions": 31, "comments": 3, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2024-04-03", "text": "Every member of The Fund team serves as a PLC buddy, supporting the leaders of our Professional Learning Communities in their work. I love this aspect of my job because I ALWAYS learn something new and leave sessions inspired to improve. This year, I've been honored to support John Fitzpatrick and M", "eng": 35, "reactions": 35, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-03-28", "text": "As we close out #WomensHistoryMonth, I am proud to share the podcast I did with Charles Anderson earlier this month.  Our conversation builds on my post from last week and gave me an opportunity to shout out some other really inspirational women who have helped me along in this journey – Denise Litt", "eng": 49, "reactions": 48, "comments": 1, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}, {"date": "2024-03-25", "text": "My network for sure includes the next Director of Operations for Nicole Milberg's team at CPS. This role is responsible for policy and operations, procurement, data handling, and strategic planning. Want to learn more? Feel free to message me!  https://bit.ly/3TA0NZe ", "eng": 23, "reactions": 23, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2024-03-22", "text": "Nearly two decades (!) ago, I was emerging from a tough professional year. I took on a big project, and it *almost* went well. Then, it went *spectacularly* wrong. The follow-up meant a series of all-nighters (for real), an enormous fight with my then-boyfriend (now-husband…phew!), and what felt lik", "eng": 283, "reactions": 240, "comments": 43, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-03-20", "text": "One of the reasons I love my day job is that I often find myself listening to and learning from so many of Chicago's best leaders - our principals. The Malott Fellowship is The Chicago Public Education Fund's newest pilot, designed to support and elevate the work of our Priority School Leaders cityw", "eng": 101, "reactions": 97, "comments": 4, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-02-20", "text": "Ready to take our Design Challenge? RSVP now for tomorrow night's webinar to learn more: https://lnkd.in/gtHaMCuZ ", "eng": 4, "reactions": 4, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Link"}, {"date": "2024-01-24", "text": "This was the highlight of my week. For years, I had had the honor of learning from the leadership of Aimée Eubanks Davis and Anajah Philogene (Roberts). It was deeply meaningful to learn out loud with them, alongside Al Bertani and Penny Sebring. People drive progress; our continued commitment to le", "eng": 29, "reactions": 29, "comments": 0, "shares": 0, "impressions": 0, "type": "Post", "contentType": "Text"}];
const X_FEED     = [{"date": "2026-06-04", "text": "📸 Two pictures tell the story. First: my kid's first day of kindergarten, my sister and dad were there. I had to work. Second: my three kids at the nature center, where quality care gave them — and us — a lifeline during those intense early years. https://t.co/Vfx1x5253u", "eng": 7, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Photo"}, {"date": "2026-06-04", "text": "Diana built a lasting legacy. Now Celena steps in with momentum, urgency, and unmistakable purpose. I left grateful, and ready for the work ahead. #EarlyChildhood #EarlyLearning #Chicago", "eng": 4, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2026-06-04", "text": "1 in 3 children enters kindergarten behind. That's not a failure of families, it's a failure of systems. Quality early care is hard to find, hard to afford, and too often treated as optional. It isn't.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2026-06-04", "text": "Yesterday at the #StartEarlyLuncheon, Dr. Diana Rauner passed the baton to Celena Sarillo. The program was grounded in facts, centered on families, and full of hope. Here's what stayed with me. 🧵", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2026-06-04", "text": "For our family, high-quality care through our local park district and YMCA was life-changing. But too many families across our city and in rural communities never get that access. That has to change.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-12-29", "text": "❓Why this matters: CPS faces a projected $500M+ operating deficit in FY27. $41M isn’t a solution—but it’s ~8% of the gap, equivalent to ~360 teaching positions. Decisions like this signal how CPS plans to address much larger fiscal challenges ahead.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-12-29", "text": "You can watch the meeting live on CPS' YouTube channel this morning at 10:30am!   https://t.co/6C7Z0SGGRp", "eng": 4, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2025-12-29", "text": "If pursued, the $41M roughly breaks down as: • $24M for CPS’s general education levy • $11M for the teachers’ pension levy • $6M for sped transportation  ❓The Board’s choices: 1️⃣ Leave the levy as-is 2️⃣ Approve some/all of the $41M (FY26 levy must be finalized by 12/29)", "eng": 4, "likes": 0, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-12-29", "text": "❓Why is $41M “available” now? Earlier this year, CPS set its property tax levy below the maximum allowed under state law. Because final property values came in higher than expected, CPS now has the legal option—though not the obligation—to levy up to $41M more.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-12-29", "text": "Today, the Chicago Board of Education is holding a special meeting to consider whether to pursue up to $41M in additional property tax revenue.   A few basics below:", "eng": 8, "likes": 0, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-12-23", "text": "At Cesar E. Chávez Elementary, the team raised attendance to 96% by focusing on daily practice and real-time data—while navigating the real impacts of immigration fears on student attendance with care and urgency.", "eng": 2, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-12-23", "text": "Principal Barton Dassinger's Chicago Tribune op-ed shows what’s possible when school leaders are trusted with the flexibility to innovate alongside students and families. https://t.co/ZMccIsBTFc", "eng": 9, "likes": 1, "comments": 1, "shares": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-12-23", "text": "As an Independent School Principal, Barton shows how autonomy enables schools to respond to community realities—proving that challenges like chronic absenteeism require trust, relationships, and equity-driven leadership.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-12-23", "text": "Congratulations to Barton and the Chávez community for modeling what’s possible for schools across Chicago.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-12-23", "text": "nan", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "Quote", "contentType": "Link"}, {"date": "2025-12-23", "text": "Congratulations to Barton and the Chávez community for modeling what’s possible for schools across Chicago.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-12-23", "text": "At Cesar E. Chávez Elementary, the team raised attendance to 96% by focusing on daily practice and real-time data—while navigating the real impacts of immigration fears on student attendance with care and urgency.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-12-23", "text": "As an Independent School Principal, Barton shows how autonomy enables schools to respond to community realities—proving that challenges like chronic absenteeism require trust, relationships, and equity-driven leadership.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-12-23", "text": "Principal @BartonDassinger’s Chicago Tribune op-ed shows what’s possible when school leaders are trusted with the flexibility to innovate alongside students and families. https://t.co/KyAKv1dure", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-12-19", "text": "Educator friends: I see you! In those parking lots EARLY. Wrapping up those grades. Checking in on young people for whom the break feels heavy. Thank you for all you're doing. You got this! https://t.co/d4n5AWWJYQ", "eng": 4, "likes": 2, "comments": 0, "shares": 0, "type": "Post", "contentType": "Video"}, {"date": "2025-12-12", "text": "https://t.co/AOM5BPhZzb https://t.co/6bM1vFp3oj", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Photo"}, {"date": "2025-12-12", "text": "Nothing matters more to the public value of education than literacy. Learning to read—and then reading to learn—fuels the critical thinking adults need at work, at home, and in civic life. As AI accelerates, this work is more urgent than ever.", "eng": 2, "likes": 1, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-12-12", "text": "A new piece in The 74 highlights schools advancing literacy at a faster rate than expected. Out of the 2,158 schools nationwide, Chicago has 22 on the list.  One example: Goudy Tech Academy   Expected reading proficiency: 16%   Actual: 39%—and rising Focused leadership matters.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-12-05", "text": "But disparities remain, and prioritizing Black student success is essential to building a more equitable city. The BSAC will advise on CPS’ Black Student Success Plan and ensure accountability to outcomes that reflect our values.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-12-05", "text": "Applications for the CBOE's new Black Student Achievement Committee are now open. This is a chance for Chicagoans to help shape policies that put Black students at the center of our city’s future. The Fund recognizes that real change happens when communities drive decision-making", "eng": 5, "likes": 2, "comments": 1, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-12-05", "text": "And we know what’s possible: Black students in CPS have driven some of the strongest gains in the country, outpacing national growth in reading and math. And grad rates, college enrollment, and persistence continue to rise.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-12-05", "text": "If you care about racial justice, community voice, and great public schools, apply. Your leadership and lived experience matter.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-12-05", "text": "🗓️ Apps due Dec. 22, 5pm 🔗 BSAC application: https://t.co/Uy4JuZtqoY https://t.co/XRUnbErdSn", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Photo"}, {"date": "2025-10-28", "text": "They both focused on keeping student outcomes at the center, maintaining high expectations, and using data to drive results. As we begin reviewing 2024–25 data, those reminders couldn’t be more timely.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-28", "text": "Grateful to celebrate with so many dedicated educators, colleagues, and partners—especially Jessica Biggs, Therese Boyle, Carlos Rivas, and Ellen Rosenfeld from the Chicago Board of Education.  #GoldenAppleAwards #Leadership #ThankATeacher #PublicEducation #PrincipalPrideChi https://t.co/c2ZMhXPq30", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Photo"}, {"date": "2025-10-28", "text": "✨ What an inspiring evening celebrating 40 years of the Golden Apple Foundation’s impact!  This year’s Impact Award honored Ambassador @RahmEmanuel, with powerful reflections from him and @janicejackson.", "eng": 4, "likes": 2, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-10-17", "text": "We celebrated all 8 Growth Leader Award finalists &amp; honored 2 who exemplify vision &amp; equity in action: 🏆 Barton Dassinger, Chavez Elementary  🏆 Brian Kelly, King College Prep  Congratulations—and thank you for transforming lives across Chicago every day. 💜 #PrincipalPrideChi https://t.co/uZ9", "eng": 2, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Photo"}, {"date": "2025-10-17", "text": "I’m deeply grateful to our incredible Fund team for creating such a meaningful evening, to our partners and funders for their unwavering support, and to our principals for courageously sharing stories of data, growth, resilience, and innovation. 🌟", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-17", "text": "📸 The room was filled with so many partners, leaders, and friends—we couldn’t possibly tag you all! We’re sharing a few photos below 👇 If you were there, drop a note (and a photo or two!) in the comments. We’d love to see your perspective from this special night. 💜", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-17", "text": "✨ What an evening! ✨ Last night, we gathered for The Fund’s 10th Annual Principal Storytelling event—during our 25th anniversary year! 🎉 This tradition is one of my favorites as it reminds us that great principals transform schools, and great schools transform lives. 💪 #P", "eng": 4, "likes": 1, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-10-16", "text": "💜 Thrilled to share our last Growth Leader Award Finalist: Principal Jennifer Sutton of Von Steuben High School! 💜  A proud CPS alum, she has spent nearly 8 years championing inclusive decision-making and breaking down barriers for staff, students, and families.", "eng": 4, "likes": 0, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-10-16", "text": "When data showed that historically marginalized students were underrepresented in advanced coursework, Principal Sutton built a plan.  Today, Von Steuben celebrates record numbers of students earning Early College Credentials through Dual Credit &amp; AP courses.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-16", "text": "The results speak volumes: 🎓 Freshman Success soared 3.4% → 92.4% 📘 AP pass rate grew 46% → 55% 🌍 ESL-certified teachers expanded 9 → 24 in 2 years 👏 Principal Sutton proves what’s possible when equity drives every decision. Join us in celebrating her impact! 👏 https://t.co/lF7T4taVY8", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Photo"}, {"date": "2025-10-16", "text": "She also put relationships at the center of school culture: 🤝 Staff affinity groups to build trust &amp; equity 📊 Student success plans + empathy interviews 🎓 Reimagined grade-level meetings to ensure belonging &amp; support", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-16", "text": "The results speak volumes: 🎓 Freshman Success soared 3.4% → 92.4% 📘 AP pass rate grew 46% → 55% 🌍 ESL-certified teachers expanded 9 → 24 in 2 years 👏 Principal Sutton proves what’s possible when equity drives every decision. Join us in celebrating her impact! 👏", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-16", "text": "She also put relationships at the center of school culture: 🤝 Staff affinity groups to build trust &amp; equity 📊 Student success plans + empathy interviews 🎓 Reimagined grade-level meetings to ensure belonging &amp; support", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-16", "text": "When data showed that historically marginalized students were underrepresented in advanced coursework, Principal Sutton built a plan.  Today, Von Steuben celebrates record numbers of students earning Early College Credentials through Dual Credit &amp; AP courses.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-16", "text": "💜 Thrilled to share our final Growth Leader Award Finalist: Principal Jennifer Sutton of Von Steuben High School! 💜  A proud CPS alum, she has spent nearly 8 years championing inclusive decision-making and breaking down barriers for staff, students, and families.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-10-15", "text": "How he did it: ✅ Built a distributed leadership model empowering APs, coaches &amp; teacher leaders ✅ Launched a comprehensive literacy initiative with PD, peer observations &amp; tools like Beasley’s “literacy planning placemat” Collaboration + coaching = stronger instruction.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-15", "text": "The results are remarkable: 📖 Students reading at/above grade level jumped 32% 📉 Suspensions dropped 2 years in a row 🎓 Chronic absenteeism down nearly 10 pts  👏 Join us in celebrating Principal Rader’s impact at Beasley—where investing in teachers fuels student success! 👏 https://t.co/jseh7E9TEj", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Photo"}, {"date": "2025-10-15", "text": "💜 Our next Growth Leader Award Finalist is Principal Donnell Rader of Beasley Elementary! 💜  For 7 years, he’s led with two bold priorities: 📖 Driving 70% literacy growth schoolwide 👩‍🏫 Building a lasting culture of teacher leadership &amp; professional growth", "eng": 2, "likes": 1, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-10-15", "text": "To help students recover from the pandemic, he doubled down on two priorities:  ✅ Attendance – real-time data, home visits &amp; celebrations  ✅ Student growth – high-quality curriculum, smaller classes, and more teacher coaching.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-15", "text": "💜 Our next Growth Leader Award Finalist is Principal Barton Dassinger of Chávez Elementary School! 💜  For over a decade, he’s led Chávez with a clear vision: strong attendance, academic growth, and student engagement open doors for every child.", "eng": 4, "likes": 0, "comments": 1, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-10-15", "text": "The results:  📈Attendance: 90.3% → 96%  📉 Chronic absenteeism: 37% → 6.3%  📘 Math: 84% → 91.6% | Reading: 71.5% → 85.7%", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-15", "text": "Chávez now leads all non-selective CPS schools in 7th graders passing the Algebra Exit Exam &amp; student participation in summer learning is at record highs.  👏 Principal Dassinger’s commitment to equity &amp; innovation has transformed Chávez into a citywide model. #GrowthLeaderAward https://t.co/", "eng": 1, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Photo"}, {"date": "2025-10-14", "text": "His leadership in action: 📚 Redesigned the master schedule so ALL students—including diverse learners &amp; English language learners—take rigorous, grade-level coursework. 🌱 Revitalized culture with SEL homerooms, restorative practices, Tier II supports &amp; student-led assemblies.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-14", "text": "💜 Our next Growth Leader Award Finalist is Principal Brian Kelly, Ed.D of King College Prep! 💜  Since 2019, he’s worked to raise graduation rates, boost attendance, strengthen GPAs, and retain great teachers—always with a focus on equity and access for every student.", "eng": 6, "likes": 3, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-10-14", "text": "The results speak for themselves: 🎓 22%+ of students graduate with 15+ college credits 💰 Scholarships grew from $1.9M → $33M 📈 9th &amp; 10th graders saw a 20% jump in ELA &amp; Math 👏 Join us in celebrating Principal Kelly’s transformative leadership &amp; commitment to students! 💜 https://t.co/Q1B", "eng": 4, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Photo"}, {"date": "2025-10-14", "text": "Her leadership has led to big changes: 👩‍🎓 92% of students w/ disabilities in gen ed 📈 Above-typical IAR growth in reading &amp; math for IEP students 📉 Absenteeism dropped 16% → 11% ⭐ Strong/Very Strong across all 5Essentials (SY23–24 &amp; SY24–25)", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-14", "text": "Principal Duffy is a steadfast advocate for diverse learners—turning data into action, equity into opportunity, and vision into lasting impact. 👏  Chicago’s schools shine because of leaders like her! 💜 https://t.co/F4IExtNC8y", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Photo"}, {"date": "2025-10-14", "text": "💜 Our next Growth Leader Award Finalist: Principal Meghan Duffy of Audubon Elementary! 💜  For 9 years, she’s championed equity &amp; inclusion—strengthening co-teaching, building collaboration, and ensuring every student has the support they need to thrive. #CPSLeadership", "eng": 2, "likes": 1, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-10-13", "text": "Results you can feel: 📚 ELA classrooms meeting goals 27%→75% (’24–’25); Math 75%→82% 🧮 IAR proficiency R 17→37.8 | M 11.9→24.1 | Sci 43→50.5 (’22–’24) 🏅 State Exemplary; 5Essentials Neutral→Strong; Attendance 92.2% 👏 Join us in celebrating Principal Nieves!", "eng": 2, "likes": 2, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-13", "text": "💜 Spotlighting #GrowthLeaderAward finalist Principal Yalil Nieves (Mary Gage Peterson ES). 8+ years leading with empathy, integrity &amp; data—aligning every move to Peterson’s mission and student voice. #PrincipalPrideChi #ThankAPrincipal", "eng": 12, "likes": 3, "comments": 1, "shares": 2, "type": "Post", "contentType": "Text"}, {"date": "2025-10-13", "text": "When data showed inequities, her team acted: ✅ 5-week data cycles for targeted instruction &amp; real-time adjustments ✅ Student Voice Committees + a student-led Attendance Team ✅ Restorative practices, weekly circles, dedicated SEL blocks", "eng": 3, "likes": 2, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-13", "text": "The results: 📈 Dual-credit grads 41%→61% 📈 AP exams 270→331 (’21–’25) 📈 AP pass rate 29%→60% Students report higher confidence, stronger GPAs &amp; attendance. 👏", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-13", "text": "💜 Proud to highlight #GrowthLeaderAward finalist Principal William Hook (Chicago Ag HS)—leading with vision, compassion, and innovation. #PrincipalPrideChi", "eng": 3, "likes": 0, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-10-13", "text": "When data showed gaps in AP &amp; Dual Credit access, his team moved fast: ✅ AP boot camps ✅ Vertical curriculum alignment ✅ Family outreach + college partners ✅ Teacher credentialing to expand access", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-11", "text": "📚 ES Finalists: Megan Duffy (Audubon) • Donnell Rader (Beasley) • Barton Dassinger (Chavez) • Yalil Nieves (Peterson) 🏆 Winners announced Oct 16; finalist spotlights all week!", "eng": 1, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-11", "text": "💜 The 2025 #GrowthLeaderAward honors two Chicago principals (one ES, one HS) for postpandemic gains in achievement &amp; attendance—and for building strong, shared leadership. #PrincipalPrideChi #ThankAPrincipal", "eng": 19, "likes": 2, "comments": 1, "shares": 2, "type": "Post", "contentType": "Text"}, {"date": "2025-10-11", "text": "🎓 HS Finalists: William Hook (Chicago Ag) • Brian Kelly (King College Prep) • Paul J. Karafiol (Lake View) • Jennifer Sutton (Von Steuben)", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-03", "text": "The @TheFundChicago team was joined by some of our own special guests, including @ChiPubSchools board members Carlos Rivas, Jessica Biggs, and @MichillaB, and Fund board members Auyana Orr and Lauren Patnaude.", "eng": 11, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-03", "text": "👏 We remain grateful for the work of Advance Illinois and their continued attention to data access and transparency as they focus on building strong pathways for every learner in Chicago and across the state.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-03", "text": "At the event, a panel facilitated by @DrJulieMorita and featuring the Honorable @LLCoolK_4, Linda Xóchitl Tortolero, and @StevenIsoye discussed what work is needed for Illinois to be one of the best places to raise children, attend school, and pursue college.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-03", "text": "📊The state continues to experience challenges in academic growth and proficiency from 3rd to 8th grade, as only one-third of students meet national benchmarks in reading and math by 4th, 8th, and 11th grades—a number that has been declining since 2015.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-03", "text": "💰Illinois now ranks 18th nationally in state education per student (it was 47th in 2008). While educational funding is up, spending for specific priority areas is still inadequate. We rank 26th in state-funded preschool and 46th in university and community college funding.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-03", "text": "Overall, Illinois students are now getting less than one year of learning for a year of school over the five years between 3rd and 8th grade.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-03", "text": "🏫CPS principals are outpacing the rest of the state on 5Essentials performance reflected in strong or strongest implementation of Effective Leaders, with roughly 25% of schools in CPS reaching this mark compared to 22% across the state.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-03", "text": "↔️There have been some gains in specific academic areas, but the overall achievement gap in Illinois has widened over the past 5 years for students from low-income households, students of color, English learners, and students with disabilities.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-03", "text": "While this annual report continues to reinforce the importance of collecting, analyzing, and transparently sharing data as a means to align resources and set effective strategies that drive student growth and success, this year, a few things jumped out for me:", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-03", "text": "This week, @AdvanceIllinois released its 2025 The State We’re In report at City Club of Chicago. The report takes a holistic look at Illinois’ education system, from birth to postsecondary, tracking funding, staffing, and student achievement to highlight progress and challenges. https://t.co/LHOYvXq", "eng": 4, "likes": 0, "comments": 1, "shares": 1, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-01", "text": "✨ Stay tuned all month as we highlight amazing leaders through case studies, school visits, and our signature event: The Principal Storytelling Evening at the Griffin Museum of Science and Industry on Thursday, October 16th!", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-01", "text": "If you know me, you know that #PrincipalPrideChi is my favorite time of year. 💜 https://t.co/CqA0Xd8uoM", "eng": 21, "likes": 1, "comments": 1, "shares": 2, "type": "Post", "contentType": "Photo"}, {"date": "2025-10-01", "text": "In today’s climate, public education faces real challenges. But throughout October, we’ll be highlighting several principals across the district who have strategically utilized data to meet student needs and to drive academic growth.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-01", "text": "Every October, our team at @TheFundChicago doubles down on celebrating Chicago’s incredible school leaders. Their energy, intentionality, and relentless investment in students are the secret ingredient for so much of what is right in our schools.", "eng": 4, "likes": 1, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-01", "text": "Drop a shoutout below ⬇️ to kick off the month and thank your favorite principal! #PrincipalPrideChi", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-10-01", "text": "Principals in Chicago show every day that they have the innovation, toughness, and heart it takes to lead schools and help students thrive. We’re grateful to support them as they provide the care and knowledge our young people need for success.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-29", "text": "➡️ Read more in my latest piece: Chicago’s Students Prove What’s Possible. Adults Must Keep Up.  https://t.co/cM2BxvDjxP", "eng": 4, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2025-09-29", "text": "The fact is, our students continue to hold up their end of the bargain by showing up with energy and effort. In response, they aren’t asking for reinvention, but for consistent opportunity and access to the excellence they deserve. It’s time for the rest of us to deliver.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-29", "text": "Crucially, it was driven by honest analysis of stdnt data, which guided principals to deliver targeted support and accelerate learning where it was needed most. If we want to accelerate improvements in stdnt outcomes, we must trust &amp; empower local leaders to do what they do best.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-29", "text": "Over the past 30 years, CPS has come so far. That wasn’t an accident. It was the result of decades of work by principals, teachers, scholars, and families.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-29", "text": "From Farragut grads heading to Cornell, to Chávez seventh graders completing Algebra I, our young people are delivering results at scale. They deserve leaders who match their resolve with transparency, focus, and investments in strategies that drive their growth.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-29", "text": "✨ Chicago’s students are proving what’s possible in public education. The question is: can adults keep up?", "eng": 3, "likes": 0, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-09-26", "text": "Amid a week packed with too many meetings and long hours, it was refreshing to pause and return to the why.  It was so fun to join Barry Tyler at Graham ES’s Fall Fest—a joyful reminder of what matters most: students, families, and the dedicated leaders who show up for them daily https://t.co/ZhPXAN", "eng": 9, "likes": 1, "comments": 1, "shares": 1, "type": "Post", "contentType": "Photo"}, {"date": "2025-09-26", "text": "Principal Aguilar is building something special at Graham. From parent involvement to teacher collaboration, instructional quality to student engagement, the growth is clear—and the energy, community, and care were on full display.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-26", "text": "In deep collaboration with her staff and school community, Principal Aguilar—first-year Malott Fellow and valued member of our Educator Advisory Committee—launched this tradition to celebrate the return to school, offer families outdoor fun, and strengthen community connections.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-26", "text": "Now in its fourth year, the Fall Fest has grown into a vibrant celebration with food and music, carnival games, an interactive bubble show, a petting zoo, a vendor and resource fair, and of course—a pumpkin giveaway! 🎃", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-26", "text": "Grateful for the chance to celebrate Alexander Graham Elementary and continue supporting leaders doing the work that matters most.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-23", "text": "Whatever the CPS results show, two things are certain:  1️⃣ We’ll break down what the data means for students, schools &amp; our city.  2️⃣ Strong principals will lead the response.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-23", "text": "Students at the top held steady. But those already behind lost the most ground. The national picture is clear: achievement gaps are widening.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-23", "text": "One limitation: these results don’t include state or district breakouts. But we’ll soon get fresh @ChiPubSchools data — and Chicago students have often outpaced national trends. Example: 8th-grade NAEP reading scores are climbing again, led by Black &amp; Latino/a/x students.", "eng": 4, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-23", "text": "A complicating factor: CPS enrollment is down by 12,000 students this year. That adds urgency to the question — not just how many students we serve, but how well they are learning.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-23", "text": "📊 September &amp; October always bring a flood of insight into how our schools are doing. From graduation rates to enrollment, the data tells a story — one we’re committed to unpacking with you. #EduData", "eng": 2, "likes": 0, "comments": 1, "shares": 0, "type": "Post", "contentType": "Text"}, {"date": "2025-09-23", "text": "Last week, the first post-pandemic Nation’s Report Card results for 12th graders came out. The findings were sobering:  • Math: ↓3 pts since 2019 (↓6 since 2013)  • Reading: ↓3 pts since 2019 (↓4 since 2015)", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-18", "text": "Started our morning at Finkl Elementary with Principal Nancy Quintana. Her vision for joyful, equitable learning shines in every corner - from classrooms to community.  Principals change lives. Their leadership is our best investment. #PrincipalPrideChi https://t.co/xYEbx2Hbzw", "eng": 47, "likes": 7, "comments": 1, "shares": 2, "type": "Post", "contentType": "Photo"}, {"date": "2025-09-17", "text": "The cohort includes 26 educators from schools across the city; each of them is preparing to take on a principal role within the next three years.  Through coaching, collaboration, and intentional development, they will gain the tools to serve Chicago’s students with excellence.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-17", "text": "Grateful to our partners @NewLeadersOrg  and @thisisUIC  — and to these dedicated educators for leading in new ways. The future of our schools is brighter because of you.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-17", "text": "🌟 26 aspiring leaders. 1 year of growth. A lifetime of impact. 🌟  Last night, I joined @TheFundChicago's E.J. Dubinsky to welcome the 2025–26 Leadership Bridge cohort. https://t.co/wyPRkvaqUm", "eng": 38, "likes": 5, "comments": 1, "shares": 2, "type": "Post", "contentType": "Photo"}, {"date": "2025-09-16", "text": "Working here isn’t easy. The hours are long, the challenges are complex, and the answers are rarely obvious. But we know that real learning happens in the hard work — both for school leaders and for us.", "eng": 2, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-16", "text": "Her excellence is fueled by her own experiences with the deep inequities of our education system, grounding her passion for equity and her belief that every student is worth the investment.", "eng": 2, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-16", "text": "At @TheFundChicago, we believe excellent leadership transforms schools — and we know it transforms organizations, too.", "eng": 5, "likes": 0, "comments": 1, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-09-16", "text": "📣That’s why I’m proud to share that two of our colleagues, Cheyane Bligen and Patricia Mota, are living our commitment to leadership growth through their participation in the @Surge_Institute and the Academy for Local Leadership Chicago this year. https://t.co/qHnBYMQLvu", "eng": 4, "likes": 2, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Photo"}, {"date": "2025-09-16", "text": "💡Cheyane, our Senior Associate of Public Affairs, drives connections inside and outside of The Fund — shaping communications strategies and bringing leadership in Chicago’s public schools to life.", "eng": 3, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-16", "text": "💡Patricia, our Senior Manager of Network Expansion and Engagement, leads initiatives that strengthen the work between principals and key partners in the work, including Local School Councils and Network Chiefs.", "eng": 2, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-16", "text": "A proud @ChiPubSchools alumna and parent, Patricia grew up in Pilsen and brings both personal experience and deep commitment to her work.", "eng": 4, "likes": 2, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-16", "text": "Both Patricia &amp; Cheyane lead aspects of our annual #PrincipalPrideChi campaign &amp; work to elevate educator voices through our reports. Both also embody what it means to lead with conviction, creativity, and care, exactly the qualities we want to see in every school across Chicago", "eng": 3, "likes": 2, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-16", "text": "I’m constantly inspired by the thoughtfulness and drive of our team. Patricia and Cheyane remind us daily what it looks like to lead with a commitment to creating a critical mass of great public schools in our city.", "eng": 3, "likes": 2, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-11", "text": "Learning happens in schools because leaders help create the conditions that foster student success every day. Our team believes in the power of their leadership. Barry's words clearly communicate our gratitude for their service and collaboration.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-11", "text": "I was excited to start my day yesterday by listening to @BTfor3Hammond testify to the Chicago Board of Education about the work of @TheFundChicago. https://t.co/1wUCrCrU5M", "eng": 21, "likes": 5, "comments": 1, "shares": 3, "type": "Post", "contentType": "Video"}, {"date": "2025-09-09", "text": "At @TheFundChicago, we see that same influence every day. Principals across Chicago are setting the bar high and pouring into their students, shaping the next generation of city, national, and global leaders.", "eng": 2, "likes": 0, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-09", "text": "I’m grateful for the educators who invest in young people’s potential — and for the inspiration that stories like Mellody’s provide to start the day with purpose.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-09", "text": "Started my morning with Mellody Hobson at UChicago, listening to her reflect on a principal who shaped her life. That school leader set high expectations and invested time in her growth — leaving a lasting imprint on her view of excellence. https://t.co/xub22HH3QZ", "eng": 13, "likes": 1, "comments": 1, "shares": 0, "type": "Post", "contentType": "Photo"}, {"date": "2025-09-03", "text": "The approved FY26 budget permanently eliminated $214M in central office services and through operational efficiencies.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-03", "text": "Last Friday, the Chicago Board of Education (CBOE) approved the FY2026 budget—totaling $10.25B. As required by state law, the budget’s assumed revenues match its projected costs. Including: $1.1B in debt service $556M in capital spending $8.6B in operating expenditures", "eng": 14, "likes": 0, "comments": 1, "shares": 1, "type": "Post", "contentType": "Text"}, {"date": "2025-09-03", "text": "When she began her tenure in June of 2025, Dr. Macquline King projected the district’s structural deficit was $734M, inclusive of the district reimbursing the City of Chicago $175M for a portion of the MEABF pension payment.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-03", "text": "The $8.6B operating budget is a 1% increase over FY2025, and required difficult but necessary cuts as federal COVID-19 funding phased out.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-03", "text": "While the MEABF reimbursement is likely to remain a topic of discussion, there is general consensus that it should not be included as a budgeted obligation, without corresponding revenue. This removes $175M from the structural deficit assumptions.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-03", "text": "Thanks to the leadership of Dr. King, input from five community feedback sessions, and the decisions reflected in the new budget, those projections have been dramatically reduced—by nearly 40%. Two big shifts:", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-03", "text": "Future cuts will be harder to find, and true long-term stability will require partnership among CPS leadership, the CBOE, the city of Chicago, and the state of Illinois—to pursue both new revenue sources and efficiencies, while avoiding further borrowing.", "eng": 3, "likes": 1, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-03", "text": "This means real decreases in deficit projections for future years:   FY2027: $520M (↓47%) FY2028: $582M (↓44%) FY2029: $835M (↓37%)  Of course, with a $500M+ gap still forecast for FY27, the road ahead won’t be easy.", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-09-03", "text": "The FY26 budget is complete. Next up: FY2027. I’ll share updates in the weeks and months ahead as that process begins.", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-29", "text": "Twelve CBOE members voted in favor of the budget, seven voted against it, and one abstained. During her comments, Dr. King acknowledged that the budget required tough choices and emphasized the need for more sustainable planning and predictability in the future.", "eng": 2, "likes": 0, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-29", "text": "With the structural deficit hovering at $500M, the FY27 conversation will begin very soon. I’ll have more on that next week.", "eng": 2, "likes": 1, "comments": 0, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-29", "text": "✅ No MEABF payment, unless new revenue is secured. Reimbursement to the city is contingent on additional revenue, over what was budgeted. The city is legally obligated to make the full payment.", "eng": 2, "likes": 0, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2025-08-29", "text": "✅ No borrowing. The budget does not include new debt for operational costs. Dr. King and the team made it clear that the board could approv

1vg9ASUfn", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2024-09-23", "text": "Our conversation also brought me back to my sabbatical promise to read voraciously and share some of my favorites. Inspired by Dr. Kotis’ love of history (and all things Greek), here are four books I loved this summer from VERY different genres and authors:", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-09-23", "text": "Recently, I visited Dr. Nicholas Kotis at @StallionNews  Elementary with The Fund team. We were inspired by his leadership and discussed the inspirations for his work, including how an Epcot image motivates his communication with his team and families. https://t.co/ow2ID4tJii", "eng": 4, "likes": 0, "comments": 1, "shares": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-09-23", "text": "This book offers a new look at one of our country’s most significant leaders. https://t.co/KkscAKJV8o", "eng": 1, "likes": 0, "comments": 1, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2024-09-23", "text": "There are many historical fiction books set in the World War II era. I appreciated Mitch Albom's take on the impact of the war on Greece. https://t.co/kkMIc5oMru", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2024-08-30", "text": "This week, I benefited from a gentle re-entry with meaningful meetings and small comforts like a welcome note and donuts. Huge thanks to everyone for the warm welcome back! #ReturnToWork #MyTeamIsTheBestTeam #PrincipalPrideChi https://t.co/nJjXokcJLS", "eng": 50, "likes": 9, "comments": 1, "shares": 1, "type": "Post", "contentType": "Photo"}, {"date": "2024-08-28", "text": "I am returning from my sabbatical just in time for the first week of school! Today, I had the pleasure of visiting Northwest Middle and Gray Elementary, engaging with their principals, and learning about their aspirations for the upcoming year. #BacktoSchool @TheFundChicago https://t.co/LXHYPyqlHw", "eng": 13, "likes": 1, "comments": 0, "shares": 1, "type": "Post", "contentType": "Photo"}, {"date": "2024-08-26", "text": "Wishing all my principal, teacher, staff, student, and caregiver friends a happy first day of school! May it be a safe day, full of learning and laughter, and the start to your best school year yet. You got this! https://t.co/A4yUzZLZLX", "eng": 1, "likes": 0, "comments": 0, "shares": 0, "type": "Post", "contentType": "Video"}, {"date": "2024-05-31", "text": "As we close out #MentalHealthAwareness Month, I’m excited to embrace a much-needed sabbatical. If you want to share information with my team or the broader community, contact @CheyaneBligen. She'll make sure we elevate your news. #PrincipalPrideChi does NOT take the summers off!", "eng": 13, "likes": 3, "comments": 0, "shares": 2, "type": "Post", "contentType": "Text"}, {"date": "2024-05-24", "text": "Congratulations to Deputy Chief of Schools — @Network13T José Torres and the second cohort of the @MCELLeaders National Leadership Institute fellowship. I am excited to watch your leadership development! https://t.co/gAfdZ75SZN", "eng": 100, "likes": 11, "comments": 1, "shares": 2, "type": "Post", "contentType": "Photo"}, {"date": "2024-05-21", "text": "Always inspired at Phoenix, and today was no exception! I heard from dozens of principals and their teams leading with student-centered innovation citywide. Chicago’s educators are on the cutting edge in support of our communities and schools. #chicagopridechi https://t.co/8vJRBKQ2P6", "eng": 63, "likes": 16, "comments": 0, "shares": 5, "type": "Post", "contentType": "Photo"}, {"date": "2024-05-21", "text": "Amazing!🙌 ", "eng": 9, "likes": 2, "comments": 0, "shares": 0, "type": "Quote", "contentType": "Link"}, {"date": "2024-05-03", "text": "'@pjkarafiol @LakeViewHS Beautiful!", "eng": 1, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-05-03", "text": "'@MClarkEagles @DevinMSwartley @ASCD @WGNTV @trpresdrj @ChicagosMayor Of COURSE! Everyone (kittens, too!) wants to be a part of the @MClarkEagles family!", "eng": 1, "likes": 1, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-05-01", "text": "'@TheFundChicago @APMABulldogs This was the best part of my day. We saw strong instruction in English and Spanish, authentic connections among students, and a deep appreciation for the power of empathy and co-creation. #ChicagoPrideChi every day.", "eng": 16, "likes": 5, "comments": 1, "shares": 1, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-05-01", "text": "It's May 1, which is NATIONAL Principal Appreciation Day! Chicago's principals lead the nation in retention and innovation and @TheFundChicago team and I are grateful every day to learn from and alongside them! They really DO \\\"rock\\\" and \\\"rule!\\\" https://t.co/nipuyIogbl", "eng": 7, "likes": 3, "comments": 0, "shares": 1, "type": "Post", "contentType": "Video"}, {"date": "2024-04-23", "text": "One of the many ways my team is great: They have excellent taste in books. Check out a few of their favs, and be sure to share your own. ", "eng": 15, "likes": 5, "comments": 0, "shares": 0, "type": "Quote", "contentType": "Link"}, {"date": "2024-04-22", "text": "I know this is an area of focus for many leaders and schools. Check out this session from our partners at @ilprincipals later this month! ", "eng": 15, "likes": 2, "comments": 0, "shares": 1, "type": "Quote", "contentType": "Link"}, {"date": "2024-04-16", "text": "At the 2024 @asugsvsummit, learning from innovative and courageous women at every turn. What a gift to be still, listen, and grow. As I celebrate 12 years into this role, I am grateful for those gifts and the educators I learn alongside daily. #ASUGSVSummit #ContinuousLearning https://t.co/h3D7so0mT", "eng": 30, "likes": 6, "comments": 0, "shares": 0, "type": "Post", "contentType": "Photo"}, {"date": "2024-04-10", "text": "LSC voting continues at elementary schools through 7 p.m. tonight, and high school voting will occur tomorrow. My colleague Patricia Mota tells you more about these critical partners in the work of our schools here: https://t.co/rJvRPWhz9D.", "eng": 5, "likes": 0, "comments": 0, "shares": 0, "type": "Post", "contentType": "Link"}, {"date": "2024-04-05", "text": "'@RoddyTheobald @sbanchero This is very interesting and helpful.", "eng": 3, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-04-01", "text": "Happy Assistant Appreciation (AP) Week! Join us at @TheFundChicago as we celebrate the work of our phenomenal APs. #CPSrunsonAPs #APpreciationWeek https://t.co/bO74jlNraB", "eng": 18, "likes": 5, "comments": 0, "shares": 2, "type": "Post", "contentType": "Video"}, {"date": "2024-04-01", "text": "Check it out: You can submit a shout-out or a video here... https://t.co/IDu7Ipqg9q!", "eng": 0, "likes": 0, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Link"}, {"date": "2024-04-01", "text": "It is Assistant Principal Appreciation Week! Be sure to shout out the APs that are making a difference in your life.  #CPSrunsonAPs", "eng": 16, "likes": 2, "comments": 1, "shares": 2, "type": "Post", "contentType": "Text"}, {"date": "2024-03-14", "text": "Happy Pi Day, friends! https://t.co/0OhCufW6VB", "eng": 4, "likes": 3, "comments": 0, "shares": 0, "type": "Post", "contentType": "Video"}, {"date": "2024-03-04", "text": "'@DAndreWeaver @TheFundChicago YES! Love this (and my kiddos are SO jealous that you got to meet Elmo... even the big kids!)...", "eng": 3, "likes": 1, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-02-20", "text": "Excited to explore this year's Design Challenge?  Tune into our upcoming webinar!  Wednesday, February 21 at 4:00 p.m. https://t.co/m1CsQ6XoGi  Register now.", "eng": 10, "likes": 2, "comments": 0, "shares": 1, "type": "Post", "contentType": "Link"}, {"date": "2024-02-07", "text": "The Design Challenge is here! This year's challenge is focused on applying design thinking to a school-specific challenge impacting a priority focus group of students, staff, or caregivers. We want to hear from YOU! https://t.co/aD7tIeg0c9", "eng": 1, "likes": 0, "comments": 0, "shares": 0, "type": "Post", "contentType": "Link"}, {"date": "2024-01-30", "text": "'@_cwconsulting @TheFundChicago @ilprincipals @canderson311 @CpsLeaders @MrsChauvinSW @KatieKinder1 @dbc_inc @NCMiddle @ChiPubSchools @MClarkEagles @SchoolProK12 @AshlynSparrow @MikeREarnshaw @PrincipalKafele So grateful for BOTH of you and all you do!", "eng": 14, "likes": 5, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2024-01-09", "text": "2023 was quite a year for the @MClarkEagles and so many other school communities. Looking forward to an even better 2024! ", "eng": 14, "likes": 4, "comments": 0, "shares": 0, "type": "Quote", "contentType": "Link"}, {"date": "2023-12-21", "text": "Educator and parent/guardian friends, we are THIS CLOSE to break. We got this! https://t.co/1cwwxsPrtJ", "eng": 16, "likes": 7, "comments": 0, "shares": 0, "type": "Post", "contentType": "Video"}, {"date": "2023-12-06", "text": "Grateful for this team and all the incredible work we get to do together. https://t.co/W8oOgvOD9f", "eng": 45, "likes": 7, "comments": 0, "shares": 0, "type": "Post", "contentType": "Photo"}, {"date": "2023-11-28", "text": "Worth a listen. As an educator and a parent, I appreciated the insights shared. ", "eng": 8, "likes": 2, "comments": 1, "shares": 0, "type": "Quote", "contentType": "Link"}, {"date": "2023-11-03", "text": "#PrincipalPrideChi was incredible. I'm ending the week reliving our Storytelling event, which was absolutely #TransformationalLeadership in action! https://t.co/tVD8JZkt0z", "eng": 5, "likes": 3, "comments": 0, "shares": 0, "type": "Post", "contentType": "Link"}, {"date": "2023-10-24", "text": "Clyde King of @AsheEagles is a long-time partner of @TheFundChicago. Our team has learned so much about #TransformationalLeadership from him over the years. #PrincipalPrideChi is ALL about leaders like Clyde! ", "eng": 14, "likes": 5, "comments": 0, "shares": 1, "type": "Quote", "contentType": "Link"}, {"date": "2023-10-20", "text": "Listening to stories of #TransformationalLeadership was a highlight of my year! The team @FieldMuseum, our partners @Chi_PubSchools and our team @TheFundChicago showed up in all the ways for #PrincipalPrideChi. https://t.co/jlXhUf98DV", "eng": 21, "likes": 7, "comments": 0, "shares": 1, "type": "Post", "contentType": "Photo"}, {"date": "2023-10-10", "text": "Whenever the world presents some overwhelming horror, I am reminded that educators do the hard work of unpacking that complexity with our young people. I am grateful for the resources and sentiment here: https://t.co/EOG1DF8Bh1.", "eng": 8, "likes": 1, "comments": 1, "shares": 0, "type": "Post", "contentType": "Link"}, {"date": "2023-10-02", "text": "I have been trying to film this video since 5:45 AM! Here's the rough cut. It isn't perfect, but it hits the high notes: #PrincipalPrideChi is back, and we are so grateful for the #TransformationalLeadership principals show citywide. https://t.co/zPyWDlQMxn", "eng": 105, "likes": 23, "comments": 0, "shares": 2, "type": "Post", "contentType": "Video"}, {"date": "2023-10-01", "text": "It's BACK! #PrincipalPrideChi starts TODAY. @TheFundChicago makes recognizing our school leaders easy. Use the toolkit to shout out #TransformationalLeadership this October (and all year round). https://t.co/bqg1VgUrzT", "eng": 15, "likes": 3, "comments": 0, "shares": 1, "type": "Post", "contentType": "Link"}, {"date": "2023-10-01", "text": "Very excited to see the work of @NLCCPS featured this week! ", "eng": 16, "likes": 3, "comments": 0, "shares": 0, "type": "Quote", "contentType": "Link"}, {"date": "2023-09-26", "text": "Excited to see the work of Josh Long and his team at Southside Occupational featured! Their commitment to delivering the support our students deserve is inspiring. https://t.co/G8LHPeKrH5 @soaprincipal ", "eng": 1, "likes": 0, "comments": 0, "shares": 0, "type": "Quote", "contentType": "Link"}, {"date": "2023-09-20", "text": "Starting the day reading about @ReginaLatimer and her team. As someone who struggled to learn (and teach) math, I appreciate the focus on both the fundamentals and the FUN. Excited to learn from the work @EarleStem in the year ahead. https://t.co/au3pCXwzlD", "eng": 44, "likes": 9, "comments": 0, "shares": 1, "type": "Post", "contentType": "Link"}, {"date": "2023-09-07", "text": "Local School Councils are a critical part of our school communities. Join the team to learn more on September 21! ", "eng": 8, "likes": 2, "comments": 0, "shares": 1, "type": "Quote", "contentType": "Link"}, {"date": "2023-08-31", "text": "What a gift! Our team @TheFundChicago spent the morning learning from @canderson311 and his team at @MClarkEagles. It is ALWAYS a great day to be an Eagle! https://t.co/bLBu37QQKC", "eng": 59, "likes": 15, "comments": 1, "shares": 0, "type": "Post", "contentType": "Photo"}, {"date": "2023-08-21", "text": "So many great first-day posts. Congratulations to all the educators, scholars, and families who made today happen. ", "eng": 3, "likes": 0, "comments": 0, "shares": 0, "type": "Quote", "contentType": "Link"}, {"date": "2023-08-21", "text": "'@MClarkEagles @ChiPubSchools @_cwconsulting @canderson311 @VernonRDriskell @trpresdrj @ChicagosMayor @ChicagoCAPS15 @BpopeTV @PedroCPSCEO @spetersonklosa @CPSCEdoBogdana @CpsLeaders @ramonski_luv @WmStubbs @BurtonABC7 @TBrownABC7 @StandTallSteve It is ALWAYS a great day to be an Eagle! :)", "eng": 5, "likes": 3, "comments": 0, "shares": 0, "type": "'@Reply", "contentType": "Text"}, {"date": "2023-08-20", "text": "FIRST DAY IS ALMOST HERE. I can feel t   {year:2026, posts:59,  totalEng:2660, avgEng:45.1, impressions:9331, deltaLabel:'-13.9% vs 2025', deltaDir:'down'},
  {year:2025, posts:127, totalEng:6608, avgEng:52.0, impressions:0,    deltaLabel:'-26.2% vs 2024', deltaDir:'down'},
  {year:2024, posts:46,  totalEng:3244, avgEng:70.5, impressions:0,    deltaLabel:'', deltaDir:''},
];
const X_YEARS = [
  {year:2026, posts:5,   totalEng:15,  avgEng:3.0, deltaLabel:'-28.6% vs 2025', deltaDir:'down'},
  {year:2025, posts:338, totalEng:1426, avgEng:4.2, deltaLabel:'-74.9% vs 2024', deltaDir:'down'},

];

// ──────────────────────────────────────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────────────────────────────────────
let currentTab = 'li';
let liChartMode = 'perPost';
let xChartMode  = 'perPost';
let activeChart = null;
let combinedChart = null;

// ──────────────────────────────────────────────────────────────────────────────
// TAB CONTROL
// ──────────────────────────────────────────────────────────────────────────────
function setTab(tab) {
  currentTab = tab;
  if (activeChart)   { activeChart.destroy();   activeChart   = null; }
  if (combinedChart) { combinedChart.destroy(); combinedChart = null; }

  ['li','x','combined'].forEach(t => {
    const el = document.getElementById('tab-' + t);
    el.className = 'ptab' + (t === tab ? ' ptab-active-' + t : '');
  });

  updateHeaderBadge();
  updateProfileMeta();
  updateFooter();
  renderContent();

  setTimeout(() => {
    if (tab === 'li') drawChart('li', liChartMode);
    else if (tab === 'x') { drawChart('x', xChartMode); renderFeed('x'); }
    else drawCombinedChart();
  }, 0);
}

function updateHeaderBadge() {
  const b = document.getElementById('header-badge');
  if (currentTab === 'li') b.textContent = 'LinkedIn';
  else if (currentTab === 'x') b.textContent = 'X / Twitter';
  else b.textContent = 'LinkedIn + X';
}

function updateProfileMeta() {
  const m = document.getElementById('profile-meta');
  if (currentTab === 'li') {
    m.innerHTML = metaPill('#0A66C2','LinkedIn Personal Profile') + metaPillText('Jan 24, 2024 – May 28, 2026') + metaPillText('230 posts tracked');
  } else if (currentTab === 'x') {
    m.innerHTML = metaPill('#14171A','X / Twitter @MsAnichini') + metaPillText('Jan 2023 – Jun 2026') + metaPillText('435 posts tracked');
  } else {
    m.innerHTML = metaPill('#5B3FA6','LinkedIn + X') + metaPillText('Jan 2023 – Jun 2026') + metaPillText('667 total posts');
  }
}

function metaPill(color, text) {
  return `<span class="meta-pill"><span class="meta-dot" style="background:${color}"></span>${text}</span>`;
}
function metaPillText(text) {
  return `<span class="meta-pill">${text}</span>`;
}

function updateFooter() {
  const n = document.getElementById('footer-note');
  if (currentTab === 'li') n.textContent = 'LinkedIn · Personal account · Impressions available from January 2026 onward';
  else if (currentTab === 'x') n.textContent = '@MsAnichini · X data: January 2023 – June 2026';
  else n.textContent = 'LinkedIn (Jan 2024–Jun 2026) + X (Jan 2023–Jun 2026) · Sprout Social export';
}

// ──────────────────────────────────────────────────────────────────────────────
// RENDER CONTENT
// ──────────────────────────────────────────────────────────────────────────────
function renderContent() {
  const area = document.getElementById('content-area');
  if (currentTab === 'li')       area.innerHTML = renderLinkedIn();
  else if (currentTab === 'x')   area.innerHTML = renderX();
  else                           area.innerHTML = renderCombined();
}

// LINKEDIN VIEW
// ──────────────────────────────────────────────────────────────────────────────
function renderLinkedIn() {
  const yearColors = {2026:'2026',2025:'2025',2024:'2024'};
  const kpiCards = LI_YEARS.map(y => {
    const cls = yearColors[y.year] || '2024';
    const imp = y.year === 2026 ? `<div class="kpi-val">${fmt(y.totalEng)}</div><div class="kpi-label">Total engagements (${y.posts} posts)</div>` : '';
    const delta = y.deltaLabel ? `<div class="kpi-delta ${y.deltaDir==='down'?'delta-down':'delta-up'}">${y.deltaDir==='down'?'↓':'↑'} ${y.deltaLabel}</div>` : '';
    return `
    <div class="kpi-card kpi-${cls}">
      <div class="kpi-year kpi-year-${cls}">${y.year}</div>
      <div class="kpi-val">${y.avgEng}</div>
      <div class="kpi-label">Avg engagements / post</div>
      ${delta}
    </div>
    <div class="kpi-card kpi-${cls}">
      <div class="kpi-year kpi-year-${cls}">${y.year}</div>
      <div class="kpi-val">${fmt(y.totalEng)}</div>
      <div class="kpi-label">Total engagements (${y.posts} posts)</div>
    </div>`;
  }).join('');

  return `
  <div class="kpi-section">
    <div class="kpi-row">${kpiCards}</div>
    <div class="kpi-row">
      <div class="kpi-card kpi-green" style="max-width:220px">
        <div class="kpi-year kpi-year-green">2026 YTD</div>
        <div class="kpi-val">104.7K</div>
        <div class="kpi-label">Total impressions (Jan 2026+)</div>
      </div>
    </div>
  </div>
  <div class="info-banner">
    <span style="font-size:14px;flex-shrink:0">ⓘ</span>
    <span>LinkedIn only began sharing impression data for personal accounts in early 2026. Engagement metrics (reactions, comments) are available for all posts since January 2024 and are the primary performance indicator for this profile.</span>
  </div>
  <div class="chart-card">
    <div class="chart-header">
      <div>
        <div class="chart-title">Engagements per post over time</div>
      </div>
      <div class="chart-toggles">
        <button class="ctoggle ctoggle-active" id="li-tog-pp" onclick="switchLiChart('perPost')">Per Post</button>
        <button class="ctoggle" id="li-tog-mt" onclick="switchLiChart('monthly')">Monthly Total</button>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
  </div>
  <div class="feed-section">
    <div class="feed-header">
      <div>
        <div class="feed-title">Post Feed</div>
        <div class="feed-sub">All posts sorted newest first. Click any post to expand the full text.</div>
      </div>
      <div class="feed-controls">
        <select class="feed-select" id="li-year-filter" onchange="renderFeed('li')">
          <option value="all">All years</option>
          <option value="2026">2026</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
        </select>
        <select class="feed-select" id="li-sort" onchange="renderFeed('li')">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="eng">Most engaged</option>
          <option value="reactions">Most reactions</option>
        </select>
      </div>
    </div>
    <div id="li-feed-list"></div>
  </div>`;
}

function switchLiChart(mode) {
  liChartMode = mode;
  document.getElementById('li-tog-pp').className = 'ctoggle' + (mode==='perPost'?' ctoggle-active':'');
  document.getElementById('li-tog-mt').className = 'ctoggle' + (mode==='monthly'?' ctoggle-active':'');
  if (activeChart) { activeChart.destroy(); activeChart = null; }
  drawChart('li', mode);
  setTimeout(() => renderFeed('li'), 0);
}

        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
        LinkedIn
      </div>
      <div class="stat-row"><span class="stat-name">Total posts</span><span class="stat-val">${liTot.posts}</span></div>
      <div class="stat-row"><span class="stat-name">Total engagements</span><span class="stat-val">${liTot.eng.toLocaleString()}</span></div>
      <div class="stat-row"><span class="stat-name">Avg eng / post</span><span class="stat-val">${liAvg}</span></div>
      <div class="stat-row"><span class="stat-name">Peak year avg</span><span class="stat-val">70.5 (2024)</span></div>
      <div class="stat-row"><span class="stat-name">2026 impressions</span><span class="stat-val">104.7K</span></div>
      <div class="stat-row"><span class="stat-name">Share of total eng</span><span class="stat-val">${liPct}%</span></div>
    </div>
    <div class="compare-card">
      <div class="compare-header" style="color:var(--x-dark)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        X (Twitter)
      </div>
      <div class="stat-row"><span class="stat-name">Total posts</span><span class="stat-val">${xTot.posts}</span></div>
      <div class="stat-row"><span class="stat-name">Total engagements</span><span class="stat-val">${xTot.eng.toLocaleString()}</span></div>
      <div class="stat-row"><span class="stat-name">Avg eng / post</span><span class="stat-val">${xAvg}</span></div>
      <div class="stat-row"><span class="stat-name">Peak year avg</span><span class="stat-val">16.7 (2023/24)</span></div>
      <div class="stat-row"><span class="stat-name">Post volume trend</span><span class="stat-val">↑ 8.7× (23→25)</span></div>
      <div class="stat-row"><span class="stat-name">Share of total eng</span><span class="stat-val">${100-liPct}%</span></div>
    </div>
  </div>
  <div class="chart-card">
    <div class="chart-header">
      <div>
        <div class="chart-title">Monthly engagements — LinkedIn vs. X</div>
        <div class="chart-sub">Overlapping window: Jan 2024 – Jun 2026</div>
      </div>
    </div>
    <div class="chart-wrap" style="height:240px"><canvas id="combinedChartCanvas"></canvas></div>
  </div>`;
}

// ──────────────────────────────────────────────────────────────────────────────
// CHARTS
// ──────────────────────────────────────────────────────────────────────────────
function drawChart(platform, mode) {
  const canvas = document.getElementById('mainChart');
  if (!canvas) return;
  const monthly = platform === 'li' ? LI_MONTHLY : X_MONTHLY;
  const color   = platform === 'li' ? '#6B1E2E' : '#14171A';
  const color2  = platform === 'li' ? '#7C3480' : '#657786';

  if (mode === 'perPost') {
    // Scatter: each monthly data point as a dot, colored by year
    const yearColors = {'2024': '#1B4FA8', '2025': '#6B1E2E', '2026': '#7C3480', '2023': '#1A7A4A'};
    const datasets = {};
    monthly.forEach(m => {
      const yr = m.month.slice(0,4);
      if (!datasets[yr]) datasets[yr] = {label: yr, data:[], backgroundColor: yearColors[yr]||'#999', pointRadius:7, pointHoverRadius:9};
      datasets[yr].data.push({x: fmtMonth(m.month), y: m.avgEng});
    });
    activeChart = new Chart(canvas, {
      type: 'scatter',
      data: { datasets: Object.values(datasets) },
      options: {
        ...baseOpts(mode === 'perPost' ? 'Avg Eng / Post' : 'Engagements'),
        plugins: {
          ...baseOpts().plugins,
          legend: { display: true, labels: { color:'#6B6B6B', font:{size:11,family:'Inter,sans-serif'}, boxWidth:10, padding:14 } }
        },
        scales: {
          x: { type:'category', labels: monthly.map(m=>fmtMonth(m.month)), ...axisStyle() },
          y: { ...axisStyle(), title:{display:false} }
        }
      }
    });
  } else {
    const labels = monthly.map(m => fmtMonth(m.month));
    const data   = monthly.map(m => m.engagements);
    activeChart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: 'Total Engagements',
          data,
          backgroundColor: platform === 'li' ? 'rgba(107,30,46,0.6)' : 'rgba(20,23,26,0.5)',
          borderColor:     platform === 'li' ? '#6B1E2E' : '#14171A',
          borderWidth: 1,
          borderRadius: 4,
        }]
      },
      options: baseOpts('Engagements')
    });
  }

  // re-render feed after chart is drawn (li only)
  if (platform === 'li') setTimeout(()=>renderFeed('li'), 0);
}

function drawCombinedChart() {
  const canvas = document.getElementById('combinedChartCanvas');
  if (!canvas) return;
  const allMonths = [...new Set([
    ...LI_MONTHLY.map(m=>m.month),
    ...X_MONTHLY.filter(m=>m.month>='2024-01').map(m=>m.month)
  ])].sort();
  const liMap = Object.fromEntries(LI_MONTHLY.map(m=>[m.month, m.engagements]));
  const xMap  = Object.fromEntries(X_MONTHLY.map(m=>[m.month, m.engagements]));
  combinedChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: allMonths.map(fmtMonth),
      datasets: [
        { label:'LinkedIn', data: allMonths.map(m=>liMap[m]||0), backgroundColor:'rgba(107,30,46,0.65)', borderColor:'#6B1E2E', borderWidth:1, borderRadius:3 },
        { label:'X (Twitter)', data: allMonths.map(m=>xMap[m]||0), backgroundColor:'rgba(20,23,26,0.35)', borderColor:'#14171A', borderWidth:1, borderRadius:3 },
      ]
    },
    options: {
      ...baseOpts('Engagements'),
      plugins: {
        ...baseOpts().plugins,
        legend: { display:true, labels:{ color:'#6B6B6B', font:{size:11,family:'Inter,sans-serif'}, boxWidth:12, padding:16 } }
      }
    }
  });
}

function baseOpts(yLabel) {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor:'#fff', borderColor:'#E0DDD6', borderWidth:1,
        titleColor:'#1A1A1A', bodyColor:'#6B6B6B', padding:10,
        titleFont:{size:12,family:'Inter,sans-serif'}, bodyFont:{size:12,family:'Inter,sans-serif'},
      }
    },
    scales: {
      x: axisStyle(),
      y: { ...axisStyle(), title:{ display:!!yLabel, text:yLabel||'', color:'#9A9A9A', font:{size:10} } }
    }
  };
}

function axisStyle() {
  return {
    grid:{ color:'rgba(0,0,0,0.05)' },
    ticks:{ color:'#9A9A9A', font:{size:10,family:'Inter,sans-serif'}, maxTicksLimit:14, maxRotation:45 },
    border:{ color:'#E0DDD6' }
  };
}

// ──────────────────────────────────────────────────────────────────────────────
// POST FEED
// ──────────────────────────────────────────────────────────────────────────────
function renderFeed(platform) {
  const listId   = platform === 'li' ? 'li-feed-list' : 'x-feed-list';
  const yearId   = platform === 'li' ? 'li-year-filter' : 'x-year-filter';
  const sortId   = platform === 'li' ? 'li-sort' : 'x-sort';
  const allPosts = platform === 'li' ? LI_FEED : X_FEED;
  const list = document.getElementById(listId);
  if (!list) return;

  const year = document.getElementById(yearId)?.value || 'all';
  const sort = document.getElementById(sortId)?.value  || 'newest';

  let posts = [...allPosts];
  if (year !== 'all') posts = posts.filter(p => p.date.startsWith(year));
  if (sort === 'newest')    posts.sort((a,b) => b.date.localeCompare(a.date));
  else if (sort === 'oldest') posts.sort((a,b) => a.date.localeCompare(b.date));
  else if (sort === 'eng')    posts.sort((a,b) => b.eng - a.eng);
  else if (sort === 'reactions') posts.sort((a,b) => (b.reactions||0) - (a.reactions||0));

  const shown = posts.slice(0, 50);
  list.innerHTML = shown.map(p => {
    const stats = platform === 'li'
      ? `<span class="post-stat">♥ <strong>${p.reactions||0}</strong></span>
         <span class="post-stat">💬 <strong>${p.comments||0}</strong></span>
         <span class="post-stat">↺ <strong>${p.shares||0}</strong></span>
         ${p.impressions ? `<span class="post-stat">👁 <strong>${p.impressions.toLocaleString()}</strong></span>` : ''}`
      : `<span class="post-stat">♥ <strong>${p.likes||0}</strong></span>
         <span class="post-stat">💬 <strong>${p.comments||0}</strong></span>
         <span class="post-stat">↺ <strong>${p.shares||0}</strong></span>`;
    return `<div class="post-item" onclick="togglePost(this)">
      <div class="post-top-row">
        <div class="post-meta-left">
          <span class="post-date">${p.date}</span>
          <span class="post-badge">${escHtml(p.type.replace("'@","@"))}</span>
          <span class="post-badge">${escHtml(p.contentType)}</span>
        </div>
        <span class="eng-badge">${p.eng} eng</span>
      </div>
      <div class="post-text">${escHtml(p.text)}</div>
      <div class="post-stats">${stats}</div>
    </div>`;
  }).join('') + (posts.length > 50 ? `<div class="feed-more">${posts.length-50} more posts — use filters to narrow results</div>` : '');
}

function togglePost(el) {
  el.querySelector('.post-text').classList.toggle('expanded');
}

// ──────────────────────────────────────────────────────────────────────────────
// HELPERS
// ──────────────────────────────────────────────────────────────────────────────
function fmt(n) {
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
  return String(n);
}
function fmtMonth(str) {
  const [y,m] = str.split('-');
  const names = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return names[parseInt(m)] + " '" + y.slice(2);
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function makeBar(label, val, total, color) {
  const pct = Math.round(val/total*100);
  return `<div class="bar-item">
    <div class="bar-label-row"><span class="bar-label">${label}</span><span class="bar-count">${val} (${pct}%)</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}

// ──────────────────────────────────────────────────────────────────────────────
// INIT

setTab('li');
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Heather Y. Anichini | Influencer Dashboard</title>
  <script src="influencer_data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --maroon:#6B1E2E; --dark:#1a1a1a; --mid:#666; --light:#F0EDE7;
      --white:#fff; --border:#E0DDD6;
      --c2026:#9B4ECA; --c2025:#7E162D; --c2024:#185FA5; --c2023:#1D9E75;
      --li-blue:#0A66C2; --x-dark:#14171A; --combined:#5B3FA6;
      --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    body{font-family:var(--font);background:var(--light);color:var(--dark);min-height:100vh;font-size:14px}
    a{color:var(--maroon);text-decoration:none} a:hover{text-decoration:underline}

    /* Header */
    header{background:var(--maroon);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .nav-back{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.75);font-size:12px;transition:color .15s}
    .nav-back:hover{color:#fff;text-decoration:none}
    .nav-back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
    .header-center h1{font-size:18px;font-weight:700;color:#fff;margin-top:.25rem}
    .header-center p{font-size:12px;color:rgba(255,255,255,.65);margin-top:2px}
    .hbadge{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12px;font-weight:600;padding:5px 13px;border-radius:6px}

    /* Layout */
    main{max-width:1100px;margin:0 auto;padding:28px 20px 60px}

    /* Panel — matched to org dashboard */
    .panel{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:22px 24px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05)}

    /* Platform tabs */
    .platform-tabs{display:flex;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:6px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.05);gap:4px}
    .ptab{flex:1;padding:9px 16px;border-radius:8px;border:none;background:transparent;color:var(--mid);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .18s}
    .ptab:hover:not([class*="ptab-active"]){background:#f0ede7;color:var(--dark);transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.08)}
    .ptab-active-li{background:var(--li-blue);color:#fff;box-shadow:0 2px 8px rgba(10,102,194,.35)}
    .ptab-active-li:hover{background:#0858a8;color:#fff}
    .ptab-active-x{background:#2D2D2D;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
    .ptab-active-x:hover{background:#1a1a1a;color:#fff}
    .ptab-active-combined{background:var(--combined);color:#fff;box-shadow:0 2px 8px rgba(91,63,166,.35)}
    .ptab-active-combined:hover{background:#4a3190;color:#fff}

    /* Profile hero */
    .hero{display:flex;align-items:center;gap:20px}
    .hero-avatar{width:56px;height:56px;border-radius:50%;background:var(--maroon);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .hero-info h2{font-family:Georgia,serif;font-size:20px;color:var(--dark)}
    .hero-info p{font-size:13px;color:var(--mid);margin-top:2px}
    .hero-meta{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
    .hero-tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--mid)}
    .li-dot{width:7px;height:7px;border-radius:50%;background:var(--li-blue);display:inline-block}
    .x-dot{width:7px;height:7px;border-radius:50%;background:var(--x-dark);display:inline-block}
    .combined-dot{width:7px;height:7px;border-radius:50%;background:var(--combined);display:inline-block}
    .data-tag{margin-left:auto;font-size:11px;color:#aaa;font-style:italic}

    /* KPI cards — matched exactly to org dashboard */
    .cards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
    .card{background:var(--white);border:1px solid var(--border);border-left:4px solid transparent;border-radius:10px;padding:18px 20px;min-width:160px;flex:1;box-shadow:0 1px 4px rgba(0,0,0,.06);position:relative}
    .card-yr{font-size:11px;font-weight:700;letter-spacing:.07em;margin-bottom:10px;text-transform:uppercase}
    .card-val{font-size:28px;font-weight:700;color:var(--dark);line-height:1.05;font-family:Georgia,serif}
    .card-lbl{font-size:12px;color:var(--mid);margin-top:5px;line-height:1.35}
    .card-chg{font-size:11px;font-weight:600;margin-top:7px;display:flex;align-items:center;gap:3px}
    .up{color:#1A7A4A} .dn{color:#C0392B}

    /* Info note */
    .note{background:#FBF8EE;border:1px solid #E8DFC0;border-radius:10px;padding:11px 15px;font-size:12px;color:#6B5B2E;margin-bottom:18px;display:flex;gap:8px;align-items:flex-start}

    /* Chart */
    .chart-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:10px}
    .chart-title{font-family:Georgia,serif;font-size:16px;color:var(--dark);font-weight:400}
    .chart-wrap{position:relative;height:270px}
    .seg{display:flex;background:var(--light);border-radius:7px;border:1px solid var(--border);padding:2px;gap:2px}
    .seg button{padding:4px 14px;border:none;background:transparent;border-radius:5px;font-size:13px;font-family:inherit;color:var(--mid);cursor:pointer;transition:all .12s}
    .seg button.active{background:var(--maroon);color:#fff;font-weight:600}
    .seg button:hover:not(.active){background:rgba(255,255,255,.65);color:var(--dark)}

    /* Compare grid */
    .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
    .compare-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .compare-hdr{display:flex;align-items:center;gap:8px;font-family:Georgia,serif;font-size:15px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
    .stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0ede7}
    .stat-row:last-child{border-bottom:none}
    .stat-name{font-size:12px;color:var(--mid)} .stat-val{font-size:13px;font-weight:600}

    /* Section header */
    .sec-title{font-family:Georgia,serif;font-size:17px;color:var(--maroon);margin-bottom:.25rem;font-weight:400}
    .sec-desc{font-size:13px;color:var(--mid);margin-bottom:1rem;line-height:1.4}

    /* Filters */
    .filter-row{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem}
    .filter-row label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mid)}
    select{padding:6px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;color:var(--dark);background:var(--white);cursor:pointer}
    select:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 2px rgba(107,30,46,.1)}
    .search-wrap{flex:1;min-width:180px;max-width:320px;position:relative}
    .search-wrap input{width:100%;padding:6px 10px 6px 30px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;color:var(--dark);background:var(--white)}
    .search-wrap input:focus{outline:none;border-color:var(--maroon);box-shadow:0 0 0 2px rgba(107,30,46,.1)}
    .search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--mid);pointer-events:none}
    .results-count{font-size:12px;color:var(--mid);margin-left:auto}

    /* Post cards */
    .post-feed{display:flex;flex-direction:column;gap:.75rem}
    .post-card{background:var(--white);border:1px solid var(--border);border-left:4px solid var(--maroon);border-radius:8px;overflow:hidden;transition:box-shadow .15s}
    .post-card:hover{box-shadow:0 3px 12px rgba(0,0,0,.09)}
    .post-header{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem .5rem;gap:1rem;flex-wrap:wrap}
    .post-date{font-size:12px;color:var(--mid);white-space:nowrap;font-weight:500}
    .ctype-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mid);background:var(--light);border:1px solid var(--border);padding:2px 7px;border-radius:10px}
    .post-metrics{display:flex;gap:.5rem;flex-wrap:wrap}
    .metric-pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--dark);background:var(--light);padding:3px 9px;border-radius:20px;border:1px solid var(--border)}
    .metric-pill.highlight{background:#FEF9EC;border-color:#DAC99B;color:var(--maroon)}
    .metric-pill svg{flex-shrink:0;opacity:.7}
    .post-body{padding:.25rem 1rem .75rem}
    .post-text{font-size:13.5px;line-height:1.6;color:var(--dark);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .post-text.expanded{display:block;overflow:visible}
    .post-footer{padding:.5rem 1rem .75rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;border-top:1px solid var(--border);background:rgba(247,245,242,.6)}
    .expand-btn{background:none;border:none;cursor:pointer;font-size:12px;color:var(--maroon);font-family:inherit;font-weight:600;padding:0}
    .expand-btn:hover{text-decoration:underline}
    .view-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#0A66C2;font-weight:600;text-decoration:none}
    .view-link:hover{text-decoration:underline}
    .view-link-x{color:var(--x-dark)}
    /* Pagination */
    .pagination{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
    .page-btn{padding:5px 12px;border:1px solid var(--border);border-radius:7px;font-size:13px;font-family:inherit;cursor:pointer;background:var(--white);color:var(--mid);transition:all .12s}
    .page-btn:hover:not(:disabled){border-color:var(--maroon);color:var(--maroon)}
    .page-btn.active{background:var(--maroon);color:#fff;border-color:var(--maroon)}
    .page-btn:disabled{opacity:.4;cursor:not-allowed}
    .page-info{font-size:12px;color:var(--mid)}
    .empty-state{text-align:center;color:var(--mid);font-size:13px;font-style:italic;padding:2.5rem 1rem;background:var(--light);border-radius:8px;border:1px dashed var(--border)}

    footer{text-align:center;font-size:11px;color:#aaa;padding:1.5rem 1.5rem 2rem;border-top:1px solid var(--border);margin-top:12px}
    @media(max-width:640px){.compare-grid{grid-template-columns:1fr}.cards{flex-direction:column}.card{min-width:0}header{padding:12px 16px}main{padding:18px 14px 48px}}
  </style>
</head>
<body>

<header>
  <div>
    <a href="index.html" class="nav-back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Back to Org Dashboard
    </a>
    <div class="header-center">
      <h1>Influencer Analytics</h1>
      <p>The Chicago Public Education Fund &mdash; Leadership Voices</p>
    </div>
  </div>
  <div class="hbadge" id="hbadge">LinkedIn</div>
</header>

<main>

  <!-- Profile hero -->
  <div class="panel">
    <div class="hero">
      <div class="hero-avatar">HA</div>
      <div class="hero-info">
        <h2>Heather Y. Anichini</h2>
        <p>CEO, The Chicago Public Education Fund</p>
        <div class="hero-meta" id="heroMeta"></div>
      </div>
      <div class="data-tag" id="dataTag"></div>
    </div>
  </div>

  <!-- Platform tabs -->
  <div class="platform-tabs">
    <button class="ptab" id="tab-li" onclick="setTab('li')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
      LinkedIn
    </button>
    <button class="ptab" id="tab-x" onclick="setTab('x')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      X (Twitter)
    </button>
    <button class="ptab" id="tab-combined" onclick="setTab('combined')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="12" r="7"/><circle cx="15" cy="12" r="7"/></svg>
      Combined
    </button>
  </div>

  <div id="contentArea"></div>

</main>

<footer>Data sourced from Sprout Social &mdash; The Chicago Public Education Fund &nbsp;&middot;&nbsp; <span id="footerNote"></span></footer>

<script>
// ─── Date helpers (defined first — used in boot) ──────────────────────────────
function fmtDate(s){const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtMonthYear(s){const d=new Date(s+'T12:00:00');return d.toLocaleDateString('en-US',{month:'short',year:'numeric'});}
function fmtDateRange(a,b){return fmtMonthYear(a)+' – '+fmtMonthYear(b);}

// ─── Data from build.js ───────────────────────────────────────────────────────
const raw = window.INFLUENCER_DATA || null;

function g(p, ...keys) { for (const k of keys) if (p[k] != null) return p[k]; return null; }

const LI_FEED = raw ? raw.posts.filter(p=>p.network==='LinkedIn').sort((a,b)=>b.date.localeCompare(a.date)) : [];
const X_FEED  = raw ? raw.posts.filter(p=>p.network==='X').sort((a,b)=>b.date.localeCompare(a.date)) : [];

function yearsFor(feed) {
  const map={};
  feed.forEach(p=>{
    const yr=p.date.slice(0,4);
    if(!map[yr]) map[yr]={year:parseInt(yr),posts:0,totalEng:0,totalImp:0};
    map[yr].posts++; map[yr].totalEng+=g(p,'eng')||0; map[yr].totalImp+=g(p,'imp')||0;
  });
  const years=Object.values(map).sort((a,b)=>b.year-a.year);
  years.forEach((y,i)=>{
    y.avgEng=y.posts?Math.round(y.totalEng/y.posts*10)/10:0;
    const prev=years[i+1];
    if(prev&&prev.avgEng>0){const pct=((y.avgEng-prev.avgEng)/prev.avgEng*100).toFixed(1);y.deltaLabel=Math.abs(pct)+'% vs '+prev.year;y.deltaDir=pct>=0?'up':'dn';}
    else{y.deltaLabel='';y.deltaDir='';}
  });
  return years;
}
function monthlyFor(feed) {
  const map={};
  feed.forEach(p=>{const k=p.date.slice(0,7);if(!map[k])map[k]={month:k,posts:0,engagements:0,impressions:0};map[k].posts++;map[k].engagements+=g(p,'eng')||0;map[k].impressions+=g(p,'imp')||0;});
  return Object.values(map).sort((a,b)=>a.month.localeCompare(b.month));
}

const LI_YEARS=yearsFor(LI_FEED), X_YEARS=yearsFor(X_FEED);
const LI_MONTHLY=monthlyFor(LI_FEED), X_MONTHLY=monthlyFor(X_FEED);

const YR_COLORS={'2023':'#1D9E75','2024':'#185FA5','2025':'#7E162D','2026':'#9B4ECA'};
const PER_PAGE=20;

// ─── State ────────────────────────────────────────────────────────────────────
let currentTab='li', liChartMode='perPost', xChartMode='perPost';
let liPage=1, xPage=1;
let activeChart=null, combinedChart=null;

// ─── Boot ─────────────────────────────────────────────────────────────────────
(function(){
  if(raw&&raw.meta) document.getElementById('dataTag').textContent=fmtDateRange(raw.meta.firstDate,raw.meta.lastDate)+' · '+raw.meta.totalPosts+' posts';
  setTab('li');
})();

// ─── Tab ──────────────────────────────────────────────────────────────────────
function setTab(tab) {
  currentTab=tab;
  if(activeChart){activeChart.destroy();activeChart=null;}
  if(combinedChart){combinedChart.destroy();combinedChart=null;}
  ['li','x','combined'].forEach(t=>{document.getElementById('tab-'+t).className='ptab'+(t===tab?' ptab-active-'+t:'');});
  document.getElementById('hbadge').textContent=tab==='li'?'LinkedIn':tab==='x'?'X / Twitter':'LinkedIn + X';
  document.getElementById('footerNote').textContent=tab==='li'?'LinkedIn · Personal account · Impressions from Jan 2026+':tab==='x'?'@MsAnichini · X / Twitter':'LinkedIn + X combined';
  updateHeroMeta();
  document.getElementById('contentArea').innerHTML=tab==='li'?renderLI():tab==='x'?renderX():renderCombined();
  setTimeout(()=>{
    if(tab==='li'){drawChart('li',liChartMode);renderFeed('li');}
    else if(tab==='x'){drawChart('x',xChartMode);renderFeed('x');}
    else drawCombinedChart();
  },0);
}

function updateHeroMeta() {
  const m=document.getElementById('heroMeta');
  const liD=LI_FEED.length?fmtDateRange(LI_FEED[LI_FEED.length-1].date,LI_FEED[0].date):'—';
  const xD=X_FEED.length?fmtDateRange(X_FEED[X_FEED.length-1].date,X_FEED[0].date):'—';
  if(currentTab==='li')
    m.innerHTML=`<span class="hero-tag"><span class="li-dot"></span>LinkedIn Personal Profile</span><span class="hero-tag">${liD}</span><span class="hero-tag">${LI_FEED.length} posts tracked</span>`;
  else if(currentTab==='x')
    m.innerHTML=`<span class="hero-tag"><span class="x-dot"></span>X / Twitter @MsAnichini</span><span class="hero-tag">${xD}</span><span class="hero-tag">${X_FEED.length} posts tracked</span>`;
  else
    m.innerHTML=`<span class="hero-tag"><span class="combined-dot"></span>LinkedIn + X</span><span class="hero-tag">${LI_FEED.length+X_FEED.length} total posts</span>`;
}

// ─── LinkedIn ─────────────────────────────────────────────────────────────────
function renderLI() {
  const totalImp=LI_YEARS.reduce((a,y)=>a+y.totalImp,0);
  const kpis=LI_YEARS.map(y=>{
    const c=YR_COLORS[y.year]||'#888';
    const d=y.deltaLabel?`<div class="card-chg ${y.deltaDir}">${y.deltaDir==='up'?'↑':'↓'} ${y.deltaLabel}</div>`:'';
    return `<div class="card" style="border-left-color:${c}"><div class="card-yr" style="color:${c}">${y.year}</div><div class="card-val">${y.avgEng}</div><div class="card-lbl">Avg engagements / post</div>${d}</div>
            <div class="card" style="border-left-color:${c}"><div class="card-yr" style="color:${c}">${y.year}</div><div class="card-val">${fmt(y.totalEng)}</div><div class="card-lbl">Total engagements (${y.posts} posts)</div></div>`;
  }).join('');
  const impCard=totalImp>0?`<div class="cards"><div class="card" style="border-left-color:#1A7A4A;max-width:210px"><div class="card-yr" style="color:#1A7A4A">2026 YTD</div><div class="card-val">${fmt(totalImp)}</div><div class="card-lbl">Total impressions (Jan 2026+)</div></div></div>`:'';
  const liYears=[...new Set(LI_FEED.map(p=>p.date.slice(0,4)))].sort().reverse();
  return `
  <div class="cards">${kpis}</div>${impCard}
  <div class="note"><span style="font-size:14px;flex-shrink:0">ⓘ</span><span>LinkedIn only began sharing impression data for personal accounts in early 2026. Engagement metrics (reactions, comments) are available for all posts since January 2024 and are the primary performance indicator for this profile.</span></div>
  <div class="panel">
    <div class="chart-hdr"><div class="chart-title">Engagements per post over time</div>
    <div class="seg" id="liSeg">
      <button class="active" onclick="switchChart('li','perPost')">Per Post</button>
      <button onclick="switchChart('li','monthly')">Monthly Total</button>
    </div></div>
    <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
  </div>
  <div class="panel">
    <div class="sec-title">Post Feed</div>
    <div class="sec-desc">All posts sorted newest first. Click any post to expand the full text.</div>
    <div class="filter-row">
      <label>Year</label>
      <select id="li-year" onchange="liPage=1;renderFeed('li')"><option value="all">All years</option>${liYears.map(y=>`<option value="${y}">${y}</option>`).join('')}</select>
      <label>Sort by</label>
      <select id="li-sort" onchange="liPage=1;renderFeed('li')"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="eng">Most engaged</option><option value="reactions">Most reactions</option></select>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="li-search" placeholder="Search posts…" oninput="liPage=1;renderFeed('li')">
      </div>
      <span class="results-count" id="li-count"></span>
    </div>
    <div class="post-feed" id="li-feed"></div>
    <div class="pagination" id="li-pages"></div>
  </div>`;
}

// ─── X ────────────────────────────────────────────────────────────────────────
function renderX() {
  const total=X_FEED.length;
  const cc={};
  X_FEED.forEach(p=>{const t=p.contentType||'Unknown';cc[t]=(cc[t]||0)+1;});
  const cItems=Object.entries(cc).sort((a,b)=>b[1]-a[1]);
  const cColors=['#14171A','#657786','#AAB8C2','#D0D5DA'];
  const kpis=X_YEARS.map(y=>{
    const c=YR_COLORS[y.year]||'#888';
    const d=y.deltaLabel?`<div class="card-chg ${y.deltaDir}">${y.deltaDir==='up'?'↑':'↓'} ${y.deltaLabel}</div>`:'';
    return `<div class="card" style="border-left-color:${c}"><div class="card-yr" style="color:${c}">${y.year}</div><div class="card-val">${y.avgEng}</div><div class="card-lbl">Avg engagements / post</div>${d}</div>
            <div class="card" style="border-left-color:${c}"><div class="card-yr" style="color:${c}">${y.year}</div><div class="card-val">${fmt(y.totalEng)}</div><div class="card-lbl">Total engagements (${y.posts} posts)</div></div>`;
  }).join('');
  const xYears=[...new Set(X_FEED.map(p=>p.date.slice(0,4)))].sort().reverse();
  return `
  <div class="cards">${kpis}</div>
  <div class="panel">
    <div class="chart-hdr"><div class="chart-title">Engagements per post over time</div>
    <div class="seg" id="xSeg">
      <button class="active" onclick="switchChart('x','perPost')">Per Post</button>
      <button onclick="switchChart('x','monthly')">Monthly Total</button>
    </div></div>
    <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
  </div>
  <div class="panel">
    <div class="sec-title">Post Feed</div>
    <div class="sec-desc">All posts sorted newest first. Click any post to expand.</div>
    <div class="filter-row">
      <label>Year</label>
      <select id="x-year" onchange="xPage=1;renderFeed('x')"><option value="all">All years</option>${xYears.map(y=>`<option value="${y}">${y}</option>`).join('')}</select>
      <label>Sort by</label>
      <select id="x-sort" onchange="xPage=1;renderFeed('x')"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="eng">Most engaged</option></select>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="x-search" placeholder="Search posts…" oninput="xPage=1;renderFeed('x')">
      </div>
      <span class="results-count" id="x-count"></span>
    </div>
    <div class="post-feed" id="x-feed"></div>
    <div class="pagination" id="x-pages"></div>
  </div>`;
}

// ─── Combined ─────────────────────────────────────────────────────────────────
function renderCombined() {
  const liT=LI_YEARS.reduce((a,y)=>({posts:a.posts+y.posts,eng:a.eng+y.totalEng}),{posts:0,eng:0});
  const xT =X_YEARS.reduce((a,y)=>({posts:a.posts+y.posts,eng:a.eng+y.totalEng}),{posts:0,eng:0});
  const cE=liT.eng+xT.eng,cP=liT.posts+xT.posts;
  const liAvg=liT.posts?(liT.eng/liT.posts).toFixed(1):0,xAvg=xT.posts?(xT.eng/xT.posts).toFixed(1):0;
  const cAvg=cP?(cE/cP).toFixed(1):0,liPct=cE?Math.round(liT.eng/cE*100):0;
  const mult=xAvg>0?Math.round(parseFloat(liAvg)/parseFloat(xAvg)):'—';
  return `
  <div class="note" style="border-color:#D0C4E8;background:#F5F0FC;color:#3D2A6B"><span style="font-size:14px;flex-shrink:0">⚡</span><span>Combined view covers all available data for both platforms. LinkedIn drives significantly higher engagement per post — Heather's stronger reach platform by a wide margin.</span></div>
  <div class="cards">
    <div class="card" style="border-left-color:var(--combined)"><div class="card-yr" style="color:var(--combined)">ALL TIME</div><div class="card-val">${cP}</div><div class="card-lbl">Total posts, both platforms</div></div>
    <div class="card" style="border-left-color:var(--combined)"><div class="card-yr" style="color:var(--combined)">ALL TIME</div><div class="card-val">${fmt(cE)}</div><div class="card-lbl">Combined total engagements</div></div>
    <div class="card" style="border-left-color:var(--combined)"><div class="card-yr" style="color:var(--combined)">ALL TIME</div><div class="card-val">${cAvg}</div><div class="card-lbl">Overall avg eng / post</div></div>
    <div class="card" style="border-left-color:var(--li-blue)"><div class="card-yr" style="color:var(--li-blue)">INSIGHT</div><div class="card-val" style="font-size:20px;color:var(--li-blue)">LinkedIn</div><div class="card-lbl">${liPct}% of all engagements · ${mult}× avg eng/post vs X</div></div>
  </div>
  <div class="compare-grid">
    <div class="compare-card">
      <div class="compare-hdr" style="color:var(--li-blue)"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>LinkedIn</div>
      <div class="stat-row"><span class="stat-name">Total posts</span><span class="stat-val">${liT.posts}</span></div>
      <div class="stat-row"><span class="stat-name">Total engagements</span><span class="stat-val">${liT.eng.toLocaleString()}</span></div>
      <div class="stat-row"><span class="stat-name">Avg eng / post</span><span class="stat-val">${liAvg}</span></div>
      <div class="stat-row"><span class="stat-name">Share of total eng</span><span class="stat-val">${liPct}%</span></div>
    </div>
    <div class="compare-card">
      <div class="compare-hdr" style="color:var(--x-dark)"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>X (Twitter)</div>
      <div class="stat-row"><span class="stat-name">Total posts</span><span class="stat-val">${xT.posts}</span></div>
      <div class="stat-row"><span class="stat-name">Total engagements</span><span class="stat-val">${xT.eng.toLocaleString()}</span></div>
      <div class="stat-row"><span class="stat-name">Avg eng / post</span><span class="stat-val">${xAvg}</span></div>
      <div class="stat-row"><span class="stat-name">Share of total eng</span><span class="stat-val">${100-liPct}%</span></div>
    </div>
  </div>
  <div class="panel">
    <div class="chart-hdr"><div class="chart-title">Monthly engagements — LinkedIn vs. X</div></div>
    <div class="chart-wrap"><canvas id="combinedChart"></canvas></div>
  </div>`;
}

// ─── Charts ───────────────────────────────────────────────────────────────────
function switchChart(platform, mode) {
  if(platform==='li'){liChartMode=mode;const s=document.getElementById('liSeg');if(s){s.children[0].className=mode==='perPost'?'active':'';s.children[1].className=mode==='monthly'?'active':'';};}
  else{xChartMode=mode;const s=document.getElementById('xSeg');if(s){s.children[0].className=mode==='perPost'?'active':'';s.children[1].className=mode==='monthly'?'active':'';};}
  if(activeChart){activeChart.destroy();activeChart=null;}
  drawChart(platform,mode);
}

function drawChart(platform, mode) {
  const canvas=document.getElementById('mainChart');
  if(!canvas) return;
  const feed=platform==='li'?LI_FEED:X_FEED;
  const monthly=platform==='li'?LI_MONTHLY:X_MONTHLY;
  if(!feed.length) return;
  if(mode==='perPost') {
    const datasets={};
    feed.forEach(p=>{
      const yr=p.date.slice(0,4);
      if(!datasets[yr]) datasets[yr]={label:yr,data:[],backgroundColor:(YR_COLORS[yr]||'#999')+'cc',borderColor:YR_COLORS[yr]||'#999',pointRadius:6,pointHoverRadius:8};
      datasets[yr].data.push({x:p.date,y:g(p,'eng')||0,post:(p.post||'').slice(0,80)});
    });
    activeChart=new Chart(canvas,{type:'scatter',data:{datasets:Object.values(datasets)},options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{display:true,labels:{color:'#666',font:{size:11,family:'Inter,sans-serif'},boxWidth:10,padding:14}},
        tooltip:{backgroundColor:'#fff',borderColor:'#E0DDD6',borderWidth:1,titleColor:'#1a1a1a',bodyColor:'#666',padding:10,titleFont:{size:12},bodyFont:{size:12},
          callbacks:{title:items=>fmtDate(items[0].raw.x),label:item=>[' '+item.raw.y+' engagements',' "'+item.raw.post+'…"']}}
      },
      scales:{
        x:{type:'time',time:{unit:'month',tooltipFormat:'MMM yyyy',displayFormats:{month:"MMM ''yy"}},grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#999',font:{size:10},maxTicksLimit:14},border:{color:'#E0DDD6'}},
        y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#999',font:{size:10}},border:{color:'#E0DDD6'}}
      }
    }});
  } else {
    activeChart=new Chart(canvas,{type:'bar',data:{
      labels:monthly.map(m=>fmtMonth(m.month)),
      datasets:[{label:'Total Engagements',data:monthly.map(m=>m.engagements),
        backgroundColor:platform==='li'?'rgba(107,30,46,.6)':'rgba(20,23,26,.5)',
        borderColor:platform==='li'?'#6B1E2E':'#14171A',borderWidth:1,borderRadius:4}]
    },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#fff',borderColor:'#E0DDD6',borderWidth:1,titleColor:'#1a1a1a',bodyColor:'#666',padding:10}},
      scales:{x:{grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#999',font:{size:10}},border:{color:'#E0DDD6'}},y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#999',font:{size:10}},border:{color:'#E0DDD6'}}}}});
  }
}

function drawCombinedChart() {
  const canvas=document.getElementById('combinedChart');
  if(!canvas) return;
  const allM=[...new Set([...LI_MONTHLY.map(m=>m.month),...X_MONTHLY.map(m=>m.month)])].sort();
  const liMap=Object.fromEntries(LI_MONTHLY.map(m=>[m.month,m.engagements]));
  const xMap=Object.fromEntries(X_MONTHLY.map(m=>[m.month,m.engagements]));
  combinedChart=new Chart(canvas,{type:'bar',data:{labels:allM.map(fmtMonth),datasets:[
    {label:'LinkedIn',data:allM.map(m=>liMap[m]||0),backgroundColor:'rgba(107,30,46,.65)',borderColor:'#6B1E2E',borderWidth:1,borderRadius:3},
    {label:'X (Twitter)',data:allM.map(m=>xMap[m]||0),backgroundColor:'rgba(20,23,26,.35)',borderColor:'#14171A',borderWidth:1,borderRadius:3}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{color:'#666',font:{size:11},boxWidth:12,padding:16}},tooltip:{backgroundColor:'#fff',borderColor:'#E0DDD6',borderWidth:1,titleColor:'#1a1a1a',bodyColor:'#666',padding:10}},
    scales:{x:{grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#999',font:{size:10}},border:{color:'#E0DDD6'}},y:{grid:{color:'rgba(0,0,0,.05)'},ticks:{color:'#999',font:{size:10}},border:{color:'#E0DDD6'}}}}});
}

// ─── Feed ──────────────────────────────────────────────────────────────────────
function ctClass(t) {
  const m={'Photo':'ct-photo','Text':'ct-text','Video':'ct-video','Link':'ct-link','Document':'ct-document'};
  return m[t]||'ct-default';
}

function renderFeed(platform) {
  const isLI=platform==='li';
  const feedId=isLI?'li-feed':'x-feed', pagesId=isLI?'li-pages':'x-pages', countId=isLI?'li-count':'x-count';
  const yearId=isLI?'li-year':'x-year', sortId=isLI?'li-sort':'x-sort', searchId=isLI?'li-search':'x-search';
  const feedEl=document.getElementById(feedId), pagesEl=document.getElementById(pagesId), countEl=document.getElementById(countId);
  if(!feedEl) return;
  const allPosts=isLI?LI_FEED:X_FEED;
  const year=document.getElementById(yearId)?.value||'all';
  const sort=document.getElementById(sortId)?.value||'newest';
  const query=(document.getElementById(searchId)?.value||'').toLowerCase();
  let posts=[...allPosts];
  if(year!=='all') posts=posts.filter(p=>p.date.startsWith(year));
  if(query) posts=posts.filter(p=>(p.post||'').toLowerCase().includes(query));
  if(sort==='newest')        posts.sort((a,b)=>b.date.localeCompare(a.date));
  else if(sort==='oldest')   posts.sort((a,b)=>a.date.localeCompare(b.date));
  else if(sort==='eng')      posts.sort((a,b)=>(b.eng||0)-(a.eng||0));
  else if(sort==='reactions') posts.sort((a,b)=>(b.reactions||0)-(a.reactions||0));
  const total=posts.length;
  const page=isLI?liPage:xPage;
  const totalPages=Math.ceil(total/PER_PAGE)||1;
  const start=(page-1)*PER_PAGE, slice=posts.slice(start,start+PER_PAGE);
  if(countEl) countEl.textContent=total===allPosts.length?`${total} posts`:`${total} of ${allPosts.length} posts`;
  if(!slice.length){feedEl.innerHTML='<div class="empty-state">No posts match your filters.</div>';if(pagesEl)pagesEl.innerHTML='';return;}

  if (!window._expandedPosts) window._expandedPosts = new Set();
  feedEl.innerHTML=slice.map((p,idx)=>{
    const eng=g(p,'eng')||0, reactions=g(p,'reactions')||0, comments=g(p,'comments')||0, shares=g(p,'shares')||0, imp=g(p,'imp')||0;
    const postText=p.post||'';
    const ct=p.contentType||'';
    const borderColor=YR_COLORS[p.date.slice(0,4)]||'#6B1E2E';
    const needsTrunc=postText.length>200;
    const uid=p.link||(p.date+String(start+idx));
    const isExpanded=window._expandedPosts.has(uid);
    const pills=[];
    if(eng)       pills.push(`<span class="metric-pill highlight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>${eng} eng</span>`);
    if(reactions) pills.push(`<span class="metric-pill">👍 ${reactions}</span>`);
    if(comments)  pills.push(`<span class="metric-pill">💬 ${comments}</span>`);
    if(shares)    pills.push(`<span class="metric-pill">↺ ${shares}</span>`);
    if(imp)       pills.push(`<span class="metric-pill">👁 ${imp.toLocaleString()}</span>`);
    const liSvg=`<svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>`;
    const xSvg=`<svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`;
    const viewLink=p.link?`<a class="view-link${isLI?'':' view-link-x'}" href="${escAttr(p.link)}" target="_blank" rel="noopener">${isLI?liSvg:xSvg} View on ${isLI?'LinkedIn':'X'}</a>`:'<span></span>';
    return `<div class="post-card" style="border-left-color:${borderColor}">
      <div class="post-header">
        <div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap">
          <span class="post-date">${fmtDate(p.date)}</span>
          <span class="ctype-badge">${escHtml(ct)}</span>
        </div>
        <div class="post-metrics">${pills.join('')}</div>
      </div>
      <div class="post-body">
        <div class="post-text${isExpanded?' expanded':''}" id="pt-${start+idx}">${escHtml(postText)}</div>
      </div>
      <div class="post-footer">
        ${needsTrunc?`<button class="expand-btn" onclick="togglePost('${escAttr(uid)}',${start+idx})" id="pb-${start+idx}">${isExpanded?'▲ Show less':'▼ Read more'}</button>`:'<span></span>'}
        ${viewLink}
      </div>
    </div>`;
  }).join('');

  // Pagination
  if(pagesEl){
    let ph=`<button class="page-btn" onclick="${isLI?'liPage':'xPage'}=${page-1};renderFeed('${platform}')" ${page<=1?'disabled':''}>← Prev</button>`;
    const startP=Math.max(1,page-2), endP=Math.min(totalPages,page+2);
    if(startP>1) ph+=`<button class="page-btn" onclick="${isLI?'liPage':'xPage'}=1;renderFeed('${platform}')">1</button>${startP>2?'<span class="page-info">…</span>':''}`;
    for(let i=startP;i<=endP;i++) ph+=`<button class="page-btn${i===page?' active':''}" onclick="${isLI?'liPage':'xPage'}=${i};renderFeed('${platform}')">${i}</button>`;
    if(endP<totalPages) ph+=`${endP<totalPages-1?'<span class="page-info">…</span>':''}<button class="page-btn" onclick="${isLI?'liPage':'xPage'}=${totalPages};renderFeed('${platform}')">${totalPages}</button>`;
    ph+=`<button class="page-btn" onclick="${isLI?'liPage':'xPage'}=${page+1};renderFeed('${platform}')" ${page>=totalPages?'disabled':''}>Next →</button>`;
    ph+=`<span class="page-info">${start+1}–${Math.min(start+PER_PAGE,total)} of ${total}</span>`;
    pagesEl.innerHTML=ph;
  }
}

function togglePost(uid, idx) {
  const textEl=document.getElementById('pt-'+idx);
  const btnEl =document.getElementById('pb-'+idx);
  if(!textEl) return;
  const expanded=textEl.classList.toggle('expanded');
  if(btnEl) btnEl.textContent=expanded?'▲ Show less':'▼ Read more';
  if(!window._expandedPosts) window._expandedPosts=new Set();
  expanded?window._expandedPosts.add(uid):window._expandedPosts.delete(uid);
}

function fmt(n){if(n>=1000)return(n/1000).toFixed(1).replace(/\.0$/,'')+'K';return String(n);}
function fmtMonth(str){const[y,m]=str.split('-');const N=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return N[parseInt(m)]+" '"+y.slice(2);}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function makeBar(label,val,total,color){const pct=Math.round(val/total*100);return`<div class="bar-item"><div class="bar-label-row"><span class="bar-label">${label}</span><span class="bar-count">${val} (${pct}%)</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div></div>`;}
</script>
</body>
</html>
